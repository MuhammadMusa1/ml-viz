     "lat":[0.96, 0.88, 0.84, 0.67, 0.89, 0.9, 6.84, 1.09, 1.26, 0.73, 1.18, 0.92, 0.74, 0.91, 0.98, 6.69, 0.65, 0.79, 1.02, 0.98, 0.92, 0.85, 1.12, 0.9, 0.79, 0.7, 0.85, 1.2, 1.07, 1.04, 0.72, 0.77, 0.77, 0.68, 0.93, 0.77, 0.64, 4.11, 0.92, 4.19, 0.59, 0.85, 0.7, 0.82, 0.83, 0.89, 0.65, 1.15, 1.29, 1.12, 1.06, 0.58, 0.83, 0.55, 1.01, 0.84, 0.68, 0.65, 0.94, 1.29, 1.07, 0.8, 0.89, 0.73, 0.48, 0.71, 0.83, 0.67, 0.58, 1.06, 0.87, 1.48, 0.91, 0.56, 0.93, 7.39, 0.79, 0.86, 1.26, 1.02, 0.69, 0.98, 1.17, 1.05, 0.86, 1.26, 0.93, 0.86, 0.83, 1.32, 0.78, 0.87, 0.68, 0.85, 0.79, 0.75, 0.9, 1.58, 1.28, 0.89, 0.91, 0.91, 0.74, 0.8, 0.81, 0.98, 0.81, 0.81, 0.87, 6.95, 0.88, 0.83, 7.05, 1.04, 1.02, 1.07, 0.8, 0.53, 1.23, 0.66, 0.7, 0.79, 0.92, 0.89, 0.74, 0.86, 5.24, 1.2, 0.86, 1.17, 0.8, 1.11, 0.82, 0.87, 0.61, 0.97, 0.8, 0.93, 0.73, 0.92, 1.23, 7.29, 0.76, 1.06, 0.77, 0.78, 4.83, 0.89, 0.66, 8.69, 0.76, 0.97, 4.94, 0.89, 0.76, 0.71, 0.77, 0.94, 0.87, 1.09, 0.95, 0.94, 0.61, 0.8, 1.06, 0.95, 0.89, 0.83, 0.86, 1.36, 0.61, 0.96, 1.13, 8.06, 0.99, 0.88, 0.78, 1.15, 0.64, 0.89, 0.74, 0.54, 0.72, 0.57, 1.07, 0.93, 0.83, 0.65, 0.9, 0.55, 0.9, 0.66, 1.08, 0.63, 0.78, 0.74, 1.09, 5.55, 0.69, 1.23]}/* data:end */;
    var ORDER = DATA.blocks.map(function (b) { return b.id; });

    // ======================= p95 (как numpy.percentile, линейная интерполяция) =======================
    function percentile(a, q) {
      var s = a.slice().sort(function (x, y) { return x - y; }), h = (s.length - 1) * q / 100, f = Math.floor(h);
      return f + 1 < s.length ? s[f] + (h - f) * (s[f + 1] - s[f]) : s[f];
    }
    var LAT = { mean: DATA.lat.reduce(function (s, v) { return s + v; }, 0) / DATA.lat.length, med: percentile(DATA.lat, 50), p95: percentile(DATA.lat, 95) };

    // ======================= Варианты схемы (игра) =======================
    // Схема = эталонный продакшн с одной поломкой: блок убран (drop) или вынесен в облако (cloud)
    var ROUNDS = [{ drop: 'gout' }, { cloud: 'llm' }, { drop: 'eval' }, { drop: 'gate' }, { drop: 'logs' }, { cloud: 'vdb' }];
    function schema(stage, variant) {
      return DATA.blocks.map(function (b) {
        var x = { id: b.id, c: b.c, r: b.r, w: b.w || 1, dashed: stage === 'proto' && !!b.prod, gone: false, cloud: false };
        if (variant && variant.drop === b.id) x.gone = true;
        if (variant && variant.cloud === b.id) x.cloud = true;
        return x;
      });
    }
    // Слабое место ищем сравнением с эталоном: какого блока нет или какой ушёл за контур
    function weakSpot(sc) {
      var ref = schema('prod', null);
      for (var i = 0; i < sc.length; i++) {
        if (sc[i].gone && !ref[i].gone) return sc[i].id;
        if (sc[i].cloud && !ref[i].cloud) return sc[i].id;
      }
      return null;
    }

    // ======================= Состояние =======================
    var state = { mode: 'explore', stage: 'prod', sel: 'orch', focus: 3, game: null };
    function curSchema() { return state.mode === 'game' && state.game ? schema('prod', state.game.v) : schema(state.stage, null); }

    // ======================= Рисование =======================
    var cv = el('cv'), g, BOX = [];
    function resize() {
      var w = (cv.parentElement.clientWidth - 20) / MLViz.zoom();
      g = MLViz.fitCanvas(cv, w < 620 ? 1.9 : 0.6);
      draw();
    }
    function wrapLines(ctx, text, maxW) {
      var words = text.split(' '), lines = [], line = '';
      words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
      if (line) lines.push(line);
      return lines;
    }
    function name(b) { return T(b.cloud ? 'b_' + b.id + '_cloud' : 'b_' + b.id); }
    function draw() {
      var ctx = g.ctx, fs = MLPro.fs(g), sc = curSchema(), narrow = g.w < 620;
      ctx.clearRect(0, 0, g.w, g.h);
      var cloudW = sc.some(function (b) { return b.cloud; }) ? (narrow ? 0 : g.w * 0.2) : 0;
      var top = fs * 2.2, left = 10, W = g.w - 20 - cloudW, cols = 5, rows = 3;
      // Раскладка: широкий экран — сетка 5×3, телефон — 3 столбца по рядам
      BOX = sc.map(function (b, i) {
        var x, y, w, h;
        if (!narrow) {
          var cw = W / cols, rh = (g.h - top - 16) / rows;
          x = left + b.c * cw + 14; y = top + b.r * rh + 12; w = b.w * cw - 28; h = rh - 28;
        } else {
          var k = i, cw2 = W / 2, rh2 = (g.h - top - 16) / 6;
          x = left + (k % 2) * cw2 + 12; y = top + Math.floor(k / 2) * rh2 + 10; w = cw2 - 24; h = rh2 - 24;
        }
        if (b.cloud) {   // вынесенный в облако блок — справа за пределами контура (на телефоне — внизу справа)
          if (!narrow) { x = g.w - cloudW + 4; w = cloudW - 10; }   // на телефоне блок остаётся на месте: облако видно по названию и рамке
        }
        return { b: b, x: x, y: y, w: w, h: h };
      });
      // Контур банка
      ctx.setLineDash([8, 6]); ctx.strokeStyle = MLViz.cssVar('--n-400'); ctx.lineWidth = 2;
      MLPro.rr(ctx, 4, top - 6, g.w - 8 - cloudW, g.h - top - 2, 12); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = MLViz.cssVar('--text-2'); ctx.font = MLPro.font(fs, true); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(T('perimeter'), 8, 4);
      if (cloudW) { ctx.textAlign = 'right'; ctx.fillText(T('cloud'), g.w - 6, 4); }
      // Связи — путь запроса (стрелки между центрами блоков)
      function c(id) { for (var i = 0; i < BOX.length; i++) if (BOX[i].b.id === id) return BOX[i]; }
      // Точка на краю блока по направлению к другой точке — стрелка видна в зазоре, а не под блоком
      function edge(r, tx, ty) {
        var cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = tx - cx, dy = ty - cy;
        var k = Math.min(Math.abs((r.w / 2) / (dx || 1e-9)), Math.abs((r.h / 2) / (dy || 1e-9)));
        return { x: cx + dx * k, y: cy + dy * k };
      }
      function arrow(a, b, dashed) {
        var p0 = edge(a, b.x + b.w / 2, b.y + b.h / 2), p1 = edge(b, a.x + a.w / 2, a.y + a.h / 2);
        var ang = Math.atan2(p1.y - p0.y, p1.x - p0.x), hs = 9;
        ctx.strokeStyle = MLViz.cssVar('--n-200'); ctx.fillStyle = MLViz.cssVar('--n-200'); ctx.lineWidth = 2;
        ctx.setLineDash(dashed ? [6, 5] : []);
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p1.x - hs * Math.cos(ang - 0.45), p1.y - hs * Math.sin(ang - 0.45));
        ctx.lineTo(p1.x - hs * Math.cos(ang + 0.45), p1.y - hs * Math.sin(ang + 0.45)); ctx.closePath(); ctx.fill();
      }
      DATA.links.forEach(function (l) {
        var a = c(l[0]), b = c(l[1]); if (a.b.gone || b.b.gone) return;
        arrow(a, b, false);
      });

      DATA.links.forEach(function (l, i) {
        var a = c(l[0]), b = c(l[1]);
        if (!b.b.gone) return;
        var nx = DATA.links.filter(function (m) { return m[0] === l[1]; })[0]; if (!nx) return;
        arrow(a, c(nx[1]), true);
      });
      var paper = MLViz.cssVar('--paper'), paper2 = MLViz.cssVar('--paper-2'), ink = MLViz.cssVar('--ink');
      var hideAns = state.mode === 'game' && state.game && !state.game.answered;
      BOX.forEach(function (bx, i) {
        var b = bx.b;
        if (b.gone) return;   // убранного блока на схеме просто нет — его и надо заметить

        ctx.fillStyle = b.dashed ? paper2 : paper; ctx.fill();

        if (b.cloud && !hideAns) { ctx.setLineDash([6, 4]); ctx.strokeStyle = MLViz.cssVar('--c-odd'); ctx.lineWidth = 4; ctx.stroke(); ctx.setLineDash([]); }
        var selected = state.mode === 'explore' && b.id === state.sel, focused = state.mode === 'explore' && i === state.focus && document.activeElement === cv;
        if (selected || focused) { ctx.strokeStyle = MLViz.cssVar('--n-100'); ctx.lineWidth = selected ? 4 : 2; MLPro.rr(ctx, bx.x - 3, bx.y - 3, bx.w + 6, bx.h + 6, 10); ctx.stroke(); }
        ctx.fillStyle = ink; ctx.font = MLPro.font(fs, true); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        var lines = wrapLines(ctx, name(b), bx.w - 14), lh = Math.round(fs * 1.25);
        if (b.dashed) lines.push(T('inProd'));
        var y0 = bx.y + Math.max(6, (bx.h - lines.length * lh) / 2);
        lines.forEach(function (ln, k) { ctx.font = MLPro.font(fs, k < lines.length - (b.dashed ? 1 : 0)); ctx.fillText(ln, bx.x + 7, y0 + k * lh); });
      });
    }

    // ======================= Панель =======================
    function info(id) {
      if (!id) return '<p>' + T('pickHint') + '</p>';
      var m = T('m_' + id).split('|'), html = '<p class="name">' + esc(T('b_' + id)) + '</p>' +
        '<h4>' + T('hWhy') + '</h4><p>' + esc(T('w_' + id)) + '</p>' +
        '<h4>' + T('hBreak') + '</h4><p>' + esc(T('k_' + id)) + '</p>' +
        '<h4>' + T('hMetrics') + '</h4><ul>' + m.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      if (id === 'mon') html += '<h4>' + T('latTitle') + '</h4><div class="kpis" style="margin-top:6px">' +
        '<div class="kpi"><small>' + T('latMean', { m: MLPro.fix(LAT.mean, 2) }) + '</small></div>' +
        '<div class="kpi"><small>' + T('latMed', { md: MLPro.fix(LAT.med, 2) }) + '</small></div>' +
        '<div class="kpi"><small>' + T('latP95', { p: MLPro.fix(LAT.p95, 2) }) + '</small></div></div>';
      return html;
    }
    function updatePanel() {
      MLViz.setPressed(el('stageSeg'), function (b) { return b.dataset.v === state.stage; });
      el('stageNote').textContent = T(state.stage === 'proto' ? 'protoNote' : 'prodNote');
      el('blocks').innerHTML = ORDER.map(function (id) { return '<button type="button" data-b="' + id + '" aria-pressed="' + (id === state.sel) + '">' + esc(T('b_' + id)) + '</button>'; }).join('');
      el('info').innerHTML = info(state.sel);
    }
    function refresh() { updatePanel(); draw(); }
    function select(id) { state.sel = id; state.focus = ORDER.indexOf(id); refresh(); }

    // ======================= Игра «Найди слабое место» =======================
    var ERR = ['gout', 'llm', 'eval', 'gate', 'logs', 'vdb'];
    var quiz = MLViz.quiz({
      box: el('gamePanel'), rounds: ROUNDS.length,
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return T('gameOver', { s: q.score, n: q.n }); }
      },
      start: function (q) { q.data.order = MLViz.shuffle(ROUNDS, Math.random); },
      round: function (q) {
        var v = q.data.order[q.i], truth = weakSpot(schema('prod', v));

        var opts = MLViz.shuffle([truth].concat(MLViz.shuffle(ERR.filter(function (e) { return e !== truth; }), Math.random).slice(0, 3)), Math.random);
        q.choices(el('gameChoices'), opts.map(function (e) { return esc(T('e_' + e)); }), function (k) { return opts[k] === truth; }, function (k, ok) {
          state.game.answered = true;
          q.answer(ok ? 1 : 0, '<b>' + T(ok ? 'gameRight' : 'gameWrong') + '</b> ' + T('gameWas', { e: esc(T('e_' + truth)) }) + ' ' + esc(T('k_' + truth)));

    function setMode(m) {
      state.mode = m;
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('explorePanel').hidden = m !== 'explore';
      el('gamePanel').hidden = m !== 'game';

    el('blocks').addEventListener('click', function (e) { var b = e.target.closest('button[data-b]'); if (b) select(b.dataset.b); });
    cv.addEventListener('click', function (e) {

      BOX.forEach(function (bx) { if (!bx.b.gone && p.x >= bx.x && p.x <= bx.x + bx.w && p.y >= bx.y && p.y <= bx.y + bx.h) select(bx.b.id); });
    });
    // Клавиатура на схеме: стрелки — переход между блоками, Enter или пробел — открыть описание
    cv.addEventListener('keydown', function (e) {
      if (state.mode !== 'explore') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { state.focus = (state.focus + 1) % ORDER.length; e.preventDefault(); draw(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { state.focus = (state.focus + ORDER.length - 1) % ORDER.length; e.preventDefault(); draw(); }
      else if (e.key === 'Enter' || e.key === ' ') { select(ORDER[state.focus]); e.preventDefault(); }
    });
    cv.addEventListener('focus', draw); cv.addEventListener('blur', draw);
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });
    MLPro.onResize(resize);

    window.PRO_ARCH = { lat: LAT, weakSpot: function (i) { return weakSpot(schema('prod', ROUNDS[i])); } };   // для сверки (tools/check_pro.py)

    resize();
    setMode('explore');
  })();
