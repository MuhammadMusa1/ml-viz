        tryTitle: 'Попробуй сам',
        tryBody:
          '<ul>' +
          '<li>Начни с «клиент» и нажимай «Самое вероятное слово». Получится ли когда-нибудь другая фраза? А если поставить температуру 1.5 и тянуть по вероятностям?</li>' +
          '<li>Дойди до «модель нашла ответ в». Сколько вариантов у следующего слова и откуда эти доли?</li>' +
          '<li>Найди шаг, где автодополнитель смотрит только на одно последнее слово. Почему он так делает и чем это плохо?</li>' +
          '<li>Почему настоящей LLM не хватит счётчиков, как здесь? Что будет со счётчиками, если фраз не 32, а миллиарды и контекст — не 2 слова, а 100 000 токенов?</li>' +
          '<li>Модель эмбеддингов bge-m3 — это LLM или нет? Найди её в таблице «Виды LLM» и объясни ответ.</li>' +
          '</ul>',
        mathTitle: 'Для любопытных: формула',
        mathBody:
          '<p>Автодополнитель — модель на триграммах с откатом. Вероятность слова w после двух слов a, b: <code>P(w | a, b) = N(a, b, w) / N(a, b)</code>, где N — сколько раз сочетание встретилось в фразах. Если «a b» не встречалось — откат на одно слово: <code>P(w | b) = N(b, w) / N(b)</code>, если и его нет — на частоту слов.</p>' +
          '<p>Температура: <code>P_T(w) ∝ P(w)^(1/T)</code> — то же, что softmax(log P / T). При T = 0 берём самое вероятное слово.</p>' +
          '<p>LLM считает <code>P(w | весь предыдущий текст)</code> нейросетью: <code>softmax(W · h / T)</code>, где h — вектор последнего токена после всех слоёв трансформера. Счётчики не умеют обобщать на невиданные сочетания, нейросеть — умеет.</p>' +
          '<p>Код ниже запускается в Colab целиком и даёт те же числа, что страница:</p>' +
          '<pre class="pycode"><code>from collections import Counter, defaultdict\n\n' +
          'phrases = [\'модель нашла ответ в документах .\', \'модель нашла ответ в регламенте .\',\n' +
          '           \'ассистент нашёл ответ в документах .\', \'модель не нашла ответ .\']   # часть фраз страницы\n\n' +
          'tri, bi = defaultdict(Counter), defaultdict(Counter)\n' +
          'for s in phrases:\n' +
          '    t = [\'&lt;s&gt;\', \'&lt;s&gt;\'] + s.split()\n' +
          '    for i in range(2, len(t)):\n' +
          '        tri[(t[i-2], t[i-1])][t[i]] += 1\n' +
          '        bi[t[i-1]][t[i]] += 1\n\n' +
          'def probs(a, b):\n' +
          '    c = tri[(a, b)] or bi[b]          # откат, если двух слов вместе не было\n' +
          '    n = sum(c.values())\n' +
          '    return {w: k / n for w, k in c.most_common()}\n\n' +
          'print(probs(\'ответ\', \'в\'))      # {\'документах\': 0.67, \'регламенте\': 0.33}\n' +
          'print(probs(\'нашла\', \'ответ\'))</code></pre>',
        teacherTitle: 'Для учителя',
        teacherBody:
          '<p><b>Данные.</b> 32 короткие фразы про банк и разработку. Автодополнитель считает настоящие вероятности по счётчикам триграмм с откатом; температура применяется как в П3. Сверка — <code>tools/check_pro.py</code>. Игра — 10 примеров, ответ — самый внутренний слой.</p>' +
          '<p><b>Как использовать на занятии.</b> 0–10 мин: спросить, чем отличаются AI, ML, нейросети и ChatGPT, записать ответы, потом разложить их по матрёшке. Дальше — достроить фразу автодополнителем всей группой, голосуя за следующее слово.</p>' +
          '<p><b>Вопросы для обсуждения.</b> Антифрод на правилах — это ИИ? Почему LLM «не знает» вчерашних новостей? Почему модель на 14 миллиардов параметров работает на сервере без видеокарты, но медленно? Когда банку достаточно классического ML, а LLM избыточна?</p>',
        footer: 'Раздел «Для профи». Все расчёты выполняются прямо в браузере, без интернета и без настоящей модели.'
      }
    };

    var T = MLPro.init(STR), el = MLPro.el, esc = MLPro.esc;
    el('cv').setAttribute('aria-label', T('cvLabel'));
    el('temp').setAttribute('aria-label', T('tLabel'));

    // ======================= Данные =======================
    // Фразы автодополнителя (слова через пробел, точка — отдельный токен) и примеры игры с ответом-слоем
    var DATA = /* data:start */{
     "layers": ["ai", "ml", "dl", "llm"],
     "phrases": [
      "клиент открыл карту в приложении .", "клиент открыл вклад в приложении .", "клиент открыл вклад в офисе .",
      "клиент закрыл карту в приложении .", "клиент заблокировал карту в приложении .", "клиент перевёл деньги на карту .",
      "клиент перевёл деньги другу .", "клиент оплатил покупку картой .", "клиент спросил ассистента о тарифе .",
      "клиент спросил оператора о кредите .", "оператор открыл заявку на кредит .", "оператор одобрил заявку на кредит .",
      "оператор отклонил заявку на кредит .", "оператор ответил клиенту .", "модель одобрила заявку на кредит .",
      "модель отклонила заявку на кредит .", "модель нашла ответ в документах .", "модель нашла ответ в регламенте .",
      "модель не нашла ответ .", "модель угадала следующее слово .", "ассистент нашёл ответ в документах .",
      "ассистент нашёл ошибку в коде .", "ассистент написал тест для кода .", "ассистент объяснил код разработчику .",
      "ассистент ответил клиенту о тарифе .", "разработчик написал код .", "разработчик написал тест для кода .",
      "разработчик проверил код ассистента .", "разработчик нашёл ошибку в коде .", "банк выдал кредит клиенту .",
      "банк выдал карту клиенту .", "банк открыл новый офис ."],
     "starts": ["клиент", "модель", "ассистент", "разработчик", "оператор", "банк"],
     "rounds": [["rules","ai"],["knn","ml"],["mnist","dl"],["chat","llm"],["chess","ai"],["tree","ml"],["speech","dl"],["cft","llm"],["forest","ml"],["image","dl"]]
    }/* data:end */;
    var LAYERS = DATA.layers;

    // ======================= Модель: триграммы с откатом =======================
    var TRI = {}, BI = {}, UNI = {};
    function inc(map, k, w) { (map[k] = map[k] || {})[w] = (map[k][w] || 0) + 1; }
    DATA.phrases.forEach(function (s) {
      var t = ['<s>', '<s>'].concat(s.split(' '));
      for (var i = 2; i < t.length; i++) {
        inc(TRI, t[i - 2] + ' ' + t[i - 1], t[i]); inc(BI, t[i - 1], t[i]);
        UNI[t[i]] = (UNI[t[i]] || 0) + 1;
      }
    });
    // Вероятности следующего слова по двум последним: самый длинный встреченный контекст, потом откат
    function dist(a, b, temp) {
      var c = TRI[a + ' ' + b], order = 3;
      if (!c) { c = BI[b]; order = 2; }
      if (!c) { c = UNI; order = 1; }
      var words = Object.keys(c), n = words.reduce(function (s, w) { return s + c[w]; }, 0);
      var p = words.map(function (w) { return { w: w, k: c[w], p: c[w] / n }; });
      // Сортировка: по вероятности, при равенстве — по алфавиту (так и в сверке на Python)
      p.sort(function (x, y) { return y.p - x.p || (x.w < y.w ? -1 : x.w > y.w ? 1 : 0); });
      if (temp === 0) p.forEach(function (x, i) { x.q = i === 0 ? 1 : 0; });
      else {
        var z = p.map(function (x) { return Math.pow(x.p, 1 / temp); }), s = z.reduce(function (u, v) { return u + v; }, 0);
        p.forEach(function (x, i) { x.q = z[i] / s; });
      }
      return { order: order, n: n, items: p };
    }

    // ======================= Состояние =======================
    var state = { mode: 'explore', layer: 3, seq: ['клиент'], temp: 1, game: null };

    // ======================= Матрёшка слоёв =======================
    var cv = el('cv'), g, BOXES = [];
    function resize() {
      var w = (cv.parentElement.clientWidth - 20) / MLViz.zoom();
      g = MLViz.fitCanvas(cv, w < 560 ? 1.15 : 0.5);
      draw();
    }
    function draw() {
      var ctx = g.ctx, fs = MLPro.fs(g), lh = Math.round(fs * 1.35), narrow = g.w < 560;
      ctx.clearRect(0, 0, g.w, g.h);
      var hl = state.mode === 'game' ? (state.game && state.game.answered ? LAYERS.indexOf(state.game.right) : -1) : state.layer;
      var fills = ['--surface-1', '--surface-2', '--surface-3', '--paper'];
      BOXES = [];
      // Каждый слой — прямоугольник внутри предыдущего; сверху у каждого остаётся полоса под подпись
      var x = 2, y = 2, w = g.w - 4, h = g.h - 4, head = lh * 2 + 12, side = narrow ? 12 : g.w * 0.07;
      LAYERS.forEach(function (id, i) {
        BOXES.push({ x: x, y: y, w: w, h: h, i: i });
        MLPro.rr(ctx, x, y, w, h, 14);
        ctx.fillStyle = MLViz.cssVar(fills[i]); ctx.fill();
        ctx.lineWidth = i === hl ? 4 : 1.5;
        ctx.strokeStyle = i === hl ? MLViz.cssVar('--accent') : MLViz.cssVar('--line-strong'); ctx.stroke();
        var ink = i === 3 ? MLViz.cssVar('--ink') : MLViz.cssVar('--text-strong');
        ctx.fillStyle = ink; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.font = MLPro.font(fs + 2, true);
        ctx.fillText(T(narrow ? 's_' + id : 'l_' + id), x + 12, y + 8);
        ctx.font = MLPro.font(fs);
        ctx.fillStyle = i === 3 ? ink : MLViz.cssVar('--text-2');
        ctx.fillText(T('sub_' + id), x + 12, y + 8 + lh + 2);
        // Внутри LLM — её конвейер одной строкой с переносами: так видно, что внутри самой маленькой матрёшки
        if (i === 3) {
          ctx.font = MLPro.font(fs); ctx.fillStyle = ink;
          MLPro.wrap(ctx, T('pipe'), w - 24).forEach(function (ln, k) { ctx.fillText(ln, x + 12, y + 8 + lh * 2 + 12 + k * lh); });
        }
        x += side; y += head; w -= side * 2; h -= head + (narrow ? 10 : 14);
      });
    }
    function layerAt(p) {
      for (var i = BOXES.length - 1; i >= 0; i--) { var b = BOXES[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return i; }
      return -1;
    }

    // ======================= Панель слоёв =======================
    function renderLayers() {
      el('layerSel').innerHTML = LAYERS.map(function (id, i) { return '<button type="button" data-i="' + i + '">' + T('l_' + id) + '</button>'; }).join('');
    }
    function updatePanel() {
      var id = LAYERS[state.layer];
      MLViz.setPressed(el('layerSel'), function (b) { return +b.dataset.i === state.layer; });
      el('layerInfo').innerHTML = '<h3>' + T('l_' + id) + '</h3>' +
        '<div><b>' + T('kWhat') + ':</b> ' + T('d_' + id) + '</div>' +
        '<div><b>' + T('kData') + ':</b> ' + T('t_' + id) + '</div>' +
        '<div><b>' + T('kEx') + ':</b> ' + T('e_' + id) + '</div>';
    }

    // ======================= Автодополнитель =======================
    function ctx2() { var s = ['<s>', '<s>'].concat(state.seq); return [s[s.length - 2], s[s.length - 1]]; }
    function ended() { return state.seq[state.seq.length - 1] === '.'; }
    function renderGen() {
      MLViz.setPressed(el('starts'), function (b) { return b.dataset.w === state.seq[0]; });
      el('genLine').innerHTML = state.seq.map(function (w, i) { return i === state.seq.length - 1 && state.seq.length > 1 ? '<span class="last">' + esc(w) + '</span>' : esc(w); }).join(' ');
      el('tVal').textContent = MLPro.fix(state.temp, 1);
      if (ended()) {
        el('orderNote').textContent = T('done'); el('cands').innerHTML = '';
        el('greedyBtn').disabled = el('sampleBtn').disabled = true;
        return;
      }
      el('greedyBtn').disabled = el('sampleBtn').disabled = false;
      var c = ctx2(), d = dist(c[0], c[1], state.temp);
      el('orderNote').textContent = T('order' + d.order, { a: c[0] === '<s>' ? '…' : c[0], b: c[1], n: d.n });
      el('cands').innerHTML = d.items.slice(0, 8).map(function (x) {
        var pct = MLPro.pct(x.q, x.q < 0.1 && x.q > 0 ? 1 : 0);
        return '<button type="button" class="cand" data-w="' + esc(x.w) + '" aria-label="' + esc(T('candAria', { w: x.w, p: pct })) + '">' +
          '<span>' + esc(x.w) + '</span><span class="bar"><i style="width:' + (100 * x.q) + '%"></i></span><span class="p">' + pct + '</span></button>';
      }).join('');
    }
    function step(pick) {
      if (ended()) return;
      var c = ctx2(), d = dist(c[0], c[1], state.temp), w;
      if (pick === 'greedy') w = d.items[0].w;
      else {   // жребий по вероятностям с температурой
        var r = Math.random(), acc = 0; w = d.items[d.items.length - 1].w;
        for (var i = 0; i < d.items.length; i++) { acc += d.items[i].q; if (r < acc) { w = d.items[i].w; break; } }
      }
      state.seq.push(w); renderGen();
    }

    // ======================= Игра «Какой это слой?» =======================
    var order = [];
    var quiz = MLViz.quiz({
      box: el('gamePanel'), rounds: DATA.rounds.length,
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return T('gameOver', { s: q.score, n: q.n }); }
      },
      start: function () { order = MLViz.shuffle(DATA.rounds, Math.random); },
      round: function (q) {
        var r = order[q.i], right = r[1];
        state.game = { right: right, answered: false };
        el('gameItem').innerHTML = '<b>' + esc(T('g_' + r[0])) + '</b>';
        q.choices(el('gameChoices'), LAYERS.map(function (id) { return T('l_' + id); }), function (k) { return LAYERS[k] === right; }, function (k, ok) {
          state.game.answered = true;
          q.answer(ok ? 1 : 0, T('gameLine', { verdict: T(ok ? 'gameRight' : 'gameWrong'), l: T('l_' + right), why: esc(T('w_' + r[0])) }));
          draw();
        });
        draw();
      },
      onEnd: function () { state.game = null; el('gameChoices').innerHTML = ''; el('gameItem').innerHTML = ''; draw(); }
    });

    function setMode(m) {
      state.mode = m;
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('explorePanel').hidden = m !== 'explore';
      el('gamePanel').hidden = m !== 'game';
      el('hint').textContent = T(m === 'explore' ? 'hintExplore' : 'hintGame');
      if (m === 'game') quiz.start(); else state.game = null;   // выбранный слой в «Исследуй» игра не трогает
      draw();
    }

    // ======================= События =======================
    renderLayers();
    el('starts').innerHTML = DATA.starts.map(function (w) { return '<button type="button" data-w="' + esc(w) + '">' + esc(w) + '</button>'; }).join('');
    el('layerSel').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.layer = +b.dataset.i; updatePanel(); draw();
    });
    cv.addEventListener('click', function (e) {
      if (state.mode !== 'explore') return;
      var i = layerAt(MLViz.pointer(cv, e)); if (i < 0) return;
      state.layer = i; updatePanel(); draw();
    });
    el('starts').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.seq = [b.dataset.w]; renderGen();
    });
    el('cands').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || ended()) return;
      state.seq.push(b.dataset.w); renderGen();
    });
    el('greedyBtn').addEventListener('click', function () { step('greedy'); });
    el('sampleBtn').addEventListener('click', function () { step('sample'); });
    el('resetBtn').addEventListener('click', function () { state.seq = [state.seq[0]]; renderGen(); });
    el('temp').addEventListener('input', function (e) { state.temp = +e.target.value; renderGen(); });
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });
    MLPro.onResize(resize);

    window.PRO_LLM = { dist: dist };   // для сверки (tools/check_pro.py)

    updatePanel(); renderGen(); resize(); setMode('explore');
  })();
  </script>
</body>
