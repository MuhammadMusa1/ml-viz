        "gameAsk": "Бикаш: <b>{c}</b>. Кӯшиш кун на мисли мисолҳои худат — каме дигар хел, тавре ки дӯстат мекашид.",

        "howTitle": "Ин чӣ тавр кор мекунад",
        "howBody": "<ol><li><b>Маълумот ҷамъ кун.</b> Ҳал кун, ки кадом синфҳоро фарқ мекунӣ ва аз ҳар кадом 5–10 мисол бикаш. Гуногунӣ аз миқдор муҳимтар аст.</li><li><b>Аугментатсия.</b> Ҳар як мисолро каме мелағжонем ва мегардонем — аз як расм 9-то ҳосил мешавад. Модел ашёро «аз тарафҳои гуногун» мебинад ва расмҳои мушаххасро камтар аз ёд мекунад.</li><li><b>Эксперти тайёр (transfer learning).</b> Шабакаи дарси 14 аллакай дидани хатҳо ва каҷиҳоро метавонад. Мо онро ях мекунем ва 128 адади онро ҳамчун аломатҳои расм мегирем. Аммо эксперти рақамҳо на ҳамеша кӯмак мекунад: ҳар қадар расмҳои ту ба рақамҳо камтар монанд бошанд, фоида ҳамон қадар камтар аст. Бинобар ин барои аксҳо MobileNetV2-ро мегиранд — вай дар миллион акси гуногунтарин омӯхтааст.</li><li><b>Таснифгари худ.</b> Дар боло — модели содда: дар байни мисолҳои ту аз ҳама монандтаринашро меҷӯяд (KNN бо K = 1).</li><li><b>Санҷиши софдилона ва барнома.</b> Дар мисолҳое месанҷем, ки модел онҳоро надидааст. Дар Colab чунин моделро ба Gradio (дарси 20) мепечонанд ва пайвандро ба дӯстон мефиристанд.</li></ol>",
        "tryTitle": "Худат санҷ",
        "tryBody": "<ul><li>Якчанд маротиба «Ба ҷои ман мисолҳо кашидан»-ро пахш кун. Кӣ бештар саҳеҳтар аст: «Эксперти тайёр» ё «Пикселҳои оддӣ»? Чаро эксперти рақамҳо бо шаклҳо кӯмак карда наметавонад?</li><li>Аугментатсияро хомӯш кун. Санҷиши софдилона чӣ тавр тағйир ёфт? Чаро?</li><li>Дар кунҷи майдон давраро хеле хурд бикаш. Оё модел меёбад? Чаро ба марказ мувофиқ кардани расм ба ӯ кӯмак мекунад?</li><li>Синфҳои худро фикр кун — масалан, «табассум» ва «ғамгинӣ». Барои он ки модел ёфтанро сар кунад, чанд мисол лозим аст?</li><li>«Бозӣ: санҷиш аз дӯст»-ро бозӣ кун. Дар кадом расмҳо модел хато мекунад?</li></ul>",
        "mathTitle": "Барои кунҷковон: формула",
        "mathBody": "<p>Аломатҳои расм: <code>h = ReLU(x · W₁ + b₁)</code> — қабати пинҳонии шабакаи дарси 14 (128 адад). Монандии ду расм — масофа байни h-ҳои онҳост. Ҷавоб — синфи мисоли наздиктарин (KNN, K = 1).</p><p>Дар Colab бо аксҳо (мисли боби 16) эксперти тайёр — шабакаи MobileNetV2, ки дар миллион акс омӯхта шудааст. Аксҳоро ба ҷузвдонҳои <code>my_photos/синф1</code>, <code>my_photos/синф2</code> гузор ва ба кор андоз:</p><p><code>import tensorflow as tf<br>from tensorflow.keras import layers<br><br>train = tf.keras.utils.image_dataset_from_directory('my_photos', image_size=(160, 160), validation_split=0.25, subset='training', seed=42)<br>val = tf.keras.utils.image_dataset_from_directory('my_photos', image_size=(160, 160), validation_split=0.25, subset='validation', seed=42)<br><br>base = tf.keras.applications.MobileNetV2(input_shape=(160, 160, 3), include_top=False, weights='imagenet')<br>base.trainable = False&nbsp;&nbsp;# яхкунӣ: ба дониши эксперт даст намерасонем<br><br>model = tf.keras.Sequential([<br>&nbsp;&nbsp;layers.RandomFlip('horizontal'), layers.RandomRotation(0.1),&nbsp;&nbsp;# аугментатсия<br>&nbsp;&nbsp;layers.Rescaling(1 / 127.5, offset=-1),&nbsp;&nbsp;# миқёсе, ки MobileNetV2 интизор аст<br>&nbsp;&nbsp;base, layers.GlobalAveragePooling2D(),<br>&nbsp;&nbsp;layers.Dense(len(train.class_names), activation='softmax'),&nbsp;&nbsp;# таснифгари худ<br>])<br>model.compile(optimizer='adam', loss='sparse_categorical_crossentropy', metrics=['accuracy'])<br>model.fit(train, validation_data=val, epochs=5)</code></p>",
        "teacherTitle": "Барои омӯзгор",
        "teacherBody": "<p><b>Дар ин ҷо чӣ ҳақиқӣ аст.</b> «Эксперти тайёр» — шабакаи дарси 14 (784 → 128 → 10, дар MNIST омӯхта шудааст); 128 нейрони қабати пинҳонии он мисли MobileNetV2 дар боби 16 ҳамчун аломат хизмат мекунанд. Таснифгар — KNN бо K = 1 аз рӯи ин аломатҳо. Дар мисолҳои «Ба ҷои ман кашидан» (5 шакл аз ҳар як намуд, ба ҳисоби миёна аз рӯи 20 генератсия) эксперт бе аугментатсия тақрибан 66% ва бо он 71% медиҳад, пикселҳои оддӣ бошанд — 72% ва 78%: аугментатсия кӯмак мекунад, аммо эксперти рақамҳо дар шаклҳо аз пикселҳо беҳтар нест. Ин натиҷаи софдилона аст — сабаби хуб барои муҳокимаи он, ки интиқоли дониш кай кор мекунад. Аугментатсия — 8 нусхаи ҳар як мисол (лағжишҳо ба 2 катак, гардишҳо ба ±12°). Санҷиши софдилона — «яктогӣ» (leave-one-out): мисоли пинҳоншуда ва нусхаҳои он ба омӯзиш намеафтанд. Ҳамааш дар браузер ҳисоб карда мешавад; бо sklearn муқоиса кардан лозим нест — маълумотро худи хонанда мекашад.</p><p><b>Дар дарс чӣ тавр истифода бурдан мумкин аст.</b> 0–10 дақ: синф ду синфро фикр мекунад, се хонанда дар проектор мисол мекашанд, боқимондаҳо кӯшиш мекунанд моделро «фиреб диҳанд». Баъд муқоисаи «эксперт / пикселҳо» ва «бо аугментатсия / бе он». Сипас лоиҳа бо аксҳо дар Colab аз рӯи боби 16.</p><p><b>Саволҳо барои муҳокима.</b> Чаро шабакае, ки дар рақамҳо омӯхтааст, барои фарқ кардани шаклҳо кӯмак мекунад? Чаро ҳангоми санҷиш дар омӯзиш гузоштани нусхаҳои мисоли пинҳоншуда мумкин нест? Барои датасети хуб чанд мисол лозим аст?</p>",
        "colab": "Кушодани дафтари дарс дар Colab",
        "footer": "Эксперти тайёр — шабакае, ки дар MNIST (LeCun, Cortes, Burges) омӯхта шудааст. Ҳамаи ҳисобҳо бевосита дар браузер иҷро мешаванд."
      }
      /* tg:end */
    };

    MLViz.renderHeader('../../');
    MLViz.applyI18n(STR);
    var T = function (k, v) { return MLViz.t(STR, k, v); };
    var el = function (id) { return document.getElementById(id); };
    el('pad').setAttribute('aria-label', T('padLabel'));
    el('gallery').setAttribute('aria-label', T('galleryLabel'));
    el('aug').setAttribute('aria-label', T('augLabel'));

    // ======================= Состояние =======================
    var NAMES = T('defaults').split('|');
    var state = {
      mode: 'explore', count: 3, cur: 0, feat: 'expert', aug: true,
      classes: NAMES.map(function (n) { return { name: n, ex: [] }; }),   // ex — рисунки 28 × 28 после подгонки в центр
      raw: new Uint8Array(784), game: null
    };
    function active() { return state.classes.slice(0, state.count); }
    function ready() { return active().every(function (c) { return c.ex.length >= 3; }); }

    // ======================= Аугментация: сдвиги и повороты =======================
    function transform(img, dx, dy, deg) {
      var out = new Uint8Array(784), a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
      for (var r = 0; r < 28; r++) for (var c = 0; c < 28; c++) {
        var x = c - 13.5 - dx, y = r - 13.5 - dy;                       // обратное преобразование: откуда взять клетку
        var sc = Math.round(ca * x + sa * y + 13.5), sr = Math.round(-sa * x + ca * y + 13.5);
        if (sr >= 0 && sr < 28 && sc >= 0 && sc < 28) out[r * 28 + c] = img[sr * 28 + sc];
      }
      return out;
    }
    var AUG = [[2, 0, 0], [-2, 0, 0], [0, 2, 0], [0, -2, 0], [0, 0, 12], [0, 0, -12], [2, 2, 6], [-2, -2, -6]];
    function variants(img) { return [img].concat(AUG.map(function (t) { return transform(img, t[0], t[1], t[2]); })); }

    // ======================= Признаки и классификатор =======================
    // Признаки: 128 нейронов замороженной сети урока 14 или голые 784 пикселя. Длина вектора = 1 — сравниваем форму, а не яркость.
    var featCache = new WeakMap();
    function feature(img) {
      var key = state.feat, m = featCache.get(img) || {};
      if (!m[key]) {
        var v = key === 'expert' ? Array.from(MLDigits.forward(img).h) : Array.from(img, function (x) { return x / 255; });
        var n = Math.sqrt(v.reduce(function (s, x) { return s + x * x; }, 0)) || 1;
        m[key] = v.map(function (x) { return x / n; });
        featCache.set(img, m);
      }
      return m[key];
    }
    function dist(a, b) { var s = 0; for (var i = 0; i < a.length; i++) { var d = a[i] - b[i]; s += d * d; } return s; }
    var augCache = new WeakMap();
    function trainSet(skip) {               // skip — пример, который прячем при проверке (вместе с его копиями)
      var out = [];
      active().forEach(function (c, ci) {
        c.ex.forEach(function (img) {
          if (img === skip) return;
          var list = state.aug ? (augCache.get(img) || (augCache.set(img, variants(img)), augCache.get(img))) : [img];
          list.forEach(function (v) { out.push({ f: feature(v), y: ci }); });
        });
      });
      return out;
    }
    function nearest(img, set) {           // KNN, K = 1: класс самого похожего примера
      var f = feature(img), best = null, bd = Infinity;
      set.forEach(function (s) { var d = dist(f, s.f); if (d < bd) { bd = d; best = s.y; } });
      return best;
    }
    // Честная проверка «по одному» (leave-one-out): спрятанный пример и все его копии не участвуют в обучении
    function evaluate() {
      var n = 0, ok = 0, sizes = active().map(function (c) { return c.ex.length; });
      active().forEach(function (c, ci) { c.ex.forEach(function (img) { n++; if (nearest(img, trainSet(img)) === ci) ok++; }); });
      return { ok: ok, n: n, lazy: Math.max.apply(null, sizes) };
    }

    // ======================= «Нарисовать примеры за меня»: круги, квадраты, треугольники с разбросом =======================
    // Как рисуют дети: фигура повёрнута на случайный угол, вытянута, линии дрожат, иногда не до конца замкнута
    function shape(kind) {
      var raw = new Uint8Array(784), R = Math.random, cx = 14, cy = 14, s = 6 + R() * 4;
      var sxk = 0.7 + R() * 0.6, rot = R() * Math.PI * 2, wob = function () { return (R() - 0.5) * 2.4; }, pts = [], i;
      if (kind === 0) for (i = 0; i <= 20 - Math.floor(R() * 3); i++) { var a = i / 20 * Math.PI * 2; pts.push([s * Math.cos(a), s * Math.sin(a)]); }
      else if (kind === 1) pts = [[-s, -s], [s, -s], [s, s], [-s, s], [-s, -s]];
      else pts = [[0, -s], [s, s * 0.8], [-s, s * 0.8], [0, -s]];
      pts = pts.map(function (p) {
        var x = p[0] * sxk, y = p[1];
        return [cx + x * Math.cos(rot) - y * Math.sin(rot) + wob(), cy + x * Math.sin(rot) + y * Math.cos(rot) + wob()];
      });
      for (i = 1; i < pts.length; i++) MLDigits.line(raw, pts[i - 1], pts[i]);
      return MLDigits.toMnist(raw);
    }

    // ======================= Рисование =======================
    var pad = el('pad'), gal = el('gallery'), augCv = el('aug'), gp, gg, ga, cellPx, padX, padY;
    function resize() {
      gp = MLViz.fitCanvas(pad, 0.6);
      gg = MLViz.fitCanvas(gal, 0.42);
      ga = MLViz.fitCanvas(augCv, 0.2);
      draw();
    }
    function img28(ctx, img, x, y, size) {
      ctx.fillStyle = '#17132E'; ctx.fillRect(x, y, size, size);
      var c = size / 28;
      for (var i = 0; i < 784; i++) if (img[i]) { ctx.fillStyle = MLDigits.gray(img[i]); ctx.fillRect(x + (i % 28) * c, y + Math.floor(i / 28) * c, c + 0.4, c + 0.4); }
    }
    function draw() {
      var ctx = gp.ctx, size = Math.min(gp.w, gp.h) - 8;
      cellPx = size / 28; padX = (gp.w - size) / 2; padY = (gp.h - size) / 2;
      ctx.clearRect(0, 0, gp.w, gp.h);
      img28(ctx, state.raw, padX, padY, size);
      ctx.strokeStyle = 'rgba(169,162,204,.35)'; ctx.lineWidth = 1; ctx.strokeRect(padX, padY, size, size);
      drawGallery(); drawAug(); updatePanel();
    }
    function drawGallery() {
      var ctx = gg.ctx, fs = MLViz.fontPx(gg.w), rows = active(), rh = (gg.h - 8) / rows.length, t = Math.min(rh - fs - 10, 46);
      ctx.clearRect(0, 0, gg.w, gg.h);
      ctx.font = 'bold ' + fs + 'px Calibri, system-ui, sans-serif'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
      rows.forEach(function (c, ci) {
        var y = 4 + ci * rh, per = Math.max(1, Math.floor(gg.w / (t + 4)));
        ctx.fillStyle = ci === state.cur && state.mode === 'explore' ? '#EEEAFB' : '#C9C3E6';
        ctx.fillText(c.name + ' — ' + c.ex.length, 0, y);
        c.ex.slice(-per).forEach(function (img, k) { img28(ctx, img, k * (t + 4), y + fs + 6, t); });
      });
    }
    function drawAug() {
      var ctx = ga.ctx, src = MLDigits.toMnist(state.raw), t = Math.min(ga.h - 4, (ga.w - 8 * 6) / 9);
      ctx.clearRect(0, 0, ga.w, ga.h);
      if (!src.some(function (v) { return v; })) return;
      variants(src).forEach(function (v, k) { img28(ctx, v, k * (t + 6), 2, t); });
    }

    // ======================= Панель =======================
    function updatePanel() {
      MLViz.setPressed(el('countBtns'), function (b) { return +b.dataset.v === state.count; });
      MLViz.setPressed(el('featBtns'), function (b) { return b.dataset.v === state.feat; });
      el('featNote').textContent = T(state.feat === 'expert' ? 'featExpert' : 'featPixels');
      el('addBtn').textContent = T('addAs', { c: state.classes[state.cur].name });
      el('addBtn').hidden = state.mode !== 'explore';
      var img = MLDigits.toMnist(state.raw), empty = !img.some(function (v) { return v; });
      var hideGame = state.mode === 'game' && !(state.game && state.game.checked);
      if (!ready()) { el('pred').textContent = '—'; el('predNote').textContent = T('predNeed'); }
      else if (empty || hideGame) { el('pred').textContent = '—'; el('predNote').textContent = empty ? T('predEmpty') : ''; }
      else {
        var p = active()[nearest(img, trainSet(null))].name;
        el('pred').textContent = p; el('predNote').textContent = T('predNote', { c: p });
      }
      if (!ready()) { el('evalNum').textContent = '—'; el('evalNote').textContent = T('evalNeed'); }
      else {
        var e = evaluate();
        el('evalNum').textContent = Math.round(100 * e.ok / e.n) + '%';
        el('evalNote').textContent = T('evalNote', { c: e.ok, n: e.n, l: e.lazy });
      }
    }
    function renderNames() {
      el('names').innerHTML = active().map(function (c, i) {
        return '<div class="row" style="flex-wrap:nowrap"><button type="button" data-i="' + i + '" aria-label="' + T('pickAria', { c: c.name }) + '">' + (i + 1) +
          '</button><input type="text" maxlength="20" data-i="' + i + '" aria-label="' + T('classAria', { i: i + 1 }) + '"></div>';
      }).join('');
      el('names').querySelectorAll('input').forEach(function (inp) { inp.value = state.classes[+inp.dataset.i].name; });
      MLViz.setPressed(el('names'), function (b) { return +b.dataset.i === state.cur; });
    }

    // Рисование на поле
    var drawing = false, last = null;
    function stroke(ev) {
      if (state.game && state.game.checked) return;
      var p = MLViz.pointer(pad, ev), cx = (p.x - padX) / cellPx, cy = (p.y - padY) / cellPx;
      MLDigits.line(state.raw, last || [cx, cy], [cx, cy]);
      last = [cx, cy];
      draw();
    }
    pad.addEventListener('pointerdown', function (e) { drawing = true; last = null; pad.setPointerCapture(e.pointerId); stroke(e); });
    pad.addEventListener('pointermove', function (e) { if (drawing) stroke(e); });
    pad.addEventListener('pointerup', function () { drawing = false; });
    pad.addEventListener('pointercancel', function () { drawing = false; });

    // ======================= Игра «Проверка от друга» (общий компонент MLViz.quiz) =======================
    // 5 раундов: просим нарисовать случайный класс, модель угадывает. Очко — если модель права.
    var quiz = MLViz.quiz({
      box: el('gamePanel'), rounds: function () { return ready() ? 5 : 1; },
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return q.data.blocked ? T('gameNeed') : T('gameOver', { s: q.score, n: q.n, v: T(q.score >= 4 ? 'goGood' : q.score >= 2 ? 'goMid' : 'goLow') }); }
      },
      start: function (q) { q.data.blocked = !ready(); el('score').textContent = 0; },
      round: function (q) {
        state.raw = new Uint8Array(784);
        if (q.data.blocked) { state.game = null; el('gameAsk').textContent = T('gameNeed'); el('checkBtn').hidden = true; q.answer(0, ''); draw(); return; }
        var ci = Math.floor(Math.random() * state.count);
        state.game = { ci: ci, checked: false, q: q };
        el('gameAsk').innerHTML = T('gameAsk', { c: active()[ci].name });
        el('checkBtn').hidden = false;
        draw();
      },
      onEnd: function () { el('checkBtn').hidden = true; }
    });
    el('checkBtn').addEventListener('click', function () {
      var gm = state.game; if (!gm || gm.checked) return;
      var img = MLDigits.toMnist(state.raw);
      if (!img.some(function (v) { return v; })) { el('gameResult').textContent = T('gEmpty'); return; }
      var p = nearest(img, trainSet(null)), ok = p === gm.ci;
      gm.checked = true;
      gm.q.answer(ok ? 1 : 0, ok ? T('gRight', { c: active()[gm.ci].name }) : T('gWrong', { p: active()[p].name, c: active()[gm.ci].name }));
      el('score').textContent = gm.q.score;
      draw();
    });

    var savedRaw = null;
    function setMode(m) {
      if (m === 'game' && state.mode === 'explore') savedRaw = state.raw;
      state.mode = m;
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('explorePanel').style.display = m === 'explore' ? 'flex' : 'none';
      el('gamePanel').hidden = m !== 'game';
      el('hint').textContent = T(m === 'explore' ? 'hintExplore' : 'hintGame');
      if (m === 'game') { quiz.start(); return; }
      state.game = null;
      if (savedRaw) { state.raw = savedRaw; savedRaw = null; }   // рисунок «Исследуй» после игры на месте
      draw();
    }

    // ======================= События =======================
    el('countBtns').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.count = +b.dataset.v; if (state.cur >= state.count) state.cur = 0;
      renderNames(); draw();
    });
    el('names').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.cur = +b.dataset.i; renderNames(); draw(); } });
    el('names').addEventListener('input', function (e) {
      if (e.target.tagName !== 'INPUT') return;
      state.classes[+e.target.dataset.i].name = e.target.value || ('#' + (+e.target.dataset.i + 1));
      draw();
    });
    el('featBtns').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.feat = b.dataset.v; draw(); } });
    el('augOn').addEventListener('change', function (e) { state.aug = e.target.checked; draw(); });
    el('addBtn').addEventListener('click', function () {
      var img = MLDigits.toMnist(state.raw);
      if (!img.some(function (v) { return v; })) return;
      state.classes[state.cur].ex.push(img);
      state.raw = new Uint8Array(784);
      draw();
    });
    el('clearBtn').addEventListener('click', function () { if (state.game && state.game.checked) return; state.raw = new Uint8Array(784); draw(); });
    el('demoBtn').addEventListener('click', function () {
      state.count = 3;
      NAMES.forEach(function (n, i) { state.classes[i].name = n; state.classes[i].ex = []; for (var k = 0; k < 5; k++) state.classes[i].ex.push(shape(i)); });
      renderNames(); draw();
    });
    el('resetBtn').addEventListener('click', function () { active().forEach(function (c) { c.ex = []; }); draw(); });
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });

    var colab = el('colabLink');
    if (colab.getAttribute('href')) colab.hidden = false;
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 120); });

    renderNames();
    resize();
    setMode('explore');
  })();
  </script>
</body>
</html>
