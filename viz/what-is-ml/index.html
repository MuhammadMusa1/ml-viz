<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Что такое машинное обучение · Лаборатория ML</title>
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <div class="analogy-box" data-i18n-html="analogy"></div>

    <div class="viz-layout">
      <div class="stage">
        <canvas id="cv" class="drag"></canvas>
        <div class="legend" style="padding:8px 4px 0">
          <!-- Задача «Gentoo или нет»: два вида вместе — один ответ, поэтому в легенде они рядом -->
          <span><i style="background:var(--adelie)"></i><i style="background:var(--chinstrap)"></i><span data-i18n="legNot"></span></span>
          <span><i style="background:var(--gentoo)"></i>Gentoo</span>
          <span id="legUnseen"><i class="dash"></i><span data-i18n="legUnseen"></span></span>
          <span><i class="ring"></i><span data-i18n="legTest"></span></span>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <aside class="panel">
        <div class="seg modes" id="modes">
          <button type="button" id="modeExplore" data-i18n="modeExplore"></button>
          <button type="button" id="modeGame" data-i18n="modeGame"></button>
        </div>

        <div id="featBox">
          <h3 data-i18n="featTitle"></h3>
          <div class="seg" id="featBtns" style="margin-top:6px"></div>
        </div>

        <!-- Правило ученика: всё, что делается на графике, доступно и здесь (клавиатура) -->
        <div>
          <h3 data-i18n="youTitle"></h3>
          <p style="margin:6px 0" id="youRule"></p>
          <input type="range" id="thr">
          <div class="seg" id="sideBtns" style="margin-top:6px">
            <button type="button" data-side="1" data-i18n="sideMore"></button>
            <button type="button" data-side="-1" data-i18n="sideLess"></button>
          </div>
        </div>

        <!-- Режим «Исследуй» -->
        <div id="explorePanel" class="divider" style="display:flex; flex-direction:column; gap:14px">
          <div>
            <h3 data-i18n="pcTitle"></h3>
            <p style="margin:6px 0 4px"><span data-i18n="nLabel"></span> <b id="nVal"></b></p>
            <input type="range" id="n" min="1" max="273" step="1" value="10">
            <p style="margin:6px 0 0" id="pcRule"></p>
            <p class="note" data-i18n="pcHow"></p>
          </div>
          <div class="divider">
            <h3 data-i18n="accTitle"></h3>
            <div class="row" style="margin-top:8px; justify-content:space-between">
              <div><div class="big-number" id="accYou"></div><small data-i18n="you"></small></div>
              <div><div class="big-number" id="accPc"></div><small data-i18n="computer"></small></div>
            </div>
            <p class="note" id="accNote"></p>
            <button type="button" id="testBtn" class="primary" style="margin-top:10px" data-i18n="testBtn"></button>
            <p class="note" data-i18n="fairNote"></p>
          </div>
        </div>

        <!-- Игра «Правило по 8 примерам» -->
        <div id="gamePanel" class="divider" hidden>
          <h3 id="gameStep"></h3>
          <p style="margin:6px 0 0" id="gameAsk"></p>
          <button type="button" id="checkBtn" class="primary" style="margin-top:10px" data-i18n="check"></button>
          <p id="gameResult" role="status" style="margin:10px 0 0"></p>
          <button type="button" id="nextBtn" class="primary" style="margin-top:10px" hidden></button>
          <div class="row" style="margin-top:12px; justify-content:space-between">
            <div><div class="big-number" id="scoreYou">0</div><small data-i18n="youRounds"></small></div>
            <div><div class="big-number" id="scorePc">0</div><small data-i18n="pcRounds"></small></div>
          </div>
        </div>
      </aside>
    </div>

    <section class="section">
      <h2 data-i18n="howTitle"></h2>
      <div data-i18n-html="howBody"></div>
    </section>

    <section class="section">
      <h2 data-i18n="lifeTitle"></h2>
      <div data-i18n-html="lifeBody"></div>
    </section>

    <section class="section">
      <h2 data-i18n="tryTitle"></h2>
      <div data-i18n-html="tryBody"></div>
    </section>

    <details class="box">
      <summary data-i18n="mathTitle"></summary>
      <div data-i18n-html="mathBody"></div>
    </details>

    <details class="box">
      <summary data-i18n="teacherTitle"></summary>
      <div data-i18n-html="teacherBody"></div>
      <div class="lesson-links" style="margin-top:10px">
        <!-- TODO: вставить ссылку на ноутбук урока 1 в Colab -->
        <a class="btn" id="colabLink" href="" target="_blank" rel="noopener" data-i18n="colab" hidden></a>
      </div>
    </details>
  </main>

  <footer class="site-footer"><div class="wrap" data-i18n-html="footer"></div></footer>

  <script src="../../assets/core.js"></script>
  <script src="../../assets/catalog.js"></script>

        goYou: 'Ты победил! По 8 примерам человек вполне может найти правило лучше компьютера. Но тебе на каждое правило нужно время, а компьютер так же быстро разберётся с тысячами примеров и десятками признаков.',
        goPc: 'Компьютер оказался точнее. Он перебирает все границы и не ошибается в счёте — и так же быстро справится с тысячами примеров и десятками признаков.',

        howBody:

          '<li><b>Задача.</b> По одному <b>признаку</b> (свойству пингвина, например длине крыла) понять: Gentoo перед нами или нет. Adelie и Chinstrap здесь считаются вместе — «не Gentoo».</li>' +

        tryTitle: 'Попробуй сам',
        tryBody:
          '<ul>' +
          '<li>Поставь свою границу для длины крыла только по примерам сверху и нажми «Проверить на новых пингвинах». Сколько угадало твоё правило? А правило компьютера?</li>' +
          '<li>Подвигай «Сколько примеров видел компьютер» от 1 до 30. Почему сначала правила нет совсем? Что происходит с границей на 13 и 14 примерах?</li>' +

          '<li>Сыграй «Игра: правило по 8 примерам». Кто точнее, когда примеров мало: ты или компьютер?</li>' +
          '</ul>',
        mathTitle: 'Для любопытных: формула',
        mathBody:
          '<p>Компьютер пробует каждую границу посередине между соседними значениями примеров. Для каждой границы он считает, насколько «смешаны» две группы — слева и справа. Это <b>Gini</b> — смешанность группы: 0 = все одного вида.</p>' +
          '<p><code>Gini = 1 − (доля Gentoo)² − (доля не Gentoo)²</code></p>' +
          '<p>Побеждает граница, где у двух групп вместе меньше всего смешанности (Gini каждой группы умножается на число пингвинов в ней). Это дерево решений с одним вопросом — целое дерево разберём на уроке 7.</p>' +
          '<p>В Python это:</p>' +
          '<p><code>from palmerpenguins import load_penguins<br>' +
          'from sklearn.model_selection import train_test_split<br>' +
          'from sklearn.tree import DecisionTreeClassifier<br><br>' +
          'df = load_penguins().drop(columns=[\'sex\']).dropna().reset_index(drop=True)<br>' +
          'X = df[[\'flipper_length_mm\']]&nbsp;&nbsp;# признак: длина крыла<br>' +
          'y = df[\'species\'] == \'Gentoo\'&nbsp;&nbsp;# ответ: Gentoo или нет<br>' +

        teacherBody:

    var FEATS = [

    ];
    var all = PENGUINS.rows.map(function (r) {
      return { si: SPECIES.indexOf(r[0]), g: r[0] === 'Gentoo', v: FEATS.map(function (f) { return r[f.col]; }), test: r[6] === 1, pos: r[7] };
    });
    // Порядок строк как в X_train / X_test из sklearn: «первые n примеров» — те же, что X_train[:n] в Colab
    var byPos = function (a, b) { return a.pos - b.pos; };
    var train = all.filter(function (p) { return !p.test; }).sort(byPos);
    var test = all.filter(function (p) { return p.test; }).sort(byPos);
    var LAZY = test.filter(function (p) { return !p.g; }).length;   // «ленивая» модель: всегда «не Gentoo»

    // ======================= Модель: одно правило «если…, то…» (как DecisionTreeClassifier(max_depth=1)) =======================
    // sklearn хранит признаки как float32 — повторяем это, чтобы пороги совпали до последней цифры
    function gini(a, b) { var n = a + b; return n ? 1 - (a * a + b * b) / (n * n) : 0; }
    function majority(no, yes) { return yes > no; }   // при ничьей — «не Gentoo» (False раньше True, как в sklearn)
    function fitRule(pts, fi) {
      var yes = pts.filter(function (p) { return p.g; }).length, no = pts.length - yes;
      if (!yes || !no) return { leaf: true, g: yes > 0 };
      var s = pts.map(function (p) { return { v: Math.fround(p.v[fi]), g: p.g }; }).sort(function (a, b) { return a.v - b.v; });
      var best = -Infinity, rule = null, lYes = 0, lNo = 0;
      for (var i = 0; i < s.length - 1; i++) {
        if (s[i].g) lYes++; else lNo++;
        if (s[i + 1].v <= s[i].v + 1e-7) continue;          // между одинаковыми значениями границу не ставят
        var rYes = yes - lYes, rNo = no - lNo, nl = lYes + lNo, nr = rYes + rNo;
        var score = -nr * gini(rNo, rYes) - nl * gini(lNo, lYes);
        if (score > best) {                                  // строго лучше: при равенстве остаётся левая граница, как в sklearn
          best = score;
          var thr = s[i].v / 2 + s[i + 1].v / 2;
          if (thr === s[i + 1].v) thr = s[i].v;
          rule = { leaf: false, thr: thr, left: majority(lNo, lYes), right: majority(rNo, rYes) };
        }
      }
      return rule || { leaf: true, g: majority(no, yes) };
    }
    function pcPredict(rule, v) { return rule.leaf ? rule.g : (Math.fround(v) <= rule.thr ? rule.left : rule.right); }
    // Правило ученика: side = 1 — «больше → Gentoo», -1 — «меньше → Gentoo»
    function youPredict(u, v) { return u.side > 0 ? v > u.thr : v < u.thr; }
    function countRight(pred, fi) { return test.filter(function (p) { return pred(p.v[fi]) === p.g; }).length; }

    // Правило компьютера по первым n примерам — кешируем: ползунок двигают часто
    var ruleCache = {};
    function pcRule(fi, n) {
      var key = fi + '|' + n;
      if (!ruleCache[key]) ruleCache[key] = fitRule(train.slice(0, n), fi);
      return ruleCache[key];
    }

    // ======================= Состояние =======================
    function defaultUser(f) { return { thr: Math.round((f.lo + f.hi) / 2 / f.step) * f.step, side: 1 }; }
    var state = {
      mode: 'explore', fi: 0, n: 10, checked: false,   // checked — открыты ли новые пингвины в «Исследуй»
      user: FEATS.map(defaultUser),     // своё правило для каждого признака
      game: null                        // {pts, rule, checked}
    };
    var saved = null;                   // настройки «Исследуй» на время игры

    function fmt(v, dec) { return String(+v.toFixed(dec)); }
    function ruleText(fi, side, thr) {
      var f = FEATS[fi];
      return T('rule', { f: T('fl_' + f.id), side: T(side > 0 ? 'more' : 'less'), v: fmt(thr, f.dec), u: T(f.unit) });
    }
    function pcRuleText(fi, r) {
      if (r.leaf) return T('pcAlways', { c: r.g ? 'Gentoo' : T('notGentoo') });
      // Граница найдена, но с обеих сторон большинство одного ответа — правило на деле одно для всех
      if (r.left === r.right) {
        var f = FEATS[fi];
        return T('pcSame', { v: fmt(r.thr, f.dec), u: T(f.unit), c: r.left ? 'Gentoo' : T('notGentoo') });
      }
      return ruleText(fi, r.right ? 1 : -1, r.thr);
    }

    // ======================= Рисование =======================
    var cv = el('cv');
    var g, PAD, sx, L;   // L — разметка зон по вертикали

    // Стопки: каждый пингвин — кружок в своей «корзинке» по значению признака
    // seen(p) — видел ли компьютер этого пингвина: виденные внизу стопки, чтобы «знания» росли снизу вверх
    function stacks(pts, fi, seen) {
      var f = FEATS[fi], h = {}, out = [];
      var rank = function (p) { return (seen && !seen(p) ? 10 : 0) + p.si; };
      pts.slice().sort(function (a, b) { return rank(a) - rank(b); }).forEach(function (p) {
        var b = Math.floor((p.v[fi] - f.lo) / f.bw);
        h[b] = (h[b] || 0) + 1;
        out.push({ p: p, b: b, k: h[b] - 1 });
      });
      return { items: out, max: Math.max.apply(null, Object.keys(h).map(function (k) { return h[k]; }).concat([1])) };
    }

    function layout() {
      var f = FEATS[state.fi], fs = MLViz.fontPx(g.w);
      sx = MLViz.scale(f.lo, f.hi, PAD.l, g.w - PAD.r);
      var binPx = sx(f.lo + f.bw) - sx(f.lo);
      var tr = stacks(train, state.fi), te = stacks(test, state.fi);
      var top = PAD.t + 2 * (fs + 10), cap = fs + 8, gap = 14;
      var avail = g.h - PAD.b - top - 2 * cap - gap - 6;
      var d = Math.min(binPx, 16, avail / (tr.max + te.max));
      L = { fs: fs, d: d, binPx: binPx, tagY: PAD.t, trCap: top, trTop: top + cap, trBase: top + cap + tr.max * d,
            teBase: g.h - PAD.b - 4 };
      L.teCap = L.trBase + gap;
    }

    function resize() {
      var narrow = cv.parentElement.clientWidth < 560;
      g = MLViz.fitCanvas(cv, narrow ? 1.05 : 0.7);
      PAD = MLViz.plotPad(g.w, 0);
      PAD.l = 14;   // делений по Y нет — слева место не нужно
      draw();
    }

    function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

    function tag(ctx, x, row, text, color) {
      var fs = L.fs, y = L.tagY + row * (fs + 10);
      ctx.font = 'bold ' + fs + 'px Calibri, system-ui, sans-serif';
      var w = ctx.measureText(text).width + 14;
      var x0 = Math.max(2, Math.min(g.w - w - 2, x - w / 2));
      ctx.fillStyle = color; ctx.fillRect(x0, y, w, fs + 6);
      ctx.fillStyle = '#17132E'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(text, x0 + 7, y + (fs + 6) / 2 + 1);
    }

    function vline(ctx, x, color, width) {
      ctx.strokeStyle = color; ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(x, L.tagY); ctx.lineTo(x, L.teBase + 2); ctx.stroke();
    }

    function draw() {
      if (!g) return;
      layout();
      var ctx = g.ctx, f = FEATS[state.fi], fi = state.fi, gm = state.game, inGame = state.mode === 'game';
      ctx.clearRect(0, 0, g.w, g.h);
      MLViz.drawAxes(ctx, { w: g.w, h: g.h, pad: PAD, sx: sx, sy: function () { return 0; },
        xTicks: f.ticks, yTicks: [], xLabel: T('axis_' + f.id), yLabel: '' });

      // Сторона «Gentoo» по правилу ученика — лёгкая подсветка
      var u = state.user[fi], ux = sx(u.thr);
      ctx.save(); ctx.globalAlpha = 0.09; ctx.fillStyle = COLORS[2];
      if (u.side > 0) ctx.fillRect(ux, L.trTop, g.w - PAD.r - ux, L.teBase - L.trTop);
      else ctx.fillRect(PAD.l, L.trTop, ux - PAD.l, L.teBase - L.trTop);
      ctx.restore();

      // Подписи зон
      ctx.fillStyle = '#C9C3E6'; ctx.font = L.fs + 'px Calibri, system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(T('capTrain'), PAD.l, L.trCap);
      var showTest = inGame ? (gm && gm.checked) : state.checked;
      ctx.fillText(T(showTest ? 'capTest' : 'capTestHidden'), PAD.l, L.teCap);

      var r = Math.max(2, L.d / 2 - 0.6);
      function cx(it) { return sx(f.lo + (it.b + 0.5) * f.bw); }

      // Примеры для учёбы: в игре — только 8 выданных, в «Исследуй» — все, но невиданные пунктиром
      var seenSet = inGame ? gm.pts : train.slice(0, state.n);
      var seen = function (p) { return seenSet.indexOf(p) !== -1; };
      stacks(inGame ? gm.pts : train, fi, seen).items.forEach(function (it) {
        var x = cx(it), y = L.trBase - (it.k + 0.5) * L.d, col = COLORS[it.p.si];
        circle(ctx, x, y, r);
        if (seen(it.p)) { ctx.fillStyle = col; ctx.fill(); }
        else { ctx.setLineDash([2, 2]); ctx.strokeStyle = col; ctx.globalAlpha = 0.55; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }
      });

      // Новые пингвины (test) — кольцами
      if (showTest) {
        stacks(test, fi).items.forEach(function (it) {
          circle(ctx, cx(it), L.teBase - (it.k + 0.5) * L.d, Math.max(1.5, r - 1));
          ctx.strokeStyle = COLORS[it.p.si]; ctx.lineWidth = 2; ctx.stroke();
        });
      }

      // Правило компьютера (в игре — только после проверки)
      var pr = inGame ? (gm.checked ? gm.rule : null) : pcRule(fi, state.n);
      if (pr && !pr.leaf) { var px = sx(pr.thr); vline(ctx, px, C_PC, 3); tag(ctx, px, 1, T('tagPc') + ' ' + fmt(pr.thr, f.dec), C_PC); }

      // Правило ученика — белая линия с «ручкой»
      vline(ctx, ux, C_TEXT, 3);
      tag(ctx, ux, 0, T('tagYou') + ' ' + fmt(u.thr, f.dec) + (u.side > 0 ? ' →' : ' ←'), C_TEXT);
    }

    // ======================= Панель =======================
    function syncControls() {
      var f = FEATS[state.fi], u = state.user[state.fi], thr = el('thr');
      thr.min = f.lo; thr.max = f.hi; thr.step = f.step; thr.value = u.thr;
      MLViz.setPressed(el('featBtns'), function (b) { return +b.dataset.fi === state.fi; });
      MLViz.setPressed(el('sideBtns'), function (b) { return +b.dataset.side === u.side; });
    }

    function updatePanel() {
      var fi = state.fi, u = state.user[fi];
      el('youRule').innerHTML = ruleText(fi, u.side, u.thr);
      if (state.mode !== 'explore') return;
      var r = pcRule(fi, state.n);
      el('nVal').textContent = T('nOf', { n: state.n });
      el('pcRule').innerHTML = pcRuleText(fi, r);
      // Новые пингвины — экзамен: до нажатия «Проверить» результат скрыт, чтобы линию не подгоняли под test
      el('testBtn').hidden = state.checked;
      if (!state.checked) {
        el('accYou').textContent = '?'; el('accPc').textContent = '?';
        el('accNote').textContent = T('accHidden');
        return;
      }
      var y = countRight(function (v) { return youPredict(u, v); }, fi);
      var p = countRight(function (v) { return pcPredict(r, v); }, fi);
      el('accYou').textContent = Math.round(100 * y / test.length) + '%';
      el('accPc').textContent = Math.round(100 * p / test.length) + '%';
      el('accNote').textContent = T('accNote', { y: y, p: p, l: LAZY, lp: Math.round(100 * LAZY / test.length) });
    }
    // Своё правило изменилось — старая проверка уже не про него
    function uncheck() { state.checked = false; }

    function refresh() { updatePanel(); draw(); }

    function setThr(v) {
      var f = FEATS[state.fi];
      if (state.game && state.game.checked) return;          // после проверки правило уже сдано
      v = Math.min(f.hi, Math.max(f.lo, Math.round(v / f.step) * f.step));
      if (+v.toFixed(4) !== state.user[state.fi].thr) uncheck();
      state.user[state.fi].thr = +v.toFixed(4);
      el('thr').value = state.user[state.fi].thr;
      refresh();
    }

    // ======================= Игра «Правило по 8 примерам» (общий компонент MLViz.quiz) =======================
    // 5 раундов: случайный признак и 8 случайных примеров (минимум по 2 Gentoo и не Gentoo).
    // Ученик и компьютер строят правило по одним и тем же примерам, проверка — на всех 69 новых пингвинах.
    function sample8() {
      for (;;) {
        var pts = MLViz.shuffle(train, Math.random).slice(0, 8);
        var yes = pts.filter(function (p) { return p.g; }).length;
        if (yes >= 2 && yes <= 6) return pts;
      }
    }
    function score(a, b) { el('scoreYou').textContent = a; el('scorePc').textContent = b; }
    var quiz = MLViz.quiz({
      box: el('gamePanel'), rounds: 5,
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        // Вывод зависит от счёта, а не написан заранее
        final: function (q) {
          var a = q.score, b = q.data.pc;
          return T('gameOver', { a: a, b: b, c: q.data.ties }) + ' ' + T(a > b ? 'goYou' : a < b ? 'goPc' : 'goTie') + ' ' + T('goLimit');
        }
      },
      start: function (q) {
        q.data.pc = 0; q.data.ties = 0;
        q.data.feats = MLViz.shuffle([0, 1, 2, 3, 0, 1, 2, 3], Math.random).slice(0, 5);
        score(0, 0);
      },
      round: function (q) {
        var fi = q.data.feats[q.i], pts = sample8();
        state.fi = fi;
        state.user[fi] = defaultUser(FEATS[fi]);
        state.game = { pts: pts, rule: fitRule(pts, fi), checked: false, q: q };
        el('gameAsk').innerHTML = T('gameAsk', { f: T('fl_' + FEATS[fi].id) });
        el('checkBtn').hidden = false;
        syncControls(); refresh();
      },
      onEnd: function () { el('checkBtn').hidden = true; }
    });
    function checkGame() {
      var gm = state.game, q = gm.q, fi = state.fi, u = state.user[fi];
      if (gm.checked) return;
      gm.checked = true;
      el('checkBtn').hidden = true;
      var y = countRight(function (v) { return youPredict(u, v); }, fi);
      var p = countRight(function (v) { return pcPredict(gm.rule, v); }, fi);
      // Разница в 1 пингвина из 69 — шум, а не победа
      var verdict = Math.abs(y - p) <= 1 ? 'vTie' : y > p ? 'vYou' : 'vPc';
      if (verdict === 'vPc') q.data.pc++;
      if (verdict === 'vTie') q.data.ties++;
      q.answer(verdict === 'vYou' ? 1 : 0, T('gameLine', { pc: pcRuleText(fi, gm.rule), y: y, p: p, verdict: T(verdict) }));
      score(q.score, q.data.pc);
      draw();
    }

    function setMode(m) {
      if (m === state.mode && m === 'explore') return;
      if (m === 'game' && state.mode === 'explore') saved = { fi: state.fi, user: state.user.map(function (u) { return { thr: u.thr, side: u.side }; }) };
      if (m === 'explore' && saved) { state.fi = saved.fi; state.user = saved.user; saved = null; uncheck(); }
      state.mode = m;
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('explorePanel').style.display = m === 'explore' ? 'flex' : 'none';
      el('gamePanel').hidden = m !== 'game';
      el('featBox').hidden = m !== 'explore';
      el('legUnseen').hidden = m !== 'explore';
      el('hint').textContent = T(m === 'explore' ? 'hintExplore' : 'hintGame');
      if (m === 'game') quiz.start();
      else { state.game = null; syncControls(); refresh(); }
    }

    // ======================= События =======================
    el('featBtns').innerHTML = FEATS.map(function (f, i) {
      return '<button type="button" data-fi="' + i + '">' + T('f_' + f.id) + '</button>';
    }).join('');
    el('featBtns').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.fi = +b.dataset.fi; uncheck(); syncControls(); refresh();
    });
    el('sideBtns').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || (state.game && state.game.checked)) return;
      if (+b.dataset.side !== state.user[state.fi].side) uncheck();
      state.user[state.fi].side = +b.dataset.side; syncControls(); refresh();
    });
    el('testBtn').addEventListener('click', function () { state.checked = true; refresh(); });
    el('thr').addEventListener('input', function (e) { setThr(+e.target.value); });
    el('n').addEventListener('input', function (e) { state.n = +e.target.value; refresh(); });
    el('checkBtn').addEventListener('click', checkGame);
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });

    // Тянем белую линию: куда нажал на графике, туда и встаёт порог
    var dragging = false;
    function moveThr(ev) { setThr(sx.invert(MLViz.pointer(cv, ev).x)); }
    cv.addEventListener('pointerdown', function (e) { dragging = true; cv.setPointerCapture(e.pointerId); moveThr(e); });
    cv.addEventListener('pointermove', function (e) { if (dragging) moveThr(e); });
    cv.addEventListener('pointerup', function () { dragging = false; });
    cv.addEventListener('pointercancel', function () { dragging = false; });

    var colab = el('colabLink');
    if (colab.getAttribute('href')) colab.hidden = false;

    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 120); });

    resize();
    state.mode = '';
    setMode('explore');
  })();
  </script>
</body>
</html>
