        "tryBody": "<ul><li>Ҳимояи худро аз рӯи ҷадвали баҳогузорӣ софдилона баҳо деҳ. То ҳимоя кадом меъёрро баланд бардоштан осонтар аст?</li><li>«Бозӣ: ба саволи ҳакамон ҷавоб деҳ»-ро бозӣ кун. Кадом ҷавобҳо боварибахштар садо медиҳанд — софдилона ё «мо офарин»?</li><li>Се саволеро фикр кун, ки ҳакамон маҳз дар бораи лоиҳаи ту медиҳанд, ва ҷавобҳоро тайёр кун.</li><li>Дарси 1-ро ба ёд ор. Акнун чӣ кор карда метавонӣ, ки он вақт наметавонистӣ?</li></ul>",
        "mathTitle": "Барои кунҷковон: акнун чӣ кор карда метавонӣ",
        "mathBody": "<p>Дар давоми курс ту роҳро аз «ML аз барномаи оддӣ чӣ фарқ дорад» то барномаи худат дар интернет тай кардӣ. Ту метавонӣ:</p><ul><li>маълумотро бихонӣ ва тоза кунӣ (Pandas, холигиҳо, партофтҳо);</li><li>моделҳо бисозӣ ва онҳоро софдилона бисанҷӣ (train / validation / test, кросс-валидатсия, baseline);</li><li>метрикаро мувофиқи масъала интихоб кунӣ (accuracy, precision, recall, MAE);</li><li>шабакаҳои нейрониро биёмӯзонӣ ва аз тайёрҳояш истифода барӣ (transfer learning);</li><li>бифаҳмӣ, ки моделҳои забонӣ чӣ тавр сохта шудаанд (токенҳо, эмбеддингҳо, attention, ҳарорат);</li><li>бо AutoML корро тезонӣ ва барномаро дар интернет гузорӣ (Gradio, Hugging Face Spaces).</li></ul><p>Ва муҳимтар аз ҳама — бо суханҳои худат фаҳмонӣ, ки чӣ кор кардӣ.</p>",
        "teacherTitle": "Барои омӯзгор",
        "teacherBody": "<p><b>Ҷадвали баҳогузорӣ</b> — аз боби 24: ҳалли end-to-end 0–3, сифати модел 0–3, интерфейс ва README 0–2, ҳимоя 0–4; максимум 12, сертификати аъло — аз 10, сертификати хатми курс — аз 6. Ҳисобкунакро баъд аз ҳар як ҳимоя дар проектор кушодан ва якҷоя бо синф хол гузоштан мумкин аст.</p><p><b>Дар дарс чӣ тавр истифода бурдан мумкин аст.</b> Пеш аз ҳимояҳо — бозии «Ба саволи ҳакамон ҷавоб деҳ» (8 савол аз 10), то ҳаяҷон кам шавад. Ҳангоми ҳимояҳо — ҷадвали баҳогузорӣ ва таймер аз дарси 23.</p><p><b>Саволҳо барои муҳокима.</b> Чаро «ман нарасидам, аммо медонам чӣ тавр созам» ҷавоби хуб аст? Ғайр аз код чиро омӯхтӣ?</p>",
        "colab": "Кушодани дафтари дарс дар Colab",
        "footer": "Лабораторияи ML. Лоиҳаи ниҳоӣ — бобҳои 21–24-и китоби дарсӣ."
      }
      /* tg:end */
    };

    MLViz.renderHeader('../../');
    MLViz.applyI18n(STR);
    var T = function (k, v) { return MLViz.t(STR, k, v); };
    var el = function (id) { return document.getElementById(id); };
    el('cv').setAttribute('aria-label', T('cvLabel'));

    // ======================= Рубрика из главы 24 =======================
    var CRIT = [['r1', 3], ['r2', 3], ['r3', 2], ['r4', 4]];
    var marks = [2, 2, 1, 3];
    el('criteria').innerHTML = CRIT.map(function (c, i) {
      var btns = '';
      for (var v = 0; v <= c[1]; v++) btns += '<button type="button" data-c="' + i + '" data-v="' + v + '" aria-label="' + T('critAria', { c: T(c[0]), v: v }) + '">' + v + '</button>';
      return '<div><h3>' + T(c[0]) + ' · 0–' + c[1] + '</h3><p class="note" style="margin:2px 0 6px">' + T(c[0] + 'n') + '</p><div class="seg" data-c="' + i + '">' + btns + '</div></div>';
    }).join('');
    function total() { return marks.reduce(function (s, m) { return s + m; }, 0); }
    function updatePanel() {
      el('criteria').querySelectorAll('.seg').forEach(function (seg) {
        var i = +seg.dataset.c;
        MLViz.setPressed(seg, function (b) { return +b.dataset.v === marks[i]; });
      });
      var t = total();
      el('total').textContent = T('totalOf', { t: t });
      el('award').innerHTML = t >= 10 ? T('aHonor') : t >= 6 ? T('aPass', { n: 10 - t }) : T('aNot', { n: 6 - t });
    }
    el('criteria').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      marks[+b.dataset.c] = +b.dataset.v; updatePanel(); draw();
    });

    // Полоса из 12 клеток: баллы по критериям подряд, отметки порогов 6 и 10
    var cv = el('cv'), g;
    function resize() { g = MLViz.fitCanvas(cv, cv.parentElement.clientWidth < 560 ? 0.6 : 0.32); draw(); }
    function draw() {
      var ctx = g.ctx, fs = MLViz.fontPx(g.w), x0 = 8, x1 = g.w - 8, cw = (x1 - x0) / 12, top = fs * 2 + 18, h = Math.min(60, g.h - top - fs * 3 - 20);
      ctx.clearRect(0, 0, g.w, g.h);
      var k = 0, shades = ['#EEEAFB', '#C9C3E6', '#A9A2CC', '#D9D3F2'];
      CRIT.forEach(function (c, i) {
        for (var v = 0; v < c[1]; v++, k++) {
          ctx.fillStyle = v < marks[i] ? shades[i] : 'rgba(169,162,204,.18)';
          ctx.fillRect(x0 + k * cw + 2, top, cw - 4, h);
        }
        // Подпись критерия под его клетками
        ctx.fillStyle = '#C9C3E6'; ctx.font = Math.max(13, fs - 2) + 'px Calibri, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        var mid = x0 + (k - c[1] / 2) * cw;
        ctx.fillText(marks[i] + '/' + c[1], mid, top + h + 8);
        if (g.w > 520) ctx.fillText(T(c[0]), mid, top + h + 8 + fs + 4);
      });
      // Пороги сертификатов
      [[6, 'lblPass'], [10, 'lblHonor']].forEach(function (p) {
        var x = x0 + p[0] * cw;
        ctx.strokeStyle = '#EEEAFB'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, top - 8); ctx.lineTo(x, top + h + 4); ctx.stroke();
        ctx.fillStyle = '#EEEAFB'; ctx.font = 'bold ' + Math.max(13, fs - 1) + 'px Calibri, system-ui, sans-serif';
        ctx.textAlign = p[0] === 10 ? 'right' : 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(T(p[1]), p[0] === 10 ? x + 4 : x, top - 10);
      });
      ctx.fillStyle = '#EEEAFB'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = 'bold ' + (fs + 4) + 'px Calibri, system-ui, sans-serif';
      ctx.fillText(T('totalOf', { t: total() }), x0, 0);
    }

    // ======================= Игра «Ответь на вопрос жюри» (общий компонент MLViz.quiz) =======================
    var quiz = MLViz.quiz({
      box: el('gamePanel'), rounds: 8,
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return T('gameOver', { s: q.score, n: q.n, v: T(q.score >= 7 ? 'goGood' : q.score >= 5 ? 'goMid' : 'goLow') }); }
      },
      start: function (q) { q.data.list = MLViz.shuffle(MLViz.range(1, 10, 1), Math.random).slice(0, 8); el('score').textContent = 0; },
      round: function (q) {
        var n = q.data.list[q.i], opts = MLViz.shuffle(['a', 'b', 'c'], Math.random);
        el('gameCase').innerHTML = '<b>' + T('q' + n) + '</b>';
        q.choices(el('choiceBtns'), opts.map(function (o) { return T('q' + n + o); }), function (k) { return opts[k] === 'a'; }, function (k, ok) {
          q.answer(ok ? 1 : 0, '<b>' + T(ok ? 'right' : 'wrong') + '</b> ' + T('q' + n + 'a'));
          el('score').textContent = q.score;
        });
      },
      onEnd: function () { el('choiceBtns').innerHTML = ''; el('gameCase').textContent = ''; }
    });

    function setMode(m) {
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('explorePanel').style.display = m === 'explore' ? 'flex' : 'none';
      el('gamePanel').hidden = m !== 'game';
      el('hint').textContent = T(m === 'explore' ? 'hintExplore' : 'hintGame');
      if (m === 'game') quiz.start();   // баллы рубрики игра не трогает
    }
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });

    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 120); });

    updatePanel(); resize();
    setMode('explore');
  })();
  </script>
</body>
</html>
