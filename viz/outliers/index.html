<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выбросы и пропуски · Лаборатория ML</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    /* Только для этой страницы */
    .viz-main > .stage { min-width: 0; }
    .stab { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 6px; }
    .stab th, .stab td { padding: 5px 6px; border-bottom: 1px solid var(--line-soft); text-align: right; }
    .stab th:first-child, .stab td:first-child { text-align: left; color: var(--muted); }
    .stab th { font-size: 14px; color: var(--muted); }
    .stab td.jump { color: var(--c-odd); font-weight: 700; }
    .rtab { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; width: 100%; }
    .rtab th { background: var(--card-2); padding: 8px; font-size: 14px; text-align: right; white-space: nowrap; }
    .rtab td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
    .rtab th.txt, .rtab td.txt { text-align: left; }
    .rtab td.nan { color: var(--c-odd); font-weight: 700; background: rgba(244, 63, 94, .12); }
    .rtab td.filled { color: var(--c-val); font-weight: 700; background: rgba(74, 222, 128, .12); }
    .rtab tr.gone td { opacity: .3; text-decoration: line-through; }
    .bars2 { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .bar2 { display: grid; grid-template-columns: minmax(110px, auto) 1fr 32px; gap: 8px; align-items: center; font-size: 15px; }
    .bar2 .track { height: 14px; background: rgba(23, 19, 46, .7); border-radius: 6px; overflow: hidden; }
    .bar2 .fill { height: 100%; background: var(--c-odd); border-radius: 6px; }
    .gnums { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
    .gnums button { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <p class="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <div class="analogy-box" data-i18n-html="analogy"></div>

    <div class="viz-layout">
      <div class="viz-main">
        <div class="stage" id="outStage">
          <canvas id="cv"></canvas>
          <div class="legend" style="padding:8px 4px 0">
            <span><i style="background:var(--adelie)"></i>Adelie</span>
            <span><i style="background:var(--chinstrap)"></i>Chinstrap</span>

          <div class="legend" style="padding:4px 4px 0">
            <span><b>▼</b> <span data-i18n="legMean"></span></span>
            <span><i class="dash" style="border-color:var(--text); border-radius:0; width:16px; height:0"></i><span data-i18n="legMedian"></span></span>
            <span><i style="background:transparent; border:1.5px solid var(--muted); border-radius:2px"></i><span data-i18n="legBox"></span></span>
          </div>
          <div class="hint" id="hint"></div>
        </div>

        <div class="stage" id="missStage" hidden style="padding:12px">
          <div class="tbl-wrap"><table class="rtab" id="rtab"></table></div>
          <div class="hint" id="missHint"></div>
        </div>

        <div class="stage viz-extra" id="countBox" hidden style="padding:14px">
          <h3 class="sub" data-i18n="countTitle"></h3>
          <div class="bars2" id="counts"></div>
        </div>
      </div>

      <aside class="panel">
        <div class="seg modes" id="modes">
          <button type="button" data-mode="out" data-i18n="modeOut"></button>
          <button type="button" data-mode="miss" data-i18n="modeMiss"></button>
          <button type="button" data-mode="game" data-i18n="modeGame"></button>
        </div>

        <!-- Выбросы -->
        <div id="outBox">
          <h3 data-i18n="featLabel"></h3>
          <div class="seg" id="featBtns" style="margin-top:6px"></div>
          <h3 style="margin-top:12px" data-i18n="groupLabel"></h3>
          <div class="seg" id="groupBtns" style="margin-top:6px">
            <button type="button" data-g="all" data-i18n="groupAll"></button>
            <button type="button" data-g="ten" data-i18n="groupTen"></button>
          </div>
          <label class="toggle" style="margin-top:12px"><input type="checkbox" id="giant" checked> <span data-i18n="giantLabel"></span></label>
          <h3 style="margin-top:8px"><span data-i18n="giantValue"></span>: <span id="giantVal"></span></h3>
          <input type="range" id="giantSlider">
          <p class="note" id="giantNote"></p>
          <div style="border-top:1px solid var(--line); padding-top:12px; margin-top:10px">
            <table class="stab" id="stab"></table>
            <p class="note" id="outNote"></p>
          </div>
        </div>

        <!-- Пропуски -->
        <div id="missBox" hidden>
          <h3 data-i18n="stratLabel"></h3>
          <div class="seg" id="stratBtns" style="margin-top:6px"></div>
          <div class="row" style="justify-content:space-between; margin-top:12px">
            <div><small style="font-weight:700" data-i18n="rowsLeft"></small><div class="big-number" id="rowsLeft"></div></div>
            <div><small style="font-weight:700" data-i18n="colsLeft"></small><div class="big-number" id="colsLeft"></div></div>
          </div>
          <p style="margin:10px 0 0" id="stratText"></p>
        </div>

        <!-- Игра «Найди опечатку» -->
        <div id="gameBox" hidden>
          <h3 id="gameStep"></h3>
          <p style="margin:6px 0 0" id="gameAsk"></p>
          <div class="gnums" id="gnums"></div>
          <p id="gameResult" role="status" style="margin:10px 0 0"></p>
          <button type="button" id="nextBtn" class="primary" style="margin-top:8px" hidden></button>
        </div>
      </aside>
    </div>

    <section class="section">
      <h2 data-i18n="howTitle"></h2>
      <div data-i18n-html="howBody"></div>
    </section>

    <section class="section">
      <h2 data-i18n="tryTitle"></h2>
      <div data-i18n-html="tryBody"></div>
    </section>

    <details class="box">
      <summary data-i18n="mathTitle"></summary>
      <div data-i18n-html="mathBody"></div>
    </details>

    <details class="box">
      <summary data-i18n="teacherTitle"></summary>
      <div data-i18n-html="teacherBody"></div>
      <div class="lesson-links" style="margin-top:10px">
        <a class="btn" id="colabLink" href="" target="_blank" rel="noopener" data-i18n="colab" hidden></a>
      </div>
    </details>
  </main>

  <footer class="site-footer"><div class="wrap" data-i18n-html="footer"></div></footer>

        "mathBody": "<p><code>миёна = (x₁ + x₂ + … + xₙ) / n</code>; медиана — қимати мобайнии рӯйхати мураттабшуда (дар n-и ҷуфт — миёнаи ду қимати мобайнӣ).</p><p>Квартилҳои Q1 ва Q3 — қиматҳое, ки аз онҳо поёнтар 25% ва 75%-и маълумот ҷойгиранд. <code>IQR = Q3 − Q1</code>, партофт — хурд аз <code>Q1 − 1.5·IQR</code> ё калон аз <code>Q3 + 1.5·IQR</code>.</p><p>Дар Python:</p><p><code>from palmerpenguins import load_penguins<br><br>raw = load_penguins()<br>print(raw.isna().sum())&nbsp;&nbsp;# дар ҳар як сутун чанд холигӣ ҳаст<br>print(raw.dropna().shape)&nbsp;&nbsp;# (333, 8): сатрҳоро нест кардем<br>df = raw.drop(columns=['sex']).dropna()&nbsp;&nbsp;# (342, 7): мисли курс<br><br>s = df['body_mass_g']<br>q1, q3 = s.quantile(0.25), s.quantile(0.75)<br>iqr = q3 - q1<br>print(s.mean(), s.median(), q1, q3)<br>print(s[(s &lt; q1 - 1.5 * iqr) | (s &gt; q3 + 1.5 * iqr)])&nbsp;&nbsp;# партофтҳо</code></p>",

    MLViz.renderHeader('../../');

    // ======================= Данные и статистика =======================

    // Квартиль как в pandas по умолчанию (линейная интерполяция)
    function quantile(sorted, q) {
      var pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
      return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
    }
    function stats(vals) {
      var s = vals.slice().sort(function (a, b) { return a - b; });
      var mean = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
      var q1 = quantile(s, 0.25), q3 = quantile(s, 0.75), iqr = q3 - q1;
      var lo = q1 - 1.5 * iqr, hi = q3 + 1.5 * iqr;
      var inside = s.filter(function (v) { return v >= lo && v <= hi; });
      return { mean: mean, median: quantile(s, 0.5), q1: q1, q3: q3, lo: lo, hi: hi,

    // ======================= Состояние =======================
    var state = { mode: 'out', feat: 'body_mass_g', group: 'ten', giant: true, giantV: null, strat: 'dropcol', game: null };
    function base() {

    }

    // ======================= График: точки, ящик, среднее и медиана =======================
    var cv = document.getElementById('cv'), g;

    var rnd = MLViz.rng(4);

      var ctx = g.ctx, font = MLViz.cssVar('--font'), fs = MLViz.fontPx(g.w);
      ctx.clearRect(0, 0, g.w, g.h);

      var giantOn = state.giant && !state.game;
      if (giantOn) vals = vals.concat([state.giantV]);
      var st = stats(vals);
      var x0 = Math.min.apply(null, vals), x1 = Math.max.apply(null, vals), pad = (x1 - x0) * 0.06 || 1;
      var PAD = { l: 16, r: 20, t: fs * 2, b: fs * 3.2 };
      var sx = MLViz.scale(x0 - pad, x1 + pad, PAD.l, g.w - PAD.r);

        xLabel: T('f_' + state.feat), yLabel: ''
      });
      var H = g.h - PAD.t - PAD.b, boxY = PAD.t + H * 0.18, boxH = H * 0.2, dotY = PAD.t + H * 0.68, dotH = H * 0.42;

      // Ящик с усами

      ctx.strokeRect(sx(st.q1), boxY, sx(st.q3) - sx(st.q1), boxH);
      ctx.beginPath();
      ctx.moveTo(sx(st.wlo), boxY + boxH / 2); ctx.lineTo(sx(st.q1), boxY + boxH / 2);
      ctx.moveTo(sx(st.q3), boxY + boxH / 2); ctx.lineTo(sx(st.whi), boxY + boxH / 2);
      ctx.moveTo(sx(st.wlo), boxY + boxH * 0.2); ctx.lineTo(sx(st.wlo), boxY + boxH * 0.8);
      ctx.moveTo(sx(st.whi), boxY + boxH * 0.2); ctx.lineTo(sx(st.whi), boxY + boxH * 0.8);
      ctx.stroke();

      // Медиана — пунктир через весь график, среднее — треугольник сверху
      ctx.strokeStyle = C_TEXT; ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx(st.median), PAD.t); ctx.lineTo(sx(st.median), g.h - PAD.b); ctx.stroke(); ctx.setLineDash([]);
      var mx = sx(st.mean);
      ctx.fillStyle = C_TEXT; ctx.beginPath(); ctx.moveTo(mx, PAD.t + 2); ctx.lineTo(mx - 9, PAD.t - 12); ctx.lineTo(mx + 9, PAD.t - 12); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(238,234,251,.55)'; ctx.lineWidth = 1.5;

      ctx.font = fs + 'px ' + font; ctx.textBaseline = 'bottom';

      ctx.fillText(T('rowMean') + ' ' + st.mean.toFixed(1), mx + (leftSide ? -12 : 12), PAD.t - 1);

    var MISS_NAMES = { 0: 'species', 1: 'island', 2: 'bill_length_mm', 3: 'bill_depth_mm', 4: 'flipper_length_mm', 5: 'body_mass_g', 6: 'sex' };

    function renderMiss() {

      el('stratText').innerHTML = T('st_' + s, { m: num(Math.round(FILL.means[2] * 100) / 100), s: FILL.mode });
      MLViz.setPressed(el('stratBtns'), function (b) { return b.dataset.s === s; });

      var maxc = 0, counts = RCOLS.map(function (c, k) { var n = RAW.filter(function (r) { return r[k] === null; }).length; maxc = Math.max(maxc, n); return n; });
      el('counts').innerHTML = RCOLS.map(function (c, k) {
        return '<div class="bar2"><span>' + c + '</span><span class="track"><span class="fill" style="display:block; width:' + (100 * counts[k] / maxc) + '%"></span></span><b>' + counts[k] + '</b></div>';
      }).join('');
    }

    // ======================= Режимы =======================
    function updatePanel() {
      var m = state.mode;
      MLViz.setPressed(el('modes'), function (b) { return b.dataset.mode === m; });
      el('outBox').hidden = m !== 'out';
      el('missBox').hidden = m !== 'miss';
      el('gameBox').hidden = m !== 'game';
      el('outStage').hidden = m === 'miss';
      el('missStage').hidden = m !== 'miss';
      el('countBox').hidden = m !== 'miss';
      el('hint').textContent = T(m === 'out' ? 'hintOut' : 'hintGame');
      // В игре картинку показываем только после ответа — иначе она подскажет
      cv.style.visibility = m === 'game' && state.game && !state.game.answered ? 'hidden' : '';
      el('missHint').textContent = T('hintMiss');
      if (m === 'out') updateOut();
      if (m === 'miss') renderMiss();
    }
    function refresh() { updatePanel(); if (state.mode !== 'miss') draw(); }

    FEATS.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.f = f; b.textContent = T('f_short_' + f);
      b.addEventListener('click', function () { state.feat = f; resetGiant(); refresh(); });
      el('featBtns').appendChild(b);
    });
    el('groupBtns').querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { state.group = b.dataset.g; refresh(); });
    });
    ['drop', 'dropcol', 'fill'].forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.s = s; b.textContent = T('s_' + s);
      b.addEventListener('click', function () { state.strat = s; refresh(); });
      el('stratBtns').appendChild(b);
    });
    el('giant').addEventListener('change', function (e) { state.giant = e.target.checked; refresh(); });
    el('giantSlider').addEventListener('input', function (e) { state.giantV = +e.target.value; refresh(); });

    // ======================= Игра «Найди опечатку» (общий компонент MLViz.quiz) =======================
    var rand = MLViz.rng(Date.now() % 100000);
    var quiz = MLViz.quiz({
      box: el('gameBox'), rounds: 8,
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n, s: q.score }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return T('final', { s: q.score, n: q.n }); }
      },
      round: function (q) {
        // 10 настоящих чисел, одно испорчено; state.game нужен картинке слева
        var feat = ['body_mass_g', 'flipper_length_mm', 'bill_length_mm'][Math.floor(rand() * 3)];
        var idx = MLViz.shuffle(ROWS.map(function (_, i) { return i; }), rand).slice(0, 10);
        var vals = idx.map(function (i) { return ROWS[i][FI[feat]]; });
        var kinds = feat === 'body_mass_g' ? ['x10', 'd10', 'kg'] : ['x10', 'd10'];
        var kind = kinds[Math.floor(rand() * kinds.length)], bad = Math.floor(rand() * 10);
        var v = vals[bad];
        vals[bad] = kind === 'x10' ? v * 10 : kind === 'd10' ? Math.round(v * 10) / 100 : v / 1000;
        state.game = { vals: vals, bad: bad, kind: kind, answered: false };
        el('gameAsk').textContent = T('gameAsk', { f: T('f_' + feat) });
        var labels = vals.map(function (x) { return num(Math.round(x * 1000) / 1000); });
        q.choices(el('gnums'), labels, function (j) { return j === bad; }, function (j, ok) {
          state.game.answered = true;
          q.answer(ok ? 1 : 0, ok ? T('gameRight', { why: T('why_' + kind) })
            : T('gameWrong', { v: labels[bad], why: T('why_' + kind) }));
          refresh();
        });
        refresh();
      },
      onEnd: function () { el('gameAsk').textContent = ''; el('gnums').innerHTML = ''; }
    });

    function setMode(m) {
      state.mode = m;
      if (m === 'game') quiz.start();
      else { state.game = null; refresh(); }
    }
    el('modes').querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });

    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 120); });

    resize();
    setMode('out');
  })();
  </script>
</body>
</html>
