        teacherBody: "<p><b>Данные.</b> Три пошаговых примера (print, переменные, арифметика) и 8 заданий. Шаги примеров и ответы заданий записал настоящий Python: <code>tools/build_pystart.py</code> запускает каждую программу и сам находит вывод, строку ошибки и все верные порядки строк.</p><p><b>Как использовать.</b> Для ученика, который ни разу не программировал, — до урока 1. На проекторе перед каждым «Шагом» класс угадывает, что изменится в коробках. Вопрос для обсуждения: «почему <code>mass = mass + 250</code> — не ошибка, хотя в математике так не бывает?»</p><p><b>Где запускать по-настоящему:</b> Colab (нужны интернет и Google-аккаунт) или Thonny (ставится один раз, работает без интернета). Порядок «предскажи → запусти → измени»: сначала угадать вывод, потом запустить, потом поменять одно число и угадать снова.</p>",
