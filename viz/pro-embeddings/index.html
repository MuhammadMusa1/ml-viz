  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    /* Поле запроса и кнопка «Найти» в одну строку, на узкой панели — друг под другом */
    .qrow { display: flex; gap: 8px; flex-wrap: wrap; }
    .qrow input { flex: 1 1 160px; min-width: 0; min-height: var(--tap); font: inherit; font-size: var(--fs-small); color: var(--text-strong);
      background: var(--n-950); border: 1.5px solid var(--control-line); border-radius: var(--r-m); padding: 8px 12px; }
    .hits { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .hits li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline;
      font-size: var(--fs-label); line-height: var(--lh-label); padding: 6px 0; border-bottom: 1px solid var(--line); }
    .hits .rk { color: var(--text-muted); font-family: var(--font-code); }
    .hits .v { font-family: var(--font-code); font-weight: 700; color: var(--text-strong); }
    .shape { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 2px solid var(--n-300); }
    .shape.s0 { border-radius: 50%; background: var(--n-300); }
    .shape.s1 { width: 0; height: 0; border: 7px solid transparent; border-bottom: 12px solid var(--n-300); border-top: 0; }
    .shape.s2 { background: transparent; }
    .choices.one { grid-template-columns: 1fr; }
    .choices.one button { text-align: left; }
  </style>

  <header id="site-header"></header>

        <div class="seg modes" id="modes">

          <h3 data-i18n="queryTitle"></h3>

            <h3 data-i18n="hitsTitle"></h3>
            <ol class="hits" id="hits" style="margin-top:8px"></ol>
          </div>
        </div>

        <div id="gamePanel" class="game-box" hidden>
          <h3 id="gameStep"></h3>
          <p style="margin:6px 0 0" data-i18n="gameAsk"></p>
          <p style="margin:6px 0 0"><b id="gameQuery"></b></p>
          <div class="choices one" id="gameChoices"></div>
          <p id="gameResult" role="status" style="margin:10px 0 0"></p>
          <button type="button" id="nextBtn" class="primary" hidden></button>
        </div>
      </aside>
    </div>

    <section class="section">
      <h2 data-i18n="howTitle"></h2>
      <div data-i18n-html="howBody"></div>
    </section>

    <section class="section">
      <h2 data-i18n="langTitle"></h2>
      <div data-i18n-html="langBody"></div>
    </section>

    <section class="section">
      <h2 data-i18n="tryTitle"></h2>

    </details>

    <details class="box">

        hitsTitle: 'Ближайшие фразы',
        hintExplore: 'Каждая фигурка — фраза. Ромб — твой запрос. Линии ведут к k ближайшим фразам, у каждой — число сходства. Нажми на фигурку — она станет запросом.',
        hintGame: 'Ромб — запрос. Цифрами 1–3 отмечены варианты. Какую фразу модель назовёт самой похожей?',
        query: 'Запрос',
        gameAsk: 'Какая из трёх фраз окажется самой похожей на запрос по косинусу?',
        gameLine: '{verdict} Модель: <b>{best}</b>.<br>Косинусы: {list}',
        gameRight: 'Верно!', gameWrong: 'Не угадал.',
        gameNote_trap: ' Смотри: «не» почти не меняет вектор — для модели «одобрен» и «не одобрен» почти одно и то же.',
        gameNote_bank: ' Слово «банк» тянет к финансам, но «задачи» и «математика» перевешивают: модель складывает слова, а не понимает фразу целиком. Сравни косинусы.',
        gameNote_money: ' Слово «деньги» перетянуло: по смыслу клиенту нужна блокировка карты, а модель ближе всего поставила перевод.',
        gameNote_course: ' «Курс» бывает и денежный, и учебный: у модели одно число на оба значения, поэтому «Курс доллара» тоже оказывается близко.',
        gameStep: 'Раунд {i} из {n}',
        next: 'Следующий запрос →', finish: 'Итог', again: 'Сыграть ещё ↺',
        gameOver: 'Итог: <b>{s} из {n}</b>. Обрати внимание на раунды-ловушки: там модель «права» по числам, но не по смыслу.',
        howTitle: 'Как это работает',
        howBody:
          '<ol>' +
          '<li><b>Слово → числа.</b> У каждого слова есть вектор — список чисел. В настоящей модели их выучили по огромному количеству текстов: слова, которые встречаются в похожем окружении, получают похожие векторы.</li>' +
          '<li><b>Фраза → эмбеддинг.</b> Здесь вектор фразы — среднее векторов её слов. Настоящие модели собирают фразу умнее (attention), но идея та же: фраза — тоже точка в пространстве.</li>' +
          '<li><b>Запрос → та же точка.</b> Запрос превращаем в вектор тем же способом и сравниваем с каждой фразой.</li>' +
          '<li><b>Сравнение.</b> Косинус смотрит на угол между векторами, евклидово расстояние — на расстояние между их концами. Берём k самых похожих — это и есть «поиск по смыслу».</li>' +
          '</ol>',
        langTitle: 'Какую модель эмбеддингов взять для русского и таджикского',
        langBody:
          '<ol>' +
          '<li><b>Многоязычная модель.</b> Она кладёт русский и таджикский текст в одно пространство: вопрос на таджикском находит документ на русском. Кандидаты — открытые многоязычные модели (например, семейства multilingual-e5, BGE-M3, LaBSE) и эмбеддинги облачных провайдеров.</li>' +
          '<li><b>Отсев по документации.</b> Есть ли таджикский в языках обучения? Сколько токенов модель принимает на вход? Какая лицензия? Можно ли запустить модель на серверах банка, чтобы документы не уходили наружу?</li>' +

          '<li><b>Цена в работе.</b> Размер вектора (память индекса), скорость на своём железе, сколько стоит пересчитать эмбеддинги всех документов при смене модели.</li>' +

        tryTitle: 'Попробуй сам',
        tryBody:
          '<ul>' +
          '<li>Выбери запрос «Кредит не одобрен». Какая фраза ближайшая и какой у неё косинус? Почему модель почти не замечает «не»?</li>' +

          '<li>Подвигай k от 1 до 10. С какого k в список попадают фразы из чужой темы? Что будет, если такие фразы попадут в промпт модели?</li>' +
          '<li>Напиши запрос из слов, которых модель не знает. Что она вернёт и почему это опасно в банковском чат-боте?</li>' +
          '</ul>',
        mathTitle: 'Для любопытных: формула',
        mathBody:
          '<p>Косинусное сходство векторов <i>a</i> и <i>b</i>:</p>' +
          '<p><code>cos θ = (a · b) / (|a| · |b|)</code>, где <code>a · b = a₁b₁ + a₂b₂ + … + a₈b₈</code>, а <code>|a| = √(a · a)</code> — длина вектора.</p>' +
          '<p>Евклидово расстояние: <code>d = √((a₁ − b₁)² + … + (a₈ − b₈)²)</code>. Если оба вектора нормировать до длины 1, то <code>d² = 2 − 2·cos θ</code>: порядок соседей у двух мер совпадёт. Здесь векторы не нормированы, поэтому порядок иногда разный.</p>' +
          '<p>Код ниже запускается в Colab целиком и даёт те же числа, что страница (часть словаря):</p>' +
          '<pre class="pycode"><code>import numpy as np\n' +
          'from sklearn.metrics.pairwise import cosine_similarity, euclidean_distances\n\n' +
          '# 8 «смысловых осей»: деньги, карта, кредит, безопасность, птицы, природа, учёба, оценки\n' +
          'LEX = {\n' +
          '    \'кредит\':  [.5, 0, 1, 0, 0, 0, 0, 0],\n' +
          '    \'одобр\':   [.2, 0, .5, 0, 0, 0, 0, .15],\n' +
          '    \'не\':      [.05] * 8,\n' +
          '    \'как\':     [.03, 0, .03, 0, .03, 0, .03, 0],\n' +
          '    \'оформ\':   [.3, 0, .4, 0, 0, 0, 0, 0],\n' +
          '    \'карт\':    [.3, 1, 0, 0, 0, 0, 0, 0],\n' +
          '    \'заблокир\': [0, .5, 0, .8, 0, 0, 0, 0],\n' +
          '}\n\n' +
          'def stem(word):\n' +
          '    # самая длинная основа из словаря, с которой начинается слово (короткие — только целиком)\n' +
          '    cands = [s for s in LEX if word == s or (len(s) >= 3 and word.startswith(s))]\n' +
          '    return max(cands, key=len) if cands else None\n\n' +
          'def embed(text):\n' +
          '    words = text.lower().replace(\'ё\', \'е\').split()\n' +
          '    vecs = [LEX[stem(w)] for w in words if stem(w)]\n' +
          '    return np.mean(vecs, axis=0)\n\n' +
          'phrases = [\'Кредит одобрен\', \'Как оформить кредит\', \'Заблокировать карту\']\n' +
          'E = np.array([embed(p) for p in phrases])\n' +
          'q = embed(\'Кредит не одобрен\').reshape(1, -1)\n\n' +
          'print(cosine_similarity(q, E).round(3))    # [[0.998 0.989 0.113]]\n' +
          'print(euclidean_distances(q, E).round(3))  # чем меньше, тем похожее</code></pre>' +
          '<p>В настоящей системе вместо словаря — модель эмбеддингов (например, из библиотеки <code>sentence-transformers</code>), а вместо перебора всех фраз — векторная база с быстрым приближённым поиском.</p>',
        teacherTitle: 'Для учителя',
        teacherBody:
          '<p><b>Данные.</b> 39 коротких фраз (банк, пингвины, школа) и словарь из ~110 основ слов с 8 числами. Векторы фраз, карта (MDS) и все сходства считаются в браузере. Сверка с <code>sklearn.metrics.pairwise</code> — <code>tools/check_pro.py</code>.</p>' +

          '<p><b>Вопросы для обсуждения.</b> Почему отрицание «не» почти не меняет вектор? Чем опасен поиск по смыслу для кодов ошибок и номеров договоров? Как понять, что k слишком большое?</p>',

    // ======================= Данные =======================
    // Словарь основ слов (8 чисел у каждой), 39 фраз с темой (0 — банк, 1 — пингвины, 2 — школа),

        ];
        for (var dy = 1; dy <= 6; dy++) {
          cand.push({ x: it.x + 10, y: it.y - sz.h / 2 + dy * sz.h }, { x: it.x + 10, y: it.y - sz.h / 2 - dy * sz.h });
        }
        var pick = null;
        for (var i = 0; i < cand.length && !pick; i++) {
          var b = { x: Math.max(2, Math.min(g.w - sz.w - 2, cand[i].x)), y: Math.max(2, Math.min(g.h - sz.h - 2, cand[i].y)), w: sz.w, h: sz.h };
          if (!MLPro.overlaps(b, taken)) pick = b;
        }
        if (!pick) pick = { x: Math.max(2, Math.min(g.w - sz.w - 2, it.x + 10)), y: it.y - sz.h / 2, w: sz.w, h: sz.h };
        taken.push(pick);
        MLPro.label(ctx, it.text, pick.x, pick.y, { size: fs, base: 'top', maxW: maxW, bold: it.bold });
      });
    }
    function draw() {
      var ctx = g.ctx, r = MLViz.isProjector() ? 7 : 6;
      ctx.clearRect(0, 0, g.w, g.h);
      // Сетка без подписей: у осей карты MDS нет «имён», важны только расстояния между точками
      ctx.strokeStyle = MLViz.cssVar('--plot-grid'); ctx.lineWidth = 1;
      for (var i = 1; i < 6; i++) {
        ctx.beginPath(); ctx.moveTo(g.w * i / 6, 0); ctx.lineTo(g.w * i / 6, g.h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, g.h * i / 6); ctx.lineTo(g.w, g.h * i / 6); ctx.stroke();
      }
      var dim = MLViz.cssVar('--n-400'), bright = MLViz.cssVar('--n-200'), white = MLViz.cssVar('--text-strong');
      var q, hits = [], labels = [];
      if (state.mode === 'explore') {
        var e = embed(state.text);
        if (e.known) { q = project(e.v); hits = search(e.v, state.k, state.metric); }
      } else if (state.game && state.game.cur) {
        q = project(embed(state.game.cur.q).v);
      }
      var hot = {};
      hits.forEach(function (h) { hot[h.i] = h; });
      PH.forEach(function (p, i) { if (!hot[i]) shape(ctx, sx(p.x), sy(p.y), p.topic, r, dim); });
      if (q) {
        // Линии к найденным фразам
        ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
        hits.forEach(function (h) { var p = PH[h.i]; ctx.beginPath(); ctx.moveTo(sx(q.x), sy(q.y)); ctx.lineTo(sx(p.x), sy(p.y)); ctx.stroke(); });
        hits.forEach(function (h) {
          var p = PH[h.i];
          shape(ctx, sx(p.x), sy(p.y), p.topic, r + 1, bright, white);
          labels.push({ x: sx(p.x), y: sy(p.y), text: MLPro.fix(h.s, 2) + ' · ' + p.text });
        });
        if (state.mode === 'game' && state.game.cur) {
          state.game.cur.opts.forEach(function (oi, k) {
            var p = PH[oi];
            shape(ctx, sx(p.x), sy(p.y), p.topic, r + 1, bright, white);
            var txt = (k + 1) + ' · ' + (state.game.answered ? MLPro.fix(MLPro.cosine(embed(state.game.cur.q).v, p.v), 2) + ' · ' : '') + p.text;
            labels.push({ x: sx(p.x), y: sy(p.y), text: txt });
            if (state.game.answered) {
              ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
              ctx.beginPath(); ctx.moveTo(sx(q.x), sy(q.y)); ctx.lineTo(sx(p.x), sy(p.y)); ctx.stroke();
            }
          });
        }
        diamond(ctx, sx(q.x), sy(q.y), r + 4);
        labels.unshift({ x: sx(q.x), y: sy(q.y), text: T('query'), bold: true });
      }
      placeLabels(ctx, labels);
    }

    // ======================= Панель =======================
    function renderPresets() {
      el('presets').innerHTML = PRESETS.map(function (p, i) { return '<button type="button" data-i="' + i + '">' + esc(p) + '</button>'; }).join('');
      MLViz.setPressed(el('presets'), function (b) { return PRESETS[+b.dataset.i] === state.text; });
    }
    function updatePanel() {
      el('kVal').textContent = state.k;
      MLViz.setPressed(el('metric'), function (b) { return b.dataset.m === state.metric; });
      MLViz.setPressed(el('presets'), function (b) { return PRESETS[+b.dataset.i] === state.text; });
      el('metricNote').textContent = T(state.metric === 'cos' ? 'noteCos' : 'noteEuc');
      var e = embed(state.text);
      el('unk').textContent = !e.known ? T('unkAll') : e.unk.length ? T('unk', { w: e.unk.join(', ') }) : T('unkNone');
      var hits = e.known ? search(e.v, state.k, state.metric) : [];
      el('hits').innerHTML = hits.map(function (h, j) {
        var p = PH[h.i];
        return '<li><span class="rk">' + (j + 1) + '</span><span><i class="shape s' + p.topic + '" aria-hidden="true"></i>' + esc(p.text) + '</span>' +
          '<span class="v">' + (state.metric === 'cos' ? 'cos ' : 'd ') + MLPro.fix(h.s, 3) + '</span></li>';
      }).join('');
    }
    function refresh() { updatePanel(); draw(); }

    // ======================= Игра =======================
    // Раунд: запрос и три фразы. Верный ответ не вписан руками — это фраза с самым большим косинусом, посчитанным ниже.
    function idx(t) { return DATA.phrases.map(function (p) { return p[0]; }).indexOf(t); }
    var ROUNDS = DATA.rounds.map(function (r) { return { q: r.q, opts: r.o.map(idx), note: r.note }; });

    var quiz = MLViz.quiz({
      box: el('gamePanel'), rounds: ROUNDS.length,
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return T('gameOver', { s: q.score, n: q.n }); }
      },
      start: function (q) {
        // Порядок вариантов перемешиваем: верный ответ не должен угадываться по месту
        q.data.r = ROUNDS.map(function (r) { return { q: r.q, opts: MLViz.shuffle(r.opts, Math.random), note: r.note }; });
      },
      round: function (q) {
        var cur = q.data.r[q.i], qv = embed(cur.q).v;
        var cos = cur.opts.map(function (oi) { return MLPro.cosine(qv, PH[oi].v); });
        var best = 0; cos.forEach(function (c, k) { if (c > cos[best]) best = k; });
        state.game = { cur: cur, answered: false };
        el('gameQuery').textContent = '«' + cur.q + '»';
        q.choices(el('gameChoices'), cur.opts.map(function (oi) { return esc(PH[oi].text); }), function (k) { return k === best; }, function (k, ok) {
          state.game.answered = true;
          var list = cur.opts.map(function (oi, j) { return esc(PH[oi].text) + ' — <b>' + MLPro.fix(cos[j], 3) + '</b>'; }).join('; ');
          q.answer(ok ? 1 : 0, T('gameLine', { verdict: T(ok ? 'gameRight' : 'gameWrong'), best: esc(PH[cur.opts[best]].text), list: list }) +
            (cur.note ? T('gameNote_' + cur.note) : ''));
          draw();
        });
        draw();
      },
      onEnd: function () { state.game = null; el('gameChoices').innerHTML = ''; el('gameQuery').textContent = ''; draw(); }
    });

    function setMode(m) {
      state.mode = m;
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('explorePanel').hidden = m !== 'explore';
      el('gamePanel').hidden = m !== 'game';
      el('hint').textContent = T(m === 'explore' ? 'hintExplore' : 'hintGame');
      if (m === 'game') quiz.start(); else state.game = null;
      refresh();   // настройки «Исследуй» (запрос, k, мера) не сбрасываются игрой
    }

    // ======================= События =======================
    el('presets').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.text = PRESETS[+b.dataset.i]; el('qInput').value = ''; refresh();
    });
    el('qForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = el('qInput').value.trim(); if (!v) return;
      state.text = v; refresh();
    });
    el('k').addEventListener('input', function (e) { state.k = +e.target.value; refresh(); });
    el('metric').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.metric = b.dataset.m; refresh();
    });
    // Нажатие на фигурку делает фразу запросом (то же доступно с клавиатуры через поле запроса)
    cv.addEventListener('click', function (e) {
      if (state.mode !== 'explore') return;
      var p = MLViz.pointer(cv, e), best = -1, bd = 1e9;
      PH.forEach(function (ph, i) { var d = Math.hypot(sx(ph.x) - p.x, sy(ph.y) - p.y); if (d < bd) { bd = d; best = i; } });
      if (best >= 0 && bd < 24) { state.text = PH[best].text; el('qInput').value = PH[best].text; refresh(); }
    });
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });
    MLPro.onResize(resize);

    window.PRO_EMB = { embed: embed, search: search, phrases: PH };   // для сверки с sklearn (tools/check_pro.py)

    renderPresets();
    resize();
    setMode('explore');
  })();
  </script>
</body>
</html>
