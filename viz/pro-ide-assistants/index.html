          '<p><b>Как использовать на встрече гильдии.</b> 0–10 мин: кто чем пользуется и на какой ступени? Отметить требования банка и посмотреть, кто остаётся. Дальше — живое демо одного инструмента на учебном репозитории, без кода банка.</p>' +
          '<p><b>Вопросы для обсуждения.</b> Какие требования у нашего банка обязательные? Какие задачи мы готовы отдать ступени 4 и 5 и с какими проверками? Что делать с теми, кто уже пользуется ассистентами на личных аккаунтах?</p>',
        footer: 'Раздел «Для профи». Все расчёты выполняются прямо в браузере, без интернета и без настоящей модели.'
      }
    };

    var T = MLPro.init(STR), el = MLPro.el, esc = MLPro.esc;
    el('cv').setAttribute('aria-label', T('cvLabel'));

    // ======================= Данные =======================
    // Возможности инструментов (1 — есть) и задачи игры с признаками. Ступень признака: type 1 … auto 5
    var DATA = /* data:start */{
     "reqs": ["local", "gitlab", "agent", "jb", "inline"],
     "tools": [
      {"id":"duo","c":{"inline":1,"jb":1,"agent":1,"gitlab":1,"local":1},"lv":[1,2,3,4,5]},
      {"id":"cc","c":{"inline":0,"jb":1,"agent":1,"gitlab":1,"local":0},"lv":[2,3,4,5]},
      {"id":"copilot","c":{"inline":1,"jb":1,"agent":1,"gitlab":0,"local":0},"lv":[1,2,3,4,5]},
      {"id":"cursor","c":{"inline":1,"jb":0,"agent":1,"gitlab":0,"local":0},"lv":[1,2,3,4,5]},
      {"id":"open","c":{"inline":1,"jb":1,"agent":1,"gitlab":0,"local":1},"lv":[1,2,3,4]}],
     "levels": {"type":1, "ask":2, "multi":3, "run":4, "auto":5},
     "tasks": [
      {"id":"loop","f":["type"]}, {"id":"proc","f":["ask"]}, {"id":"rename","f":["multi"]},
      {"id":"fixtest","f":["ask","multi","run"]}, {"id":"upgrade","f":["multi","run"]}, {"id":"batch","f":["multi","run","auto"]},
      {"id":"err","f":["ask"]}, {"id":"field","f":["multi"]}, {"id":"tests","f":["multi","run"]}, {"id":"sql","f":["type"]}]
    }/* data:end */;
    var TOOLS = DATA.tools, REQS = DATA.reqs;

    // ======================= Расчёт =======================
    function fits(need) {   // инструменты, у которых есть все отмеченные возможности
      return TOOLS.filter(function (t) { return need.every(function (r) { return t.c[r] === 1; }); }).map(function (t) { return t.id; });
    }
    function levelOf(task) { return Math.max.apply(null, task.f.map(function (f) { return DATA.levels[f]; })); }

    // ======================= Состояние =======================
    var state = { mode: 'explore', lvl: 4, need: ['local'], game: null };

    // ======================= Лестница =======================
    var cv = el('cv'), g, STEPS = [];
    function resize() {
      var w = (cv.parentElement.clientWidth - 20) / MLViz.zoom();
      g = MLViz.fitCanvas(cv, w < 560 ? 1.0 : 0.55);
      draw();
    }
    function draw() {
      var ctx = g.ctx, fs = MLPro.fs(g), lh = Math.round(fs * 1.3), narrow = g.w < 560;
      ctx.clearRect(0, 0, g.w, g.h);
      var hl = state.mode === 'game' ? (state.game && state.game.answered ? state.game.right : 0) : state.lvl;
      STEPS = [];
      var pad = 8, n = 5, sw = (g.w - pad * 2) / n, base = g.h - pad, top = fs * 1.6 + 8, stepH = (base - top) / n;
      // Стрелка «больше самостоятельности — строже проверки» над лестницей
      ctx.fillStyle = MLViz.cssVar('--text-2'); ctx.font = MLPro.font(fs); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(T('lv1') + ' → ' + T('lv5'), pad, 2);
      for (var i = 0; i < n; i++) {
        var x = pad + i * sw, h = stepH * (i + 1), y = base - h;
        STEPS.push({ x: x, y: y, w: sw - 4, h: h, i: i + 1 });
        MLPro.rr(ctx, x, y, sw - 4, h, 8);
        ctx.fillStyle = i + 1 === hl ? MLViz.cssVar('--accent') : MLViz.cssVar('--paper'); ctx.fill();
        if (i + 1 === hl) { ctx.lineWidth = 3; ctx.strokeStyle = MLViz.cssVar('--ink'); ctx.stroke(); }
        ctx.fillStyle = MLViz.cssVar(i + 1 === hl ? '--accent-ink' : '--ink');
        ctx.font = MLPro.font(fs + 6, true); ctx.textAlign = 'center';
        ctx.fillText(String(i + 1), x + (sw - 4) / 2, y + 6);
        ctx.font = MLPro.font(narrow ? fs - 1 : fs, true);
        var lines = MLPro.wrap(ctx, T((narrow ? 'sl' : 'lv') + (i + 1)), sw - 12);   // на телефоне — короткие подписи, полные — в панели
        lines.forEach(function (ln, k) { ctx.fillText(ln, x + (sw - 4) / 2, y + 6 + fs + 10 + k * lh); });
        // Какие инструменты умеют эту ступень — цифры-номера инструментов внизу ступени
        if (!narrow && state.mode === 'explore') {
          ctx.font = MLPro.font(fs - 1);
          var who = TOOLS.filter(function (t) { return t.lv.indexOf(i + 1) !== -1; }).length;
          ctx.fillText(T('lvWho', { n: who, m: TOOLS.length }), x + (sw - 4) / 2, base - lh - 2);
        }
      }
    }
    function stepAt(p) { for (var i = 0; i < STEPS.length; i++) { var s = STEPS[i]; if (p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h) return s.i; } return 0; }

    // ======================= Панель =======================
    function renderPanel() {
      el('lvlSel').innerHTML = [1, 2, 3, 4, 5].map(function (i) { return '<button type="button" data-i="' + i + '">' + i + '. ' + T('lv' + i) + '</button>'; }).join('');
      el('reqs').innerHTML = REQS.map(function (r) {
        return '<li><label><input type="checkbox" data-r="' + r + '" id="req_' + r + '"><span>' + T('r_' + r) + '</span></label></li>';
      }).join('');
    }
    function update() {
      MLViz.setPressed(el('lvlSel'), function (b) { return +b.dataset.i === state.lvl; });
      var who = TOOLS.filter(function (t) { return t.lv.indexOf(state.lvl) !== -1; }).map(function (t) { return T('t_' + t.id); }).join(', ');
      el('lvlInfo').innerHTML = '<div><b>' + T('kWhat') + ':</b> ' + T('ld' + state.lvl) + '</div><div><b>' + T('kRisk') + ':</b> ' + T('lr' + state.lvl) + '</div><div><b>' + T('kWho') + ':</b> ' + esc(who) + '</div>';
      el('reqs').querySelectorAll('input').forEach(function (inp) { inp.checked = state.need.indexOf(inp.dataset.r) !== -1; });
      var ok = fits(state.need);
      el('fit').innerHTML = '<thead><tr><th>' + T('thTool') + '</th>' + REQS.map(function (r) { return '<th class="n" title="' + esc(T('r_' + r)) + '">' + T('rs_' + r) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        TOOLS.map(function (t) {
          return '<tr class="' + (state.need.length && ok.indexOf(t.id) !== -1 ? 'pass' : '') + '"><td>' + T('t_' + t.id) + '</td>' + REQS.map(function (r) {
            var on = state.need.indexOf(r) !== -1;
            return '<td class="n ' + (on ? (t.c[r] ? 'ok' : 'no') : '') + '">' + T(t.c[r] ? 'yes' : 'no') + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody>';
      el('fitNote').textContent = !state.need.length ? T('fitNoReq') : ok.length ? T('fitAll', { list: ok.map(function (id) { return T('t_' + id); }).join(', ') }) : T('fitNone');
    }
    function refresh() { update(); draw(); }

    // ======================= Игра «Какая ступень нужна?» =======================
    var order = [];
    var quiz = MLViz.quiz({
      box: el('gamePanel'), rounds: DATA.tasks.length,
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return T('gameOver', { s: q.score, n: q.n }); }
      },
      start: function () { order = MLViz.shuffle(DATA.tasks, Math.random); },
      round: function (q) {
        var task = order[q.i], right = levelOf(task);
        state.game = { right: right, answered: false };
        el('gameItem').innerHTML = '<b>' + esc(T('g_' + task.id)) + '</b>';
        q.choices(el('gameChoices'), [1, 2, 3, 4, 5].map(function (i) { return i + '. ' + T('lv' + i); }), function (k) { return k + 1 === right; }, function (k, ok) {
          state.game.answered = true;
          var why = task.f.map(function (f) { return T('f_' + f); }).join('; ');
          q.answer(ok ? 1 : 0, T('gameLine', { verdict: T(ok ? 'gameRight' : 'gameWrong'), l: right + '. ' + T('lv' + right), why: esc(why.charAt(0).toUpperCase() + why.slice(1)) + '. ' + T('lr' + right) }));
          draw();
        });
        draw();
      },
      onEnd: function () { state.game = null; el('gameChoices').innerHTML = ''; el('gameItem').innerHTML = ''; draw(); }
    });

    function setMode(m) {
      state.mode = m;
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('explorePanel').hidden = m !== 'explore';
      el('gamePanel').hidden = m !== 'game';
      el('hint').textContent = T(m === 'explore' ? 'hintExplore' : 'hintGame');
      if (m === 'game') quiz.start(); else state.game = null;   // выбор в «Исследуй» игра не трогает
      refresh();
    }

    // ======================= События =======================
    renderPanel();
    el('lvlSel').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.lvl = +b.dataset.i; refresh(); });
    el('reqs').addEventListener('change', function (e) {
      var r = e.target.dataset.r; if (!r) return;
      state.need = state.need.filter(function (x) { return x !== r; });
      if (e.target.checked) state.need.push(r);
      refresh();
    });
    cv.addEventListener('click', function (e) {
      if (state.mode !== 'explore') return;
      var i = stepAt(MLViz.pointer(cv, e)); if (!i) return;
      state.lvl = i; refresh();
    });
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });
    MLPro.onResize(resize);

    window.PRO_IDE = { fits: fits, levelOf: levelOf };   // для сверки (tools/check_pro.py)

    resize(); setMode('explore');
  })();
  </script>
</body>
</html>
