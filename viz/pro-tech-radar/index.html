  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .feature { font-size: var(--fs-lead); line-height: var(--lh-lead); color: var(--text-strong); margin: 0 0 8px; }
    .gates { list-style: none; margin: 8px 0 0; padding: 0; font-size: var(--fs-label); line-height: var(--lh-label); }
    .gates li { padding: 4px 0 4px 26px; position: relative; }
    .gates li::before { content: '✓'; position: absolute; left: 4px; font-weight: 700; color: var(--text-strong); }
    .gates li.fail { text-decoration: line-through; color: var(--text-2); }
    .gates li.fail::before { content: '✕'; text-decoration: none; }
    .ring-out { margin: 10px 0 0; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface-1); }
    .ring-out b { color: var(--text-strong); font-size: var(--fs-lead); }
    .choices.rings { grid-template-columns: 1fr 1fr; }
    #toolSel button { text-align: left; }
  </style>
</head>

  <header id="site-header"></header>

            <h3><span data-i18n="nLabel"></span>: <span id="nVal"></span></h3>

          <p class="note" data-i18n="wNote"></p>
          <div id="weights"></div>

          <button type="button" id="nextBtn" class="primary" hidden></button>
        </div>
      </aside>
    </div>

    <section class="section">
      <h2 data-i18n="howTitle"></h2>
      <div data-i18n-html="howBody"></div>
    </section>

    <section class="section">
      <h2 data-i18n="riskTitle"></h2>
      <div data-i18n-html="riskBody"></div>
    </section>

    <section class="section">

      text: {
        step: function (q) { var rd = DATA.rounds[q.i]; return T('gameRound', { i: q.i + 1, n: q.n, t: T('t_' + rd[0]), k: rd[1] }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return T('gameOver', { s: q.score, n: q.n }); }
      },
      round: function (q) {
        var rd = DATA.rounds[q.i], i = toolIdx(rd[0]), right = evaluate(i, rd[1], DATA.weights);
        state.game = { i: i, n: rd[1], answered: false };
        q.choices(el('gameChoices'), RINGS.map(function (r) { return T('r_' + r) + ' — ' + T('rd_' + r); }),
          function (k) { return RINGS[k] === right.ring; },
          function (k, ok) {
            state.game.answered = true;
            q.answer(ok ? 1 : 0, T('gameLine', { verdict: T(ok ? 'gameRight' : 'gameWrong'), tool: esc(T('t_' + rd[0])), r: T('r_' + right.ring), why: esc(whyText(right)) }));
            refresh();
          });
        refresh();
      },
      onEnd: function () { state.game = null; el('gameChoices').innerHTML = ''; refresh(); }
    });

    function setMode(m) {
      state.mode = m;
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('explorePanel').hidden = m !== 'explore';
      el('gamePanel').hidden = m !== 'game';
      el('hint').textContent = T(m === 'explore' ? 'hintExplore' : 'hintGame');
      if (m === 'game') quiz.start(); else state.game = null;   // настройки «Исследуй» игра не трогает
      refresh();
    }

    // ======================= События =======================
    renderTools();
    el('toolSel').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.sel = +b.dataset.i; refresh();
    });
    el('nTasks').addEventListener('input', function (e) { state.n = +e.target.value; refresh(); });
    el('weights').addEventListener('input', function (e) {
      if (e.target.dataset.i == null) return;
      state.w[+e.target.dataset.i] = +e.target.value; refresh();
    });
    // Нажатие на точку радара выбирает инструмент (то же — кнопки в панели)
    cv.addEventListener('click', function (e) {
      if (state.mode !== 'explore') return;
      var p = MLViz.pointer(cv, e);
      DOTS.forEach(function (d) { if (Math.hypot(p.x - d.x, p.y - d.y) <= d.r + 4) { state.sel = d.i; refresh(); } });
    });
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });
    MLPro.onResize(resize);

    window.PRO_RADAR = { evaluate: evaluate, welch: welch, tInv: tInv, n: TOOLS.length };   // для сверки (tools/check_pro.py)

    resize();
    setMode('explore');
  })();
  </script>
</body>
</html>
