        "final": "<b>Натиҷа: {s} аз {n}.</b> Ту тахмин мезадӣ, ки диққат чӣ тавр кор мекунад: ҳар як калима калимаҳои дорои аломатҳои мувофиқро меҷӯяд. Дар моделҳои ҳақиқӣ чунин «сар»-ҳои диққат даҳҳотоанд ва аломатҳоро онҳо худашон меомӯзанд.",
        "howTitle": "Ин чӣ тавр кор мекунад",
        "howBody": "<ol><li><b>Ҳар як калима аломатҳо дорад.</b> Ин эмбеддинги он аст (саҳифаи гузашта). Дар ин ҷо аломатҳо соддаанд: ҷинс, исм будан, ҷондор будан, феъл будан.</li><li><b>Дархост: ман чиро меҷӯям?</b> Ҳар як калима аломатҳои худро ба <b>дархост</b> (<i>query</i>, q) табдил медиҳад. «он» «ҷинси мардона + исм»-ро меҷӯяд. Феъли «съел» «исми ҷондор»-ро меҷӯяд — касеро, ки мехӯрад. Дар худи калима аломат танҳо ҳаст (1) ё нест (0), аммо дар дархост <b>қувва</b> меистад: «ҷинси мардона (4)» маънои «ин хусусият барои ман хеле муҳим аст»-ро дорад. Қувваи 4 хатои чопӣ нест: ҳамин тавр мувофиқат аз рӯи аломати зарурӣ аз дигарон вазнинтар мешавад.</li><li><b>Калид: ман чӣ дорам?</b> Ҳар як калима <b>калид</b> (<i>key</i>, k)-ро нишон медиҳад — аломатҳои худро. Дархостро бо калид муқоиса мекунем: зарб мезанем ва ҷамъ мекунем (q·k). Ҳар қадар мувофиқат бештар бошад, адад ҳамон қадар калонтар мешавад.</li><li><b>Фоизҳо.</b> Ададҳоро бо функсияи <b>softmax</b> ба фоизҳо табдил медиҳем: ҳама мусбат, дар маҷмӯъ 100%, адади калонтарин аз ҳама бештар мегирад. Ин маҳз диққат аст.</li><li><b>Ин ба модел чӣ лозим аст.</b> Фаҳмида, ки ба кӣ нигоҳ кунад, калима як қисми маънои ин калимаҳоро ба худ «мегирад»: «он» ба «он = пингвин» табдил меёбад. Ҳамин тавр модел «он»-ро бо «пингвин» мепайвандад ва калимаи ояндаро саҳеҳтар меёбад. Дар GPT даҳҳо қабат ва даҳҳо «сар»-и диққат ҳаст ва чиро ҷустанро онҳо худашон меомӯзанд.</li></ol>",
        "tryTitle": "Худат санҷ",
        "tryBody": "<ul><li>Дар ҷумлаи аввал ба «он» клик кун. Вай ба кӣ нигоҳ мекунад? Ба «…она была вкусной» гузар — чӣ тағйир ёфт?</li><li>Тезиро 0 гузор. Бо хатҳо ва ҷадвал чӣ шуд? 3 гузор.</li><li>«Танҳо ба қафо нигоҳ кардан»-ро фаъол кун. Чаро калимаи аввал ҳамеша танҳо ба худаш нигоҳ мекунад?</li><li>Ҷумлаи маккоронаро кушо. Чаро «она» байни духтарча ва конфет интихоб карда наметавонад? Кадом калима кӯмак мекард?</li><li>«Бозӣ: калима ба куҷо нигоҳ мекунад»-ро бозӣ кун. Феълҳо бештар ба кӣ нигоҳ мекунанд?</li></ul>",
        "mathTitle": "Барои кунҷковон: формула",
        "mathBody": "<p>Аломатҳои калимаҳо — сатрҳои матритсаи <i>X</i>. Дархостҳо <code>Q = X·W<sub>Q</sub>ᵀ</code>, калидҳо <code>K = X·W<sub>K</sub></code> (дар ин ҷо <i>W<sub>K</sub></i> — матритсаи воҳидӣ, калид = аломатҳо).</p><p><code>Attention = softmax(Q·Kᵀ / √d)</code>, ки дар он <i>d</i> = 8 — шумораи аломатҳост. Тақсим ба √d барои он лозим аст, ки ададҳо аз ҳад калон нашаванд. Лағжандаи «тезӣ» онҳоро иловатан зарб мекунад.</p><p><code>softmax(z)ᵢ = e^(zᵢ) / Σ e^(zⱼ)</code> — ҳама гуна ададҳоро ба фоизҳо табдил медиҳад.</p><p>Баъд ҳар як калима омехтаи <i>қиматҳо</i> (<i>values</i>)-и калимаҳои дигарро бо ҳамин фоизҳо мегирад: <code>баромад = Attention · V</code>. Ин қисмро мо дар ин ҷо намекашем.</p><p>Дар Python:</p><p><code>import numpy as np<br><br>#&nbsp;&nbsp;&nbsp;мард зан исм ҷонд ҷонш феъл хӯр хидм<br>X = np.array([[1, 0, 1, 1, 0, 0, 0, 0],&nbsp;&nbsp;# Пингвин<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[0, 1, 1, 0, 0, 0, 1, 0],&nbsp;&nbsp;# рыбу<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[1, 0, 0, 0, 1, 0, 0, 0]])&nbsp;&nbsp;# он<br>q_on = np.array([4, 0, 4, 0, 0, 0, 0, 0])&nbsp;&nbsp;# «он» меҷӯяд: ҷинси мардона, исм<br>scores = X @ q_on / np.sqrt(8)<br>weights = np.exp(scores) / np.exp(scores).sum()<br>print(weights.round(2))&nbsp;&nbsp;# аз ҳама бештар — ба «Пингвин»</code></p><p>Дар PyTorch ҳамаи ин як сатр аст: <code>torch.nn.functional.scaled_dot_product_attention(Q, K, V)</code>.</p>",
        "teacherTitle": "Барои омӯзгор",
        "teacherBody": "<p><b>Маълумот.</b> Чор ҷумла, ҳар як калима 8 аломат (0 ё 1) дорад ва матритсаи дархостҳои <i>W<sub>Q</sub></i> дастӣ дода шудааст: ҷонишин исми ҷинси худро меҷӯяд, феъл — исми ҷондори ҷинси худро, исм — феъли худро (<code>data/attention_sentences.js</code>). Ин як «сар»-и диққат бо аломатҳои фаҳмост; дар моделҳои ҳақиқӣ аломатҳо ва матритсаҳо омӯхта мешаванд. Ҳамаи вазнҳои диққат (бо ниқоб ва бе он) бо <code>tools/check_attention.py</code> (numpy) мувофиқат мекунанд.</p><p><b>Дар дарс чӣ тавр истифода бурдан мумкин аст.</b> 0–10 дақ: «Пингвин съел рыбу, потому что он был голоден» ва «…потому что она была вкусной»-ро бо овози баланд мехонем ва мепурсем, ки чӣ тавр фаҳмидем, ки «он» ва «она» кистанд. Баъд хатҳои диққатро нишон медиҳем. Дар охир бозии «Калима ба куҷо нигоҳ мекунад» ва ҷумлаи маккорона дар бораи духтарча ва конфет.</p><p><b>Саволҳо барои муҳокима.</b> Чаро дар забони англисӣ «it» нисбат ба «он / она»-и русӣ мушкилтар аст? Ба модел қабатҳои зиёди диққат чӣ лозим аст? Чаро GPT танҳо ба қафо нигоҳ мекунад, аммо моделҳои тарҷумон — ба ҳама тараф?</p>",
        "colab": "Кушодани дафтари дарс дар Colab",
        "footer": "Ҳамаи ҳисобҳо бевосита дар браузер иҷро мешаванд."
      }
      /* tg:end */
    };

    MLViz.renderHeader('../../');
    MLViz.applyI18n(STR);
    var T = function (k, v) { return MLViz.t(STR, k, v); };
    document.getElementById('cv').setAttribute('aria-label', T('cvLabel'));
    document.getElementById('heat').setAttribute('aria-label', T('heatLabel'));
    document.getElementById('sharp').setAttribute('aria-label', T('sharpLabel'));

    // ======================= Данные и внимание =======================
    var FEAT = ATTN_DATA.features, WQ = ATTN_DATA.WQ, D = FEAT.length;
    var SENTS = ATTN_DATA.sentences;
    var C_TEXT = MLViz.cssVar('--text'), C_MUTED = MLViz.cssVar('--muted');

    function query(x) { return WQ.map(function (row) { return row.reduce(function (s, w, k) { return s + w * x[k]; }, 0); }); }
    function dot(a, b) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }

    // Матрица внимания: строка i — как слово i распределяет внимание (сумма 100%)
    function attention(tokens, sharp, causal) {
      return tokens.map(function (ti, i) {
        var q = query(ti.x);
        var z = tokens.map(function (tj, j) { return causal && j > i ? -Infinity : dot(q, tj.x) / Math.sqrt(D) * sharp; });
        var m = Math.max.apply(null, z), e = z.map(function (v) { return Math.exp(v - m); });
        var s = e.reduce(function (a, b) { return a + b; }, 0);
        return { q: q, raw: tokens.map(function (tj) { return dot(q, tj.x); }), z: z, w: e.map(function (v) { return v / s; }) };
      });
    }
    // На кого слово смотрит сильнее всего (при равенстве — кто левее, как np.argmax)
    function argmax(w) { var b = 0; for (var j = 1; j < w.length; j++) if (w[j] > w[b] + 1e-9) b = j; return b; }
    function pct(x) { return Math.round(100 * x) + '%'; }

    // ======================= Состояние =======================
    var state = { s: 0, sel: 5, sharp: 1, causal: false, mode: 'explore', game: null };
    function cur() {
      var gm = state.game;
      var s = gm ? gm.s : state.s, tokens = SENTS[s].tokens;
      return { s: s, tokens: tokens, sel: gm ? gm.w : state.sel,
               A: attention(tokens, gm ? 1 : state.sharp, gm ? false : state.causal), hide: gm && !gm.answered };
    }

    // ======================= Рисунок: два столбика слов и линии =======================
    var cv = document.getElementById('cv'), g, L;
    function layout(n) {
      var fs = MLViz.fontPx(g ? g.w : 700) + 2, rowH = Math.max(44, Math.round(fs * 2.1));   // строка не ниже 44 px — удобно пальцем
      return { fs: fs, rowH: rowH, top: Math.round(fs * 2.2), h: Math.round(fs * 2.2) + n * rowH + 10 };
    }
    function resize() {
      var n = SENTS[cur().s].tokens.length;
      var w0 = cv.parentElement.clientWidth - 20;
      g = MLViz.fitCanvas(cv, layout(n).h / w0);
      L = layout(n);
      if (Math.abs(L.h - g.h) > 2) g = MLViz.fitCanvas(cv, L.h / g.w);
      resizeHeat();
      draw(); drawHeat();
    }
    function colX() { return { l: g.w * 0.08, r: g.w * 0.92 }; }   // края столбиков

    function draw() {
      var c = cur(), ctx = g.ctx, font = MLViz.cssVar('--font'), n = c.tokens.length;
      var X = colX(), yOf = function (i) { return L.top + i * L.rowH + L.rowH / 2; };
      ctx.clearRect(0, 0, g.w, g.h);
      ctx.font = 'bold ' + L.fs + 'px ' + font; ctx.textBaseline = 'middle';
      var wL = Math.max.apply(null, c.tokens.map(function (t) { return ctx.measureText(t.t).width; })) + 18;
      var x1 = X.l + wL, x2 = X.r - wL;

      ctx.fillStyle = C_MUTED; ctx.font = (L.fs - 2) + 'px ' + font;
      ctx.textAlign = 'left'; ctx.fillText(T('whoLabel'), X.l, L.top - L.fs * 0.9);
      ctx.textAlign = 'right'; ctx.fillText(T('whomLabel'), X.r, L.top - L.fs * 0.9);

      // Линии: все слова — еле заметно, выбранное — ярко, толщина по силе внимания
      if (!c.hide) {
        c.A.forEach(function (row, i) {
          if (i === c.sel) return;
          row.w.forEach(function (w, j) {
            if (w < 0.02) return;
            ctx.strokeStyle = 'rgba(169,162,204,' + (0.06 + 0.25 * w) + ')'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x1, yOf(i)); ctx.lineTo(x2, yOf(j)); ctx.stroke();
          });
        });
        c.A[c.sel].w.forEach(function (w, j) {
          if (w < 0.005) return;
          ctx.strokeStyle = 'rgba(238,234,251,' + (0.25 + 0.75 * w) + ')'; ctx.lineWidth = 1 + 14 * w;
          ctx.beginPath(); ctx.moveTo(x1, yOf(c.sel)); ctx.lineTo(x2, yOf(j)); ctx.stroke();
        });
      }

      // Слова
      c.tokens.forEach(function (t, i) {
        [[X.l, 'left', i === c.sel], [X.r, 'right', false]].forEach(function (side) {
          var w = ctx.measureText(t.t).width;
          ctx.font = (side[2] ? 'bold ' : '') + L.fs + 'px ' + font;
          w = ctx.measureText(t.t).width;
          var bx = side[1] === 'left' ? side[0] : side[0] - w - 14, by = yOf(i) - L.rowH * 0.38;
          ctx.fillStyle = side[2] ? 'rgba(238,234,251,.92)' : 'rgba(38,31,74,.95)';
          ctx.strokeStyle = 'rgba(169,162,204,.35)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.rect(bx, by, w + 14, L.rowH * 0.76); ctx.fill(); ctx.stroke();
          ctx.fillStyle = side[2] ? '#17132E' : C_TEXT; ctx.textAlign = 'left';
          ctx.fillText(t.t, bx + 7, yOf(i) + 1);
        });
        // Проценты для выбранного слова — справа у слова «на кого»
        if (!c.hide) {
          var w = c.A[c.sel].w[i];
          ctx.font = (L.fs - 2) + 'px ' + font; ctx.fillStyle = w > 0.005 ? C_TEXT : C_MUTED; ctx.textAlign = 'right';
          var tw = ctx.measureText(t.t).width;
          ctx.font = L.fs + 'px ' + font; tw = ctx.measureText(t.t).width;
          ctx.font = (L.fs - 2) + 'px ' + font;
          ctx.fillText(c.A[c.sel].z[i] === -Infinity ? '—' : pct(w), X.r - tw - 22, yOf(i) - L.rowH * 0.3);
        }
      });
    }

    // ======================= Таблица внимания (тепловая карта) =======================
    var heat = document.getElementById('heat'), hg;
    function resizeHeat() {
      var n = SENTS[cur().s].tokens.length;
      hg = MLViz.fitCanvas(heat, heat.parentElement.clientWidth < 600 ? 1.05 : 0.62);
    }
    function drawHeat() {
      var c = cur(), ctx = hg.ctx, font = MLViz.cssVar('--font'), n = c.tokens.length;
      var fs = Math.max(11, MLViz.fontPx(hg.w) - 1);
      ctx.clearRect(0, 0, hg.w, hg.h);
      ctx.font = fs + 'px ' + font;
      var lw = Math.max.apply(null, c.tokens.map(function (t) { return ctx.measureText(t.t).width; })) + 10;
      var top = lw * 0.75 + 6, cell = Math.min((hg.w - lw - 6) / n, (hg.h - top - 4) / n);
      var x0 = lw, y0 = top;
      c.tokens.forEach(function (t, i) {
        ctx.fillStyle = i === c.sel ? C_TEXT : C_MUTED; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(t.t, x0 - 6, y0 + (i + 0.5) * cell);
        ctx.save(); ctx.translate(x0 + (i + 0.5) * cell, y0 - 6); ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = C_MUTED; ctx.textAlign = 'left'; ctx.fillText(t.t, 0, 0); ctx.restore();
      });
      c.A.forEach(function (row, i) {
        row.w.forEach(function (w, j) {
          var X = x0 + j * cell, Y = y0 + i * cell;
          ctx.fillStyle = 'rgba(23,19,46,.85)'; ctx.fillRect(X + 1, Y + 1, cell - 2, cell - 2);
          if (!c.hide && row.z[j] !== -Infinity) {
            ctx.fillStyle = 'rgba(238,234,251,' + Math.min(1, w * 1.6) + ')'; ctx.fillRect(X + 1, Y + 1, cell - 2, cell - 2);
            if (cell > 30) {   // мельче 13 px не пишем
              ctx.fillStyle = w > 0.28 ? '#17132E' : C_TEXT; ctx.textAlign = 'center';   // тёмный текст, когда фон уже светлый
              ctx.font = Math.max(13, Math.min(16, cell * 0.4)) + 'px ' + font;
              ctx.fillText(Math.round(100 * w), X + cell / 2, Y + cell / 2 + 1);
              ctx.font = fs + 'px ' + font;
            }
          }
        });
      });
      ctx.strokeStyle = C_TEXT; ctx.lineWidth = 2;
      ctx.strokeRect(x0, y0 + c.sel * cell, n * cell, cell);
    }

    // ======================= Панель и расчёт =======================
    function el(id) { return document.getElementById(id); }
    function featList(vec, withNum) {
      var parts = [];
      vec.forEach(function (v, k) { if (v) parts.push(T('f_' + FEAT[k]) + (withNum ? ' (' + v + ')' : '')); });
      return parts;
    }

    function updatePanel() {
      var c = cur(), row = c.A[c.sel], word = c.tokens[c.sel].t;
      MLViz.setPressed(el('sentBtns'), function (b) { return +b.dataset.s === state.s; });
      el('sentNote').textContent = T('note_' + SENTS[state.s].id);
      el('sharp').value = state.sharp;
      el('sharpVal').textContent = String(state.sharp);
      el('causal').checked = state.causal;
      el('exploreBox').hidden = !!state.game;
      // Те же слова кнопками: выбрать слово можно и с клавиатуры, не только кликом по рисунку
      if (!state.game) {
        el('wordBtns').innerHTML = '';
        SENTS[state.s].tokens.forEach(function (t, i) {
          var b = document.createElement('button');
          b.type = 'button'; b.textContent = t.t; b.setAttribute('aria-pressed', i === state.sel);
          b.addEventListener('click', function () { state.sel = i; refresh(); });
          el('wordBtns').appendChild(b);
        });
      }
      el('calcBox').hidden = !!c.hide;

      var best = argmax(row.w);
      el('summary').innerHTML = c.hide ? '' : T('summary', { w: word, to: c.tokens[best].t, p: pct(row.w[best]) });

      el('calcTitle').textContent = T('calcTitle', { w: word });
      var seeks = featList(row.q, true);
      el('seeks').textContent = T('seeks', { w: word, list: seeks.length ? seeks.join(', ') : T('seeksNone') });
      var html = '<tr><th>' + T('colWord') + '</th><th>' + T('colHas') + '</th><th>' + T('colScore') + '</th><th>' + T('colScaled') + '</th><th>' + T('colW') + '</th></tr>';
      c.tokens.forEach(function (t, j) {
        var masked = row.z[j] === -Infinity;
        html += '<tr class="' + (j === best ? 'top' : '') + '"><td class="w">' + t.t + '</td><td style="text-align:left; color:var(--muted)">' +
          featList(t.x, false).join(', ') + '</td><td>' + row.raw[j] + '</td><td>' + (masked ? T('masked') : row.z[j].toFixed(2)) +
          '</td><td><span class="bar" style="width:' + Math.round(60 * row.w[j]) + 'px"></span>' + (masked ? '—' : pct(row.w[j])) + '</td></tr>';
      });
      el('calc').innerHTML = html;
    }

    function refresh() { updatePanel(); draw(); drawHeat(); }

    SENTS.forEach(function (s, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.s = i; b.textContent = T('sent_' + s.id);
      b.addEventListener('click', function () {
        state.s = i;
        // Выбираем местоимение — самое интересное слово
        var pi = s.tokens.map(function (t) { return t.x[FEAT.indexOf('pronoun')]; }).indexOf(1);
        state.sel = pi >= 0 ? pi : 0;
        resize(); refresh();
      });
      el('sentBtns').appendChild(b);
    });

    // ======================= Игра «Куда смотрит слово» (общий компонент MLViz.quiz) =======================
    var GAME = ATTN_DATA.game;
    var quiz = MLViz.quiz({
      box: el('gamePanel'), rounds: GAME.length,
      text: {
        step: function (q) { return T('gameStep', { i: q.i + 1, n: q.n, s: q.score }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finish'), again: T('again'),
        final: function (q) { return T('final', { s: q.score, n: q.n }); }
      },
      round: function (q) {
        var r = GAME[q.i];
        // state.game — какое предложение и слово показать; до ответа линии и расчёт скрыты
        state.game = { s: SENTS.map(function (s) { return s.id; }).indexOf(r[0]), w: r[1], answered: false };
        var tokens = SENTS[state.game.s].tokens;
        var row = attention(tokens, 1, false)[state.game.w], best = argmax(row.w);
        el('gameAsk').innerHTML = T('gameAsk', { w: tokens[state.game.w].t });
        // Равные по силе слова тоже засчитываем
        q.choices(el('choices'), tokens.map(function (t) { return t.t; }),
          function (k) { return Math.abs(row.w[k] - row.w[best]) < 1e-9; },
          function (k, ok) {
            state.game.answered = true;
            q.answer(ok ? 1 : 0, T(ok ? 'gameRight' : 'gameWrong', { to: tokens[best].t, p: pct(row.w[best]) }));
            refresh();
          });
        resize(); refresh();
      },
      onEnd: function () { el('gameAsk').innerHTML = ''; el('choices').innerHTML = ''; }
    });

    function setMode(m) {
      state.mode = m;
      MLViz.setPressed(el('modes'), function (b) { return b.id === (m === 'explore' ? 'modeExplore' : 'modeGame'); });
      el('gamePanel').hidden = m !== 'game';
      el('hint').textContent = T(m === 'explore' ? 'hintExplore' : 'hintGame');
      if (m === 'game') quiz.start();
      else { state.game = null; resize(); refresh(); }
    }

    // ======================= События =======================
    el('sharp').addEventListener('input', function (e) { state.sharp = +e.target.value; refresh(); });
    el('causal').addEventListener('change', function (e) { state.causal = e.target.checked; refresh(); });
    cv.addEventListener('pointerdown', function (e) {
      if (state.game) return;
      var m = MLViz.pointer(cv, e), i = Math.floor((m.y - L.top) / L.rowH);
      if (m.x < g.w / 2 && i >= 0 && i < SENTS[state.s].tokens.length) { state.sel = i; refresh(); }
    });
    el('modeExplore').addEventListener('click', function () { setMode('explore'); });
    el('modeGame').addEventListener('click', function () { setMode('game'); });

    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 120); });

    setMode('explore');
  })();
  </script>
</body>
</html>
