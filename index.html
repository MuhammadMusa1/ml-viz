<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лаборатория ML</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <div class="home-hero">
      <div>
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n="title"></h1>
        <p class="lead" data-i18n="lead"></p>
        <!-- «Продолжить: Урок N» вставляет скрипт — первая страница, где игра ещё не доиграна -->
        <div class="row home-actions" id="homeActions">
          <a class="btn" href="start/index.html" id="startBtn"><span data-i18n="startLink"></span></a>
          <a class="btn" href="book/index.html" id="bookBtn"><span data-i18n="bookLink"></span></a>
          <a class="btn" href="warmup/index.html" id="warmupBtn"><span data-i18n="warmupLink"></span></a>
          <a class="btn" href="roadmap/index.html" id="roadmapBtn"><span data-i18n="roadmapLink"></span></a>
        </div>
      </div>
      <!-- Прогресс ученика: сколько уроков доиграно до конца (хранится только в этом браузере) -->
      <aside class="progress-card" id="progress"></aside>
    </div>
    <div id="catalog"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap" data-i18n-html="footer"></div>
  </footer>

  <script src="assets/core.js"></script>
  <script src="assets/catalog.js"></script>
  <script>
    var STR = {
      ru: {
        eyebrow: 'Курс Machine Learning',
        title: 'Машинное обучение, которое можно потрогать',
        lead: 'Интерактивные визуализации к курсу из 24 уроков. Двигай точки, крути ползунки и смотри, как модель принимает решения. Без установки и без интернета.',
        planned: 'Скоро',
        startLink: 'Начинаю с нуля',
        bookLink: 'Учебники и Colab',
        warmupLink: 'Python-разминки',
        roadmapLink: 'Дорога в ML-инженеры',
        done: 'Пройден',
        current: 'Дальше',
        progress: 'Пройдено уроков: <b>{d} из {n}</b>',
        progressTitle: 'Пройдено уроков',
        progressCount: '<b>{d}</b> из {n}',
        start: 'Начать: {l}',
        continue: 'Продолжить: {l}',
        nextLine: 'Следующий — <b>{l} · {t}</b>.',
        allDone: 'Все игры курса доиграны до конца.',
        progressHint: 'Урок отмечается, когда доиграны игры на всех его страницах. Отметки хранятся только в этом браузере.',
        resetProgress: 'Сбросить отметки',
        proProgress: 'Профи: <b>{d} из {n}</b>',
        proProgressPlain: 'Профи: {d} из {n}',
        proHint: 'Раздел «Для профи» считается отдельно и в 24 урока не входит.',
        resetAsk: 'Сбросить все отметки о пройденных уроках в этом браузере?',
        footer: 'Данные: Palmer Penguins (Horst, Hill, Gorman, 2020). Работает офлайн: скачайте папку и откройте <code>index.html</code>.'
      },
      /* tg:start — перевод вставлен tools/i18n.js, не правьте руками */
      tg: {
        "eyebrow": "Курси Machine Learning",
        "title": "Омӯзиши мошиние, ки онро даст расондан мумкин аст",
        "lead": "Визуализатсияҳои интерактивӣ барои курси 24-дарса. Нуқтаҳоро ҳаракат деҳ, лағжандаҳоро тоб деҳ ва бин, ки модел чӣ тавр қарор қабул мекунад. Бе насб ва бе интернет.",
        "planned": "Ба зудӣ",
        "bookLink": "Китобҳо ва Colab",
        "warmupLink": "Машқҳои Python",
        "done": "Гузашт",
        "current": "Навбатӣ",
        "progress": "Дарсҳои гузашташуда: <b>{d} аз {n}</b>",
        "progressTitle": "Дарсҳои гузашташуда",
        "progressCount": "<b>{d}</b> аз {n}",
        "start": "Оғоз: {l}",
        "continue": "Идома: {l}",
        "nextLine": "Навбатӣ — <b>{l} · {t}</b>.",
        "allDone": "Ҳамаи бозиҳои курс то охир бозида шуданд.",
        "progressHint": "Дарс вақте қайд мешавад, ки бозиҳо дар ҳамаи саҳифаҳои он то охир бозида шаванд. Қайдҳо танҳо дар ҳамин браузер нигоҳ дошта мешаванд.",
        "resetProgress": "Тоза кардани қайдҳо",
        "resetAsk": "Ҳамаи қайдҳоро дар бораи дарсҳои гузашташуда дар ин браузер тоза кунем?",
        "footer": "Маълумот: Palmer Penguins (Horst, Hill, Gorman, 2020). Офлайн кор мекунад: ҷузвдонро боргирӣ кунед ва <code>index.html</code>-ро кушоед."
      }
      /* tg:end */
    };

    MLViz.renderHeader('');
    MLViz.applyI18n(STR);

    var L = MLViz.lang;
    var DONE = MLViz.doneList();
    // Отметки основного курса без раздела «Для профи»: от них зависят «Начать / Продолжить» и урок 0
    function mainDone() { return DONE.filter(function (id) { return PRO.indexOf(id) === -1; }).length; }

    // Страницы готовых уроков по номеру урока: у урока 13 две страницы, у урока 17 — три
    var BY_LESSON = {};
    // Раздел «Для профи» (it.pro) — не уроки курса: в 24 урока и в «Продолжить» не входит, считается отдельно
    var PRO = [];
    CATALOG.forEach(function (ph) { ph.items.forEach(function (it) {
      if (it.status !== 'ready') return;
      if (MLViz.isProItem(it)) { PRO.push(it.id); return; }
      (BY_LESSON[it.lesson] = BY_LESSON[it.lesson] || []).push(it.id);
    }); });

    var LESSONS = Object.keys(BY_LESSON).map(Number).sort(function (x, y) { return x - y; });
    var ITEM = {};
    CATALOG.forEach(function (ph) { ph.items.forEach(function (it) { ITEM[it.id] = it; }); });
    function isDone(id) { return DONE.indexOf(id) !== -1; }
    function lessonDone(n) { return BY_LESSON[n].every(isDone); }
    // Следующая страница: первая недоигранная в первом непройденном уроке (null — всё пройдено)
    // Урок 0 (подготовка) предлагаем только совсем новичку. Кто уже начал курс, продолжает с первого
    // непройденного урока 1–24, даже если урок 0 пропустил.
    function nextItem() {
      for (var i = 0; i < LESSONS.length; i++) {
        if (LESSONS[i] < 1 && mainDone()) continue;
        var ids = BY_LESSON[LESSONS[i]];
        for (var j = 0; j < ids.length; j++) if (!isDone(ids[j])) return ITEM[ids[j]];
      }
      return null;
    }
    function pageHref(it) { return 'viz/' + it.id + '/index.html' + (L !== 'ru' ? '?lang=' + L : ''); }

    // Полоса прогресса считает уроки, а не страницы: урок пройден, когда доиграны игры на всех его страницах.
    // Компьютер в классе общий — поэтому есть «Сбросить отметки»
    function renderProgress() {
      // Урок 0 (подготовка) — не из 24 уроков курса: в счётчик не входит, но «Начать» ведёт на него
      var COUNTED = LESSONS.filter(function (k) { return k >= 1; });
      var n = COUNTED.length, d = COUNTED.filter(lessonDone).length, next = nextItem();
      var plain = MLViz.t(STR, 'progress', { d: d, n: n }).replace(/<[^>]+>/g, '');
      document.getElementById('progress').innerHTML =
        '<div class="head"><span>' + MLViz.t(STR, 'progressTitle') + '</span><span class="count">' + MLViz.t(STR, 'progressCount', { d: d, n: n }) + '</span></div>' +
        '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + d + '" aria-label="' + plain + '">' +
          '<div class="fill" style="width:' + (100 * d / n) + '%"></div></div>' +
        '<p class="note">' + (next ? MLViz.t(STR, 'nextLine', { l: MLViz.lessonLabel(next), t: tx(next.title) }) : MLViz.t(STR, 'allDone')) + '</p>' +
        '<p class="note">' + MLViz.t(STR, 'progressHint') + '</p>' +
        (PRO.length ? proProgress() : '') +
        (DONE.length ? '<button type="button" class="reset" id="resetProgress">' + MLViz.t(STR, 'resetProgress') + '</button>' : '');
      // Главное действие — продолжить с того места, где остановился
      var old = document.getElementById('continueBtn');
      if (old) old.remove();
      if (next) {
        var a = document.createElement('a');
        a.className = 'btn primary'; a.id = 'continueBtn'; a.href = pageHref(next);
        a.innerHTML = MLViz.icon('arrow') + MLViz.t(STR, mainDone() ? 'continue' : 'start', { l: MLViz.lessonLabel(next) });
        document.getElementById('homeActions').insertBefore(a, document.getElementById('bookBtn'));
      }
      var rb = document.getElementById('resetProgress');
      if (rb) rb.addEventListener('click', function () {
        if (!window.confirm(MLViz.t(STR, 'resetAsk'))) return;
        MLViz.resetDone(); DONE = []; renderProgress(); renderCatalog();
      });
    }
    // Отдельная полоса раздела «Для профи»: страница отмечается, когда доиграна её игра
    function proProgress() {
      var n = PRO.length, d = PRO.filter(isDone).length;
      return '<div class="pro-progress"><div class="head"><span>' + MLViz.t(STR, 'proProgress', { d: d, n: n }) + '</span></div>' +
        '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + d + '" aria-label="' +
        MLViz.t(STR, 'proProgressPlain', { d: d, n: n }) + '"><div class="fill" style="width:' + (100 * d / n) + '%"></div></div>' +
        '<p class="note">' + MLViz.t(STR, 'proHint') + '</p></div>';
    }
    var tx = function (o) { return (o && (o[L] || o.ru)) || ''; };
    // Номер на бирке: «№ 05», у урока из нескольких страниц — «№ 13.1»
    function numLabel(it) {
      if (MLViz.isProItem(it)) return MLViz.lessonLabel(it);   // «П 03»
      var p = MLViz.lessonPart(it), n = (p.n < 10 ? '0' : '') + p.n;
      // «№» — обычным шрифтом: в Consolas этого знака нет, и он рисуется как «IF»
      return '<span class="no">№</span>' + n + (p.m > 1 ? '.' + p.k : '');
    }
    function renderCatalog() {
      var next = nextItem();
      var html = CATALOG.map(function (ph) {
        var cards = ph.items.map(function (it) {
          var ready = it.status === 'ready', done = ready && isDone(it.id), cur = next && next.id === it.id;
          var status = !ready ? MLViz.t(STR, 'planned')
            : done ? '✓ ' + MLViz.t(STR, 'done')
            : cur ? MLViz.icon('arrow') + MLViz.t(STR, 'current') : '';
          return '<' + (ready ? 'a' : 'div') + ' class="card ' + it.status + (done ? ' done' : '') + (cur ? ' current' : '') + '"' +
            (ready ? ' href="' + pageHref(it) + '"' : '') + ' aria-label="' + MLViz.lessonLabel(it) + ' · ' + tx(it.title).replace(/"/g, '&quot;') + '">' +
            '<div class="card-top"><span class="num">' + numLabel(it) + '</span>' + (status ? '<span class="status">' + status + '</span>' : '') + '</div>' +
            '<h3>' + tx(it.title) + '</h3>' +
            '<div class="analogy">' + tx(it.analogy) + '</div>' +
          '</' + (ready ? 'a' : 'div') + '>';
        }).join('');
        return '<section class="phase"' + (ph.pro ? ' id="pro"' : '') + '><div class="phase-head"><h2>' + tx(ph.phase) + '</h2>' +
          (tx(ph.weeks) ? '<span class="weeks">' + tx(ph.weeks) + '</span>' : '') + '</div>' +
          (ph.note ? '<p class="phase-note">' + tx(ph.note) + '</p>' : '') +
          '<div class="grid">' + cards + '</div></section>';
      }).join('');
      document.getElementById('catalog').innerHTML = html;
    }
    // Значки у кнопок учебника и разминок
    document.getElementById('startBtn').insertAdjacentHTML('afterbegin', MLViz.icon('flask'));
    document.getElementById('bookBtn').insertAdjacentHTML('afterbegin', MLViz.icon('book'));
    document.getElementById('warmupBtn').insertAdjacentHTML('afterbegin', MLViz.icon('code'));
    document.getElementById('roadmapBtn').insertAdjacentHTML('afterbegin', MLViz.icon('map'));
    renderProgress();
    renderCatalog();
    // Ссылка «К разделу Для профи» (index.html#pro): каталог рисуется скриптом, поэтому прокручиваем сами
    if (location.hash === '#pro' && document.getElementById('pro')) document.getElementById('pro').scrollIntoView();
  </script>
</body>
</html>
