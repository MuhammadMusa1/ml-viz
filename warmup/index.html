<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python-разминка · Лаборатория ML</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    /* Только для этой страницы: задание, код с номерами строк и подсветкой, сборка программы, итог */
    .lesson-picks { display: flex; flex-wrap: wrap; gap: 8px; }
    .lesson-picks button { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-code); font-size: var(--fs-label); padding: 6px 12px 6px 10px; border-radius: var(--r-s); }
    .lesson-picks button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
    .lesson-picks button[aria-pressed="true"] { background: var(--surface-3); border-color: var(--accent); }
    .warm { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
    .task-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    /* «Задание 3 из 8» — бирка журнала, как бирка урока */
    .task-head #gameStep { display: inline-flex; align-items: center; gap: 8px; margin: 0; background: var(--paper); color: var(--ink);
      border-radius: var(--r-xs); padding: 5px 12px 5px 10px; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: 700; }
    .task-head #gameStep::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
    .task-head #ask { margin: 0; font-size: var(--fs-h3); line-height: var(--lh-h3); }
    .task-hint { color: var(--text-2); margin: 8px 0 0; }
    .task-hint:empty { display: none; }
    .task-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 20px; }
    .task-grid.wide { grid-template-columns: minmax(0, 1fr); }
    @media (max-width: 900px) { .task-grid { grid-template-columns: minmax(0, 1fr); } }
    /* Код: тёмное поле, номера строк, подсветка */
    pre.code { font-family: var(--font-code); font-size: calc(var(--fs-code) + 2px); line-height: 1.55; color: var(--n-100); background: var(--n-950);
      border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 0; margin: 0; overflow-x: auto; }
    pre.code .ln { display: grid; grid-template-columns: 3.2em 1fr; min-height: 1.55em; white-space: pre; width: 100%; padding-right: 14px;
      font: inherit; color: inherit; text-align: left; background: transparent; border: 0; border-radius: 0; }
    pre.code .no { color: var(--n-500); text-align: right; padding-right: 1em; user-select: none; }
    pre.code button.ln { cursor: pointer; min-height: 44px; align-items: center; border-top: 1px solid rgba(255, 255, 255, .04); transition: background-color .15s; }
    pre.code button.ln:hover:not(:disabled) { background: var(--surface-2); }
    pre.code button.ln:disabled { cursor: default; opacity: 1; color: inherit; background: transparent; }
    pre.code .ln.is-right { background: var(--accent-soft) !important; box-shadow: inset 4px 0 0 var(--accent); }
    pre.code .ln.is-wrong { box-shadow: inset 4px 0 0 var(--n-300); outline: 1px dashed var(--n-300); outline-offset: -1px; }
    pre.code button.ln { padding: 0 14px 0 0; }   /* без общего отступа кнопок — номера строк в одну колонку */
    pre.code .ln.slot { color: var(--text-muted); min-height: 44px; align-items: center; border-top: 1px solid rgba(255, 255, 255, .04); }
    .tok-k { color: #C4B5FD; } .tok-s { color: #F5D0A9; } .tok-n { color: #FDBA74; } .tok-c { color: var(--n-400); } .tok-f { color: #A5F3FC; }
    /* Ответы */
    .choices.mono button { font-family: var(--font-code); font-weight: 400; font-size: calc(var(--fs-code) + 1px); text-align: left; display: flex; align-items: center; }
    .choices.mono button .key { margin-left: auto; }
    #answer .row { margin-top: 12px; }
    .parsons .lines { display: flex; flex-direction: column; gap: 8px; }
    .parsons .lines button { font-family: var(--font-code); font-weight: 400; font-size: calc(var(--fs-code) + 1px); white-space: pre-wrap; text-align: left; width: 100%; }
    /* Вердикт после ответа */
    #gameResult:empty { display: none; }
    .verdict { display: flex; gap: 14px; align-items: flex-start; margin-top: 20px; padding: 16px 20px; border-radius: var(--r-m); background: var(--surface-1); border: 1px solid var(--line); }
    .verdict .mark { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
    .verdict.ok .mark { background: var(--accent); color: var(--accent-ink); }
    .verdict.no .mark { border: 2px dashed var(--n-300); color: var(--text-2); }
    .verdict b.v { display: block; color: var(--text-strong); font-size: var(--fs-h3); line-height: var(--lh-h3); margin-bottom: 4px; }
    .verdict pre.code { margin-top: 10px; font-size: var(--fs-code); }
    #nextBtn { margin-top: 16px; }
    /* Итог */
    .final { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 32px; margin-top: 20px; padding: 24px; border-radius: var(--r-l); background: var(--surface-2); border: 1px solid var(--line); }
    @media (max-width: 900px) { .final { grid-template-columns: minmax(0, 1fr); } }
    .final .score { font-size: var(--fs-h2); color: var(--text-2); font-weight: 700; margin: 8px 0; font-variant-numeric: tabular-nums; }
    .final .score b { font-size: 72px; line-height: 1; color: var(--text-strong); }
    .projector .final .score b { font-size: 104px; }
    .final .row { margin-top: 16px; gap: 12px; }
    .repeat-list { list-style: none; padding: 0; margin: 8px 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .repeat-list li { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; border-radius: var(--r-m); background: var(--surface-1); border: 1px solid var(--line); }
    .repeat-list .n { flex: none; font-family: var(--font-code); font-size: var(--fs-label); color: var(--text-2); border: 1.5px solid var(--control-line); border-radius: var(--r-xs); padding: 0 6px; }
    .repeat-list b { color: var(--text-strong); }
    .repeat-list small { display: block; color: var(--text-muted); font-size: var(--fs-label); }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <div class="analogy-box" data-i18n-html="analogy"></div>

    <div style="margin-top:24px">
      <p class="sub" data-i18n="pick"></p>
      <div class="lesson-picks" id="lessonSeg"></div>
      <p class="note" id="lessonInfo" style="margin-top:12px"></p>
    </div>

    <div class="warm" id="game">
      <div class="task-head"><h3 id="gameStep"></h3><h2 id="ask"></h2></div>
      <p class="task-hint" id="hint"></p>
      <div class="task-grid" id="taskGrid">
        <pre class="code" id="code"></pre>
        <div><p class="sub" id="answerLabel"></p><div id="answer"></div></div>
      </div>
      <div id="gameResult"></div>
      <button type="button" id="nextBtn" hidden></button>
    </div>

    <section class="section">
      <h2 data-i18n="howTitle"></h2>
      <div data-i18n-html="howBody"></div>
    </section>

    <details class="box">
      <summary data-i18n="teacherTitle"></summary>
      <div data-i18n-html="teacherBody"></div>
    </details>
  </main>

  <script src="../assets/core.js"></script>
  <script src="../assets/catalog.js"></script>
  <script src="../data/warmup.js"></script>
  <script>

        pick: 'Разминка к уроку',

        lessonInfo: '<b>{l} · {t}.</b> Сегодня пригодится: {topics}.',

        hintParsons: '{g} Нажимай строки по порядку.',
        answerLabel: 'Выбери ответ',
        bugLabel: 'Или',
        errChoice: 'Ошибка — программа не запустится',
        lineN: 'Строка {n}',
        noBug: 'Ошибки нет',
        bugIs: 'Ошибка в строке {n}. Python напишет <code>{err}</code>.',
        poolLabel: 'Строки (нажми, чтобы добавить)',
        slot: '— нажми строку —',
        undo: '← Убрать последнюю',
        check: 'Проверить',
        rightOrder: 'Правильная программа:',
        right: 'Верно',
        wrong: 'Не так',
        finalScore: '<b>{s}</b> из {n}',
        finalAll: 'Отлично — ты готов к уроку!',
        finalSome: 'Неплохо. Перед уроком повтори темы, где ошибся.',
        finalFew: 'Эти темы стоит разобрать вместе с учителем — с ними урок пойдёт легче.',
        repeatTitle: 'Повтори',

        okTopics: 'Верно: {t}.',

        toLessonN: 'К уроку {n}',

        topic_var: 'переменные',
        topic_if: 'условия if / else',
        topic_list: 'списки и номера элементов',
        topic_dict: 'словари',
        topic_loop: 'цикл for',

        topic_slice: 'срезы списка',
        topic_fstr: 'f-строки',

        x_l1a: '210 больше 206 — условие верно, поэтому работает только строка под <code>if</code>. Ветка <code>else</code> пропускается: из двух веток всегда выполняется ровно одна.',
        x_l1b: 'Python сначала считает правую часть: 200 + 6 = 206, и кладёт результат обратно в <code>border</code>. Старое значение 200 стирается.',
        x_l1c: 'После условия <code>if</code> обязательно ставится двоеточие: <code>if flipper &gt; 206:</code>. Без него Python не понимает, где кончается условие — ошибка записи (SyntaxError).',
        g_l1d: 'Если масса больше 4500 г, она печатает Gentoo, иначе — not Gentoo. Для <code>mass = 5000</code> должно получиться Gentoo.',
        x_l1d: 'Сначала переменная, потом условие. Строки с отступом принадлежат тому <code>if</code> или <code>else</code>, который стоит над ними.',

        x_l2a: 'Номера в списке начинаются с 0: <code>masses[0]</code> — это 3750, <code>masses[1]</code> — 3800. Строки таблицы в pandas нумеруются так же, с нуля.',
        x_l2b: 'Словарь — как анкета пингвина: по названию поля (ключу) получаем значение. В pandas <code>df["species"]</code> работает так же, только достаёт целый столбец.',
        x_l2c: 'В списке 3 элемента, их номера 0, 1, 2. Номера 3 нет — Python выходит за край списка (IndexError). Строки 1 и 2 успели выполниться: программа успела напечатать 3.',
        g_l2d: 'Она добавляет в список Chinstrap и печатает, сколько теперь в нём пингвинов. Должно получиться 4.',
        x_l2d: '<code>append</code> добавляет элемент в конец списка, <code>len</code> считает элементы. Если посчитать до <code>append</code>, получится 3.',

        x_l3a: 'Цикл три раза прибавляет массу к <code>total</code>: 3000, 7000, 12000. <code>print</code> стоит без отступа — он не в цикле и выполняется один раз, в конце.',

        x_l3c: 'Тело цикла пишется с отступом (4 пробела). Без отступа Python не знает, что повторять, и останавливается на строке 3 — ошибка отступа (IndentationError).',
        g_l3d: 'Она считает среднюю массу пингвинов. Должно получиться 4000.0.',
        x_l3d: 'Среднее = сумма / количество. Сумму копим в цикле, а делим один раз — после цикла, поэтому последняя строка без отступа.',

        x_l4a: '<code>sorted</code> выстраивает числа по возрастанию. «Великан» 6300 оказывается с краю — так выбросы легко заметить.',
        x_l4b: 'После сортировки получается [3400, 3800, 6300], посередине стоит 3800 — это медиана. Среднее было бы 4500: один «великан» тянет его вверх, а медиану почти не сдвигает.',
        x_l4c: '<code>None</code> — «пусто», пропуск в данных. К числу нельзя прибавить пустоту: на строке 4, когда цикл доходит до <code>None</code>, Python останавливается (TypeError). В pandas такой пропуск выглядит как NaN.',
        g_l4d: 'Она складывает массы и пропускает пустые значения <code>None</code>. Должно получиться 7400.',
        x_l4d: '<code>is not None</code> значит «не пусто»: складываем только настоящие числа. Похоже на <code>dropna()</code> в pandas — пропуски просто не участвуют.',

        x_l5a: '<code>abs</code> — расстояние без знака: abs(40 − 46) = abs(−6) = 6. KNN ищет соседей как раз по таким расстояниям.',
        x_l5b: '<code>return</code> отдаёт результат обратно: <code>double(3)</code> — это 6, <code>double(4)</code> — 8, вместе 14. Сама функция ничего не печатает — печатает только <code>print</code>.',

        x_l6a: '<code>data[4:]</code> — от номера 4 до конца, это только [5]. <code>data[:4]</code> — первые четыре. Так пингвинов делят на train и test.',
        x_l6b: 'Совпали 3 ответа из 4: 3 / 4 = 0.75, то есть 75%. Это и есть точность (accuracy) — доля верных ответов.',
        x_l6c: 'Один знак <code>=</code> кладёт значение в переменную, а сравнивают двумя: <code>==</code>. Python видит ошибку записи на строке 3 (SyntaxError).',
        g_l6d: 'Она печатает: accuracy = 0.75',
        x_l6d: 'Сначала данные, потом расчёт, потом вывод. <code>f"…{acc}…"</code> подставляет значение переменной прямо в текст.',

        howTitle: 'Как это работает',
        howBody:
          '<ol>' +
          '<li><b>Выбери урок</b> — задания только на тот Python, который понадобится на этом уроке.</li>' +
          '<li><b>Сначала подумай, потом нажимай.</b> Угадывать бесполезно: после ответа появится объяснение, и попытка одна.</li>' +
          '<li><b>Ошибся — найди это место в коде</b> и прочитай объяснение ещё раз. Ошибки — нормальная часть программирования.</li>' +
          '<li><b>В конце — итог</b> и список тем, которые стоит повторить.</li>' +
          '<li><b>Ещё лучше:</b> перепиши программу в Thonny или Colab, поменяй одно число и угадай новый ответ, прежде чем запустить.</li>' +
          '</ol>',
        teacherTitle: 'Для учителя',
        teacherBody:

          '<p><b>Как:</b></p>' +

          '<li>В парах: один отвечает, второй объясняет почему. Сильного сажайте со слабым.</li>' +

          '<li>Итог показывает темы с ошибками — их стоит повторить на этом уроке, хотя бы 2 минуты.</li>' +
          '</ul>' +
          '<p><b>Ответы проверены настоящим Python:</b> задания написаны в <code>tools/build_warmup.py</code>, скрипт запускает каждую программу и сам записывает вывод, строку ошибки и все верные порядки строк в <code>data/warmup.js</code>.</p>'

    MLViz.renderHeader('../');
    MLViz.applyI18n(STR);

    var T = function (k, v) { return MLViz.t(STR, k, v); };
    var el = function (id) { return document.getElementById(id); };
    var W = window.WARMUP;
    var LESSONS = Object.keys(W).map(Number).sort(function (a, b) { return a - b; });
    var rand = MLViz.rng(Date.now());   // свой порядок вариантов при каждой игре
    el('code').setAttribute('aria-label', T('codeAria'));

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    // Подсветка Python: ключевые слова, строки, числа, встроенные функции, комментарии.
    // Цвета пастельные и только внутри кода — интерфейс и данные ими не красим
    var HL = /(f?"[^"]*"|'[^']*')|(#.*$)|\b(def|return|if|elif|else|for|in|while|not|is|and|or|None|True|False|import|from|as)\b|\b(print|len|abs|sorted|sum|range|min|max)\b(?=\()|\b(\d+(?:\.\d+)?)\b/g;
    function hl(line) {
      var out = '', last = 0, m;
      HL.lastIndex = 0;
      while ((m = HL.exec(line))) {
        out += esc(line.slice(last, m.index));
        var cls = m[1] ? 's' : m[2] ? 'c' : m[3] ? 'k' : m[4] ? 'f' : 'n';
        out += '<span class="tok-' + cls + '">' + esc(m[0]) + '</span>';
        last = m.index + m[0].length;
      }
      return out + esc(line.slice(last));
    }
    function lineHtml(text, i) { return '<span class="no">' + (i + 1) + '</span><span>' + hl(text) + '</span>'; }
    // Код с номерами строк: в заданиях «найди ошибку» номер строки — это ответ
    function codeHtml(code) {
      return code.split('\n').map(function (l, i) { return '<span class="ln">' + lineHtml(l, i) + '</span>'; }).join('');
    }
    function verdict(ok, body) {
      return '<div class="verdict ' + (ok ? 'ok' : 'no') + '"><span class="mark" aria-hidden="true">' + (ok ? '✓' : '✕') + '</span>' +
        '<div><b class="v">' + T(ok ? 'right' : 'wrong') + '</b>' + body + '</div></div>';
    }
    function lessonItem(n) {
      var it = null;
      (window.CATALOG || []).forEach(function (ph) { ph.items.forEach(function (x) { if (!it && x.lesson === n) it = x; }); });
      return it;
    }
    function topicsOf(list) {
      var seen = [];
      list.forEach(function (t) { if (seen.indexOf(t.topic) === -1) seen.push(t.topic); });
      return seen.map(function (k) { return T('topic_' + k); }).join(', ');
    }

    // ---------- Выбор урока: ?lesson=N в адресе (на него ведёт ссылка со страницы урока) ----------
    var lesson = +new URLSearchParams(location.search).get('lesson');
    if (LESSONS.indexOf(lesson) === -1) lesson = LESSONS[0];
    var retryIdx = null, pendingRetry = false;   // «Пройти ошибки ещё раз»: номера заданий с ошибками

    LESSONS.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.n = n;
      b.setAttribute('aria-label', T('lessonBtn', { n: n }));
      b.textContent = '№ ' + (n < 10 ? '0' : '') + n;
      b.addEventListener('click', function () { pickLesson(n); });
      el('lessonSeg').appendChild(b);
    });
    function pickLesson(n) {
      lesson = n; retryIdx = null;
      MLViz.setPressed(el('lessonSeg'), function (b) { return +b.dataset.n === n; });
      var it = lessonItem(n);
      el('lessonInfo').innerHTML = T('lessonInfo', {
        l: it ? MLViz.lessonLabel(it) : T('lessonBtn', { n: n }),
        t: it ? esc(it.title[MLViz.lang] || it.title.ru) : '',
        topics: topicsOf(W[n])
      }) + (it && it.status === 'ready' ? ' <a href="../viz/' + it.id + '/index.html">' + T('toLesson') + '</a>' : '');
      // Адрес запоминает урок: перезагрузка и переключатель языка остаются на нём
      var u = new URL(location.href); u.searchParams.set('lesson', n);
      try { history.replaceState(null, '', u.toString()); } catch (e) {}
      game.start();
    }

    // ---------- Раунды ----------
    function tasks() {
      var all = W[lesson];
      return retryIdx ? retryIdx.map(function (i) { return all[i]; }) : all;
    }
    function layout(wide) {
      el('taskGrid').classList.toggle('wide', !!wide);
      el('code').hidden = false;
    }

    // «Что выведет?»: код слева, варианты справа (клавиши 1–4 добавляет MLViz.quiz)
    function roundOut(q, t) {
      layout(false);
      el('ask').textContent = T('askOut');
      // Про клавиши говорим только там, где есть клавиатура
      el('hint').textContent = T('hintOut') + (window.matchMedia('(pointer: coarse)').matches ? '' : ' ' + T('keysHint', { n: t.choices.length }));
      el('answerLabel').textContent = T('answerLabel');
      el('code').innerHTML = codeHtml(t.code);
      var opts = MLViz.shuffle(t.choices.map(function (c, k) { return { v: c, ok: k === 0 }; }), rand);
      var box = el('answer');
      box.className = 'choices mono';
      q.choices(box, opts.map(function (o) {
        return o.v === '!err' ? esc(T('errChoice')) : esc(o.v).replace(/\n/g, '<br>');
      }), function (k) { return opts[k].ok; }, function (k, ok) {
        q.data.res[q.i] = ok;
        q.answer(ok ? 1 : 0, verdict(ok, T('x_' + t.id)));
      });
    }

    // «В какой строке ошибка?»: строки кода — сами кнопки
    function roundBug(q, t) {
      layout(false);
      el('ask').textContent = T('askBug');
      el('hint').textContent = T('hintBug');
      el('answerLabel').textContent = T('bugLabel');
      var code = el('code'), lines = t.code.split('\n'), done = false;
      code.innerHTML = '';
      function finish(pickedLine) {
        if (done) return;
        done = true;
        var ok = pickedLine === t.line;
        code.querySelectorAll('button.ln').forEach(function (b) {
          b.disabled = true;
          if (+b.dataset.n === t.line) b.classList.add('is-right');
          else if (+b.dataset.n === pickedLine) b.classList.add('is-wrong');
        });
        noBtn.disabled = true;
        if (pickedLine === 0) noBtn.classList.add('wrong');
        q.data.res[q.i] = ok;
        q.answer(ok ? 1 : 0, verdict(ok, T('bugIs', { n: t.line, err: t.err }) + ' ' + T('x_' + t.id)));
      }
      lines.forEach(function (l, i) {
        if (!l.trim()) { code.insertAdjacentHTML('beforeend', '<span class="ln">' + lineHtml('', i) + '</span>'); return; }
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'ln'; b.dataset.n = i + 1;
        b.setAttribute('aria-label', T('lineN', { n: i + 1 }) + ': ' + l.trim());
        b.innerHTML = lineHtml(l, i);
        b.addEventListener('click', function () { finish(i + 1); });
        code.appendChild(b);
      });
      var box = el('answer');
      box.className = '';
      box.innerHTML = '';
      var noBtn = document.createElement('button');
      noBtn.type = 'button'; noBtn.textContent = T('noBug');
      noBtn.addEventListener('click', function () { finish(0); });
      box.appendChild(noBtn);
    }

    // «Собери программу»: слева — нумерованные строки программы, справа — строки, которые нажимают по порядку
    function roundParsons(q, t) {
      layout(false);
      el('ask').textContent = T('askParsons');
      el('hint').innerHTML = T('hintParsons', { g: T('g_' + t.id) });
      el('answerLabel').textContent = T('poolLabel');
      var n = t.lines.length, built = [], pool, done = false;
      function isValid(order) { return t.orders.some(function (o) { return o.join() === order.join(); }); }
      // Перемешиваем так, чтобы строки не стояли сразу в верном порядке
      do { pool = MLViz.shuffle(MLViz.range(0, n - 1, 1), rand); } while (isValid(pool));
      var box = el('answer');
      box.className = 'parsons';
      box.innerHTML = '<div class="lines" id="pool"></div>' +
        '<div class="row"><button type="button" id="undoBtn">' + T('undo') + '</button>' +
        '<button type="button" class="primary" id="checkBtn" disabled>' + T('check') + '</button></div>';
      function draw() {
        var code = el('code'), pEl = el('pool');
        code.innerHTML = ''; pEl.innerHTML = '';
        for (var i = 0; i < n; i++) {
          if (i < built.length) {
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'ln'; b.disabled = done;
            b.innerHTML = lineHtml(t.lines[built[i]], i);
            b.addEventListener('click', (function (pos) { return function () { built.splice(pos, 1); draw(); }; })(i));
            code.appendChild(b);
          } else {
            code.insertAdjacentHTML('beforeend', '<span class="ln slot"><span class="no">' + (i + 1) + '</span><span>' + T('slot') + '</span></span>');
          }
        }
        pool.forEach(function (k) {
          if (built.indexOf(k) !== -1) return;
          var b = document.createElement('button');
          b.type = 'button'; b.textContent = t.lines[k]; b.disabled = done;
          b.addEventListener('click', function () { built.push(k); draw(); });
          pEl.appendChild(b);
        });
        el('checkBtn').disabled = done || built.length < n;
        el('undoBtn').disabled = done || !built.length;
      }
      el('undoBtn').addEventListener('click', function () { built.pop(); draw(); });
      el('checkBtn').addEventListener('click', function () {
        if (built.length < n) return;
        var ok = isValid(built);
        done = true; draw();
        q.data.res[q.i] = ok;
        q.answer(ok ? 1 : 0, verdict(ok, (ok ? '' : T('rightOrder') + '<pre class="code">' + codeHtml(t.lines.join('\n')) + '</pre>') + T('x_' + t.id)));
      });
      draw();
    }

    // Итог: счёт, «Повтори» с заданиями, где ошибся, и «Пройти ошибки ещё раз»
    function finalHtml(q) {
      var list = tasks(), missed = [], good = [];
      var items = list.map(function (t, i) {
        if (q.data.res[i]) { good.push(t); return ''; }
        missed.push(i);
        return '<li><span class="n">' + (missed.length < 10 ? '0' : '') + missed.length + '</span><div><b>' + T('topic_' + t.topic) + '</b>' +
          '<small>' + T('repeatItem', { i: i + 1 }) + ' · ' + T(t.type === 'out' ? 'askOut' : t.type === 'bug' ? 'askBug' : 'askParsons') + '</small></div></li>';
      }).join('');
      q.data.missed = missed.map(function (i) { return W[lesson].indexOf(list[i]); });
      // «Верно» — только темы, где не было ни одной ошибки (иначе тема окажется и в «Повтори», и в «Верно»)
      var missedTopics = missed.map(function (i) { return list[i].topic; });
      var goodOnly = good.filter(function (t) { return missedTopics.indexOf(t.topic) === -1; });
      var msg = q.score === q.n ? T('finalAll') : q.score >= q.n / 2 ? T('finalSome') : T('finalFew');
      var it = lessonItem(lesson);
      return '<div class="final"><div>' +
          '<div class="score">' + T('finalScore', { s: q.score, n: q.n }) + '</div><p>' + msg + '</p>' +
          '<div class="row">' + (missed.length ? '<button type="button" class="btn" id="retryBtn">' + T('retry') + '</button>' : '') +
          (it && it.status === 'ready' ? '<a class="btn" href="../viz/' + it.id + '/index.html">' + T('toLessonN', { n: lesson }) + '</a>' : '') + '</div>' +
        '</div><div>' +
          (missed.length ? '<p class="sub">' + T('repeatTitle') + '</p><ul class="repeat-list">' + items + '</ul>' : '') +
          (goodOnly.length ? '<p class="note">' + T('okTopics', { t: topicsOf(goodOnly) }) + '</p>' : '') +
        '</div></div>';
    }

    var game = MLViz.quiz({
      box: el('game'),
      rounds: function () { return tasks().length; },
      text: {
        step: function (q) { return T('step', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), again: T('again'), finishTitle: T('finishTitle'),
        final: finalHtml
      },
      start: function (q) {
        if (!pendingRetry) retryIdx = null;
        pendingRetry = false;
        q.data.res = [];
      },
      round: function (q) {
        var t = tasks()[q.i];
        if (t.type === 'out') roundOut(q, t);
        else if (t.type === 'bug') roundBug(q, t);
        else roundParsons(q, t);
      },
      onEnd: function (q) {
        el('ask').textContent = ''; el('hint').textContent = '';
        el('taskGrid').hidden = true;
        var rb = el('retryBtn');
        if (rb) rb.addEventListener('click', function () {
          retryIdx = q.data.missed; pendingRetry = true;
          game.start();
        });
      }
    });
    // Новый раунд или новая игра — сетка задания снова видна
    el('nextBtn').addEventListener('click', function () { el('taskGrid').hidden = false; }, true);
    var _start = game.start;
    game.start = function () { el('taskGrid').hidden = false; _start(); };

    pickLesson(lesson);
  </script>
</body>
</html>
