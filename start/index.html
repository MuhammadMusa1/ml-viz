<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Начать с нуля · Лаборатория ML</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <div class="analogy-box" data-i18n-html="analogy"></div>

    <section class="section">
      <h2 data-i18n="fearTitle"></h2>
      <div class="myth-list" id="fears"></div>
    </section>

    <section class="section">
      <h2 data-i18n="routeTitle"></h2>
      <p data-i18n-html="routeLead"></p>
    </section>
    <!-- Маршрут — вне .section: там у списков свои номера-кружки, а у шагов маршрута — бирки -->
    <ol class="route" id="route"></ol>

    <section class="section">
      <h2 data-i18n="rhythmTitle"></h2>
      <div data-i18n-html="rhythmBody"></div>
    </section>

    <section class="section">
      <h2 data-i18n="mathTitle"></h2>
      <div data-i18n-html="mathBody"></div>
    </section>

    <section class="section">
      <h2 data-i18n="dontTitle"></h2>
      <div data-i18n-html="dontBody"></div>
    </section>

    <details class="box">
      <summary data-i18n="teacherTitle"></summary>
      <div data-i18n-html="teacherBody"></div>
    </details>
  </main>

  <footer class="site-footer"><div class="wrap" data-i18n-html="footer"></div></footer>

  <script src="../assets/core.js"></script>
  <script src="../assets/catalog.js"></script>
  <script>
  (function () {
    'use strict';

    // ======================= Тексты =======================
    var STR = {
      ru: {
        title: 'Начать с нуля',
        eyebrow: 'С чего начать',
        analogy: '<b>Чтобы научиться плавать, не нужно сначала прочитать учебник по физике воды.</b> Так и здесь: программирование и математика не нужны заранее. Ты начинаешь с игр, где видно, как модель думает, а код и формулы добавляются понемногу — ровно тогда, когда без них уже интересно.',
        fearTitle: 'Если ты думаешь так',
        seems: 'Кажется', really: 'На самом деле',
        f1a: 'Я ни разу не программировал — мне сюда рано.',
        f1b: 'Курс сделан для школьников 12–17 лет, которые тоже начинали с нуля. В уроках почти нет кода: ты двигаешь точки и крутишь ползунки. Python добавляется по 5–7 минут перед каждым уроком.',
        f2a: 'У меня плохая математика — ML не для меня.',
        f2b: 'В уроках 1–12 хватает школьной арифметики: проценты, среднее, точки на графике. Где появляется что-то сложнее, это показано картинкой, а формулы спрятаны в конце страницы — их можно пропустить.',
        f3a: 'Сначала выучу Python и математику, потом начну ML.',
        f3b: 'Так многие бросают, не дойдя до интересного. Лучше наоборот: увидеть, как работает модель, и тогда станет понятно, зачем нужны Python и математика.',
        f4a: 'Не понимаю, как устроен компьютер и что такое файл.',
        f4b: 'Для этого есть Урок 0 «Как устроен компьютер». С него и начни — он не входит в 24 урока, это разминка перед курсом.',
        routeTitle: 'Маршрут',
        routeLead: 'Иди по шагам сверху вниз. Отметки «пройдено» на главной появятся сами, когда доиграешь игру на странице урока.',
        stepTag: 'Шаг {n}',
        s1_title: 'Урок 0: как устроен компьютер',
        s1_time: 'Первая неделя',
        s1_text: '<ul><li>Что внутри компьютера, что такое файл и программа.</li><li>Как компьютер хранит числа и текст — это пригодится, когда дойдём до данных.</li></ul>',
        s2_title: 'Урок 1: что такое машинное обучение',
        s2_time: 'Сразу после Урока 0',
        s2_text: '<ul><li>Сначала Python-разминка к уроку 1 — 5–7 минут.</li><li>Потом сама страница урока: сыграй в игру до конца.</li><li>Ответь себе на вопросы «Попробуй сам».</li></ul>',
        s3_title: 'Уроки 2–12: данные и классические модели',
        s3_time: 'Примерно 6 недель при двух уроках в неделю',
        s3_text: '<ul><li>Датасет, корреляция, выбросы, ближайшие соседи (KNN), дерево решений, случайный лес.</li><li>Математика — школьная: проценты, среднее, график с осями.</li><li>В ноутбуке Colab код уже написан: запусти его и поменяй одно число — посмотри, что изменилось.</li></ul>',
        s4_title: 'Уроки 13–24: нейросети, языковые модели и свой проект',
        s4_time: 'Ещё примерно 6 недель',
        s4_text: '<ul><li>Как учится нейросеть, распознавание цифр и картинок, токены и эмбеддинги, как работает ChatGPT.</li><li>Финальный проект и Demo Day: своя модель с интерфейсом.</li></ul>',
        s5_title: 'Дальше: дорога в ML-инженеры',
        s5_time: 'После курса',
        s5_text: '<ul><li>Python уверенно, математика для ML, инструменты, проекты — по шагам.</li><li>Раздел «Для профи» — для тех, кто прошёл курс или уже работает с ИИ.</li></ul>',
        b_lesson0: 'Открыть Урок 0', b_warm1: 'Разминка к уроку 1', b_lesson1: 'Открыть Урок 1', b_home: 'Все уроки на главной',
        b_pybook: 'Учебник Python', b_roadmap: 'Дорога в ML-инженеры',
        rhythmTitle: 'Как заниматься',
        rhythmBody:
          '<ol>' +
          '<li><b>Два урока в неделю</b> — как в курсе. Лучше понемногу, но регулярно.</li>' +
          '<li><b>Один урок — по кругу:</b> разминка Python (5–7 минут) → страница урока и игра (20–30 минут) → «Попробуй сам» → ноутбук Colab (поменять одно число и посмотреть, что изменилось).</li>' +
          '<li><b>Застрял — нажми «Для учителя» или «Для любопытных»</b> только если интересно; для движения дальше они не нужны.</li>' +
          '<li><b>Python глубже</b> — после урока 6, по 20 минут в день по учебнику Python. Тогда код в ноутбуках станет понятнее.</li>' +
          '</ol>',
        mathTitle: 'Какая математика встретится',
        mathBody:
          '<div class="tbl-wrap"><table class="ptab"><thead><tr><th>Уроки</th><th>Что встретится</th><th>Как это показано</th></tr></thead><tbody>' +
          '<tr><td>1–7</td><td>Проценты, среднее, точки на графике, расстояние между точками</td><td>Точки двигаешь сам; расстояние считает компьютер</td></tr>' +
          '<tr><td>8</td><td>Прямая на графике</td><td>Кладёшь «линейку» через точки и видишь ошибку</td></tr>' +
          '<tr><td>9–12</td><td>Доли, среднее и стандартное отклонение — «насколько обычно отличаются от среднего»</td><td>Полоски и таблицы</td></tr>' +
          '<tr><td>13–16</td><td>Как сеть учится: шаг вниз по склону ошибки</td><td>Спуск с горы в тумане маленькими шагами</td></tr>' +
          '<tr><td>17–18</td><td>Векторы — списки чисел</td><td>Слово — «анкета» из чисел; похожие слова на карте рядом</td></tr>' +
          '</tbody></table></div>' +
          '<p class="note">Если что-то из школьной программы забылось — не страшно: вернись к нему, когда встретишь на уроке. Так запоминается лучше, чем «на всякий случай».</p>',
        dontTitle: 'Чего не делать',
        dontBody:
          '<ul>' +
          '<li><b>Не начинай с раздела «Для профи».</b> Он для взрослых инженеров и тех, кто прошёл курс.</li>' +
          '<li><b>Не учи сначала всю математику и весь Python.</b> Иди по урокам — нужное придёт вовремя.</li>' +
          '<li><b>Не пропускай игру.</b> Урок засчитывается, когда игра доиграна до конца, и именно в ней видно, понял ли ты.</li>' +
          '<li><b>Не переживай за формулы</b> в «Для любопытных»: это для тех, кому интересно заглянуть глубже.</li>' +
          '</ul>',
        teacherTitle: 'Для учителя',
        teacherBody:
          '<p><b>Когда показать.</b> Ученику, который пришёл без программирования и боится математики, — до первого урока. Страница отвечает на вопрос «как мне это поможет, если я начинаю с нуля?».</p>' +
          '<p><b>Как использовать.</b> Пройти вместе Урок 0 и разминку к уроку 1, потом дать ритм: два урока в неделю по кругу «разминка → урок → ноутбук». Через 2–3 недели спросить, что стало понятнее.</p>' +
          '<p><b>Аккаунты.</b> Для ноутбуков Colab нужен аккаунт Google; до 13 лет — вместе с родителями. Сам сайт работает без аккаунта и без интернета.</p>',
        footer: 'Сайт работает офлайн: уроки, разминки и учебники открываются без интернета. Ноутбукам Colab нужен интернет.'
      }
    };
    var T = function (k, v) { return MLViz.t(STR, k, v); };
    var el = function (id) { return document.getElementById(id); };
    MLViz.renderHeader('../');
    MLViz.applyI18n(STR);

    // ======================= Страхи — в виде «Кажется / На самом деле», как мифы на страницах уроков =======================
    el('fears').innerHTML = [1, 2, 3, 4].map(function (i) {
      return '<div class="myth"><div class="seems"><span class="k">' + T('seems') + '</span>' + T('f' + i + 'a') + '</div>' +
        '<div class="really"><span class="k">' + T('really') + '</span>' + T('f' + i + 'b') + '</div></div>';
    }).join('');

    // ======================= Маршрут =======================
    // Ссылки только внутри сайта: работают офлайн, с флешки
    var STEPS = [
      [['b_lesson0', '../viz/computer/index.html', 'arrow']],
      [['b_warm1', '../warmup/index.html?lesson=1', 'code'], ['b_lesson1', '../viz/what-is-ml/index.html', 'arrow']],
      [['b_home', '../index.html', 'book']],
      [['b_home', '../index.html', 'book']],
      [['b_pybook', '../book/python/index.html', 'book'], ['b_roadmap', '../roadmap/index.html', 'map']]
    ];
    el('route').innerHTML = STEPS.map(function (res, i) {
      var n = i + 1;
      return '<li class="step">' +
        '<span class="step-tag">' + T('stepTag', { n: n }) + '</span>' +
        '<div><h3>' + T('s' + n + '_title') + '</h3><p class="time">' + T('s' + n + '_time') + '</p>' + T('s' + n + '_text') +
        '<div class="res">' + res.map(function (r) { return '<a class="btn" href="' + r[1] + '">' + MLViz.icon(r[2]) + T(r[0]) + '</a>'; }).join('') + '</div>' +
        '</div></li>';
    }).join('');
  })();
  </script>
</body>
</html>
