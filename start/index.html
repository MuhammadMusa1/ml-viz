    function href(id) { return '../viz/' + id + '/index.html'; }
    function opt(s) { return s.charAt(0) === '@' ? T(s.slice(1)) : esc(s); }

    var askEl = el('ask'), codeEl = el('code'), grid = el('taskGrid'), answerEl = el('answer');
    var game = MLViz.quiz({
      box: el('game'),
      rounds: QUESTIONS.length,
      text: {
        step: function (q) { return T('step', { i: q.i + 1, n: q.n }); },
        next: T('next'), finish: T('finish'), finishTitle: T('finishTitle'), again: T('again'),
        final: finalHtml
      },
      start: function (q) { q.data.ok = {}; grid.hidden = false; askEl.hidden = false; },
      round: function (q) {
        var it = QUESTIONS[q.i], dunno = it.opts.length;
        askEl.textContent = T('q_' + it.id);
        // Код показываем слева, как в разминках; вопрос без кода — варианты на всю ширину
        codeEl.hidden = !it.code;
        grid.classList.toggle('wide', !it.code);
        codeEl.innerHTML = it.code ? MLPyTasks.codeHtml(it.code) : '';
        answerEl.className = 'choices' + (it.code ? ' mono' : '');
        q.choices(answerEl, it.opts.map(opt).concat(['<span style="font-family: var(--font)">' + T('dunno') + '</span>']),   // «Не знаю» — не вывод программы, поэтому обычным шрифтом
          function (k) { return k === it.right; },
          function (k, ok) {
            q.data.ok[it.id] = ok;
            var head = ok ? T('vRight') : k === dunno ? T('vDunno') : T('vWrong');
            q.answer(ok ? 1 : 0, '<div class="verdict ' + (ok ? 'ok' : 'no') + '"><span class="mark" aria-hidden="true">' + (ok ? '✓' : '✕') + '</span>' +
              '<div><b class="v">' + head + '</b>' + T('x_' + it.id) + '</div></div>');
          });
      },
      onEnd: function () { grid.hidden = true; askEl.hidden = true; }
    });

    // Итог: счёт по темам и маршрут. Python и компьютер — до урока 1, математика — «по пути», к своему уроку.
    function finalHtml(q) {
      var ok = q.data.ok, now = [], math = [], seen = {};
      function wrong(area) { return QUESTIONS.filter(function (it) { return it.area === area && !ok[it.id]; }); }
      function add(list, id, why) {
        if (seen[id]) return;
        seen[id] = 1;
        var it = item(id);
        if (it) list.push({ id: id, it: it, why: why });
      }
      wrong('c').forEach(function (x) { add(now, x.page, T('why_computer')); });
      wrong('p').forEach(function (x) { add(now, x.page, T('why_py')); });
      var ready = !now.length;
      add(now, 'what-is-ml', T('why_lesson1'));
      wrong('m').forEach(function (x) { var it = item(x.page); add(math, x.page, T('why_math', { n: it ? it.forLessons[0] : 1 })); });

      function li(r, n) {
        return '<li><span class="n">' + n + '</span><div><b><a href="' + href(r.id) + '">' + MLViz.lessonLabel(r.it) + ' · ' + title(r.it) + '</a></b><br>' + r.why + '</div></li>';
      }
      var areas = AREAS.map(function (a) {
        var all = QUESTIONS.filter(function (it) { return it.area === a; });
        var c = all.filter(function (it) { return ok[it.id]; }).length;
        return '<li><span class="n">' + T('areaScore', { c: c, n: all.length }) + '</span><b>' + T('area_' + a) + '</b></li>';
      }).join('');

      return '<div class="final"><div>' +
        '<p class="sub">' + T('scoreLabel') + '</p><p class="score"><b>' + q.score + '</b> ' + T('scoreOf', { n: q.n }) + '</p>' +
        '<ul class="repeat-list">' + areas + '</ul><p class="note">' + T('notGrade') + '</p></div><div>' +
        (ready ? '<p><b>' + T('readyNow') + '</b></p>' : '') +
        '<p class="sub">' + T('routeNow') + '</p><ul class="repeat-list">' + now.map(function (r, i) { return li(r, i + 1); }).join('') + '</ul>' +
        '<div class="row"><a class="btn" href="../warmup/index.html?lesson=1">' + MLViz.icon('code') + T('warm1') + '</a></div>' +
        (wrong('p').length ? '' : '<p class="note">' + T('pyLater') + '</p>') +
        '<p class="sub">' + T('routeMath') + '</p>' +
        (math.length ? '<ul class="repeat-list">' + math.map(function (r, i) { return li(r, now.length + i + 1); }).join('') + '</ul>' : '<p class="note">' + T('mathOk') + '</p>') +
        '</div></div>';
    }
    game.start();
  })();
  </script>
</body>
</html>
